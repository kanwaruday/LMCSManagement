<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LMCS — Setup</title>
<meta name="theme-color" content="#CE0000">
<link rel="stylesheet" href="../assets/style.css?v=0049023a">
<link rel="stylesheet" href="../office/office.css?v=21086d0b">
<link rel="stylesheet" href="../assets/game/game.css?v=ee9ca522">
<link rel="stylesheet" href="../assets/game/base.css?v=4774c2bb">
<style>
  body { min-height: 100vh; }
  .back { margin-top: 20px; }
  /* the setup quests in the game baseline's look (base.css): school red for the main button, quiet for the rest */
  .cq-banner { margin: 0 0 12px; padding: 10px 12px; background: var(--gb-warn-soft); border: 1.5px solid var(--gb-gold); border-radius: 12px; font-weight: 700; color: var(--gb-warn); }
  .cq-note { margin: 0 0 8px; padding: 10px 12px; background: var(--gb-paper); border: 1px solid var(--gb-line); border-radius: 12px; font-size: .95rem; }
  .cq-attn { border-color: var(--gb-red); }
  .cq-note button.linklike { min-height: 44px; min-width: 44px; padding: 0 8px; border: 0; background: none; color: var(--gb-red-ink); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
  .gb .btn-lg, .gb .office-form button { border-radius: 10px; border-color: var(--gb-red-ink); background: var(--gb-red); color: #fff; font-weight: 700; }
  .gb .office-form button.secondary, .gb button.linklike { background: var(--gb-paper); color: var(--gb-red-ink); border-color: var(--gb-line); }
  .gb .office-form button.sd-confirm { background: var(--gb-ok); border-color: var(--gb-ok); }
  .gb .office-form input, .gb .office-form select, .gb .office-form textarea { border-color: var(--gb-line); border-radius: 10px; background: var(--gb-paper); }
  .gb .sd-card, .gb .sd-row, .gb .sd-item { border-color: var(--gb-line); border-radius: 14px; background: var(--gb-paper); }
  .gb .sd-card:active { background: var(--gb-gold-soft); border-color: var(--gb-gold); }
  .gb .sd-back { color: var(--gb-red-ink); }
  .gb .sd-ok { color: var(--gb-ok); }
  .sd-toast { min-height: 1.2em; font-weight: 700; color: #1a7f3c; }
  #lmcs-gate { position: fixed; inset: 0; z-index: 99999; background: #fff; display: flex; align-items: center; justify-content: center; }
  #lmcs-gate .auth-gate { max-width: 380px; margin: 0 auto; padding: 32px 28px; border: 1px solid #ddd; border-top: 3px solid #CE0000; border-radius: 6px; text-align: center; }
  #lmcs-gate .auth-gate p { color: #555; font-size: 13px; line-height: 1.6; margin: 0 0 20px; }
  #lmcs-gate #lmcs-g-signin { display: flex; justify-content: center; }
  #lmcs-gate .auth-denied { margin-top: 16px; background: #fde8e8; border: 1px solid #CE0000; color: #a70000; border-radius: 8px; padding: 12px 14px; font-size: 12px; line-height: 1.6; text-align: left; }
</style>
</head>
<body class="gb">
<div id="lmcs-gate"><div id="lmcs-gate-slot"></div></div>
<script src="../assets/auth.js?v=4ad1f1b6"></script>
<script src="../assets/game/game.js?v=283ee731"></script>

<header class="gb-head"><div><div><h1>Setup</h1><p>Confirm what the portal knows</p></div></div></header>
<main class="gb-page">
  <section id="game-root" hidden></section>
  <div id="cq-root"></div>
  <a class="back gb-btn" href="../index.html">Back to my page</a>
</main>
<script>
  // came from the Owner's Kingdom: the way back is the Kingdom (same site only)
  (function () { try { var r = new URL(document.referrer); if (r.origin === location.origin && /\/owner\/kingdom\.html$/.test(r.pathname)) { var b = document.querySelector('.back'); b.href = '../owner/kingdom.html'; b.textContent = 'Back to the Kingdom'; } } catch (e) { /* no referrer */ } })();
</script>

<script type="module">
import { mountConfirmQuests, parseLink, SETUP_TOUR_BEATS } from '../assets/setup/confirm-values.js';
const GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // same value as office/js/config.js
const link = parseLink(location.search);
(LMCS.getSession() ? Promise.resolve(LMCS.getSession()) : LMCS.requireSession('#lmcs-gate-slot')).then(async (s) => {
  const session = s || LMCS.getSession();
  document.getElementById('lmcs-gate').style.display = 'none';
  await mountConfirmQuests(document.getElementById('cq-root'), { session, backendUrl: GAME_BACKEND_URL, link });
  if (link.sample || typeof window.LMCSGame === 'undefined') return;
  try {
    window.LMCSGame.mount(document.getElementById('game-root'), { session: LMCS.getSession() || session, backendUrl: GAME_BACKEND_URL, root: '../',
      only: 'cq', title: 'Setup', tour: { id: 'setup-confirm', beats: SETUP_TOUR_BEATS } });
  } catch (e) { console.warn('game layer', e); }
});
</script>
</body>
</html>
