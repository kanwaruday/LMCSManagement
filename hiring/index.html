<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMCS — Hiring Dashboard</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://accounts.google.com"><link rel="stylesheet" href="../assets/campus-picker.css?v=153d68d7">
<style>
:root{--red:#CE0000;--red-h:#a50000;--red-lt:rgba(206,0,0,.07);--dark:#1a1a1a;--gray:#555;--lgray:#f5f5f5;--border:#ddd;--white:#fff;--green:#15803d;--green-lt:#dcfce7;--amber:#92400e;--amber-lt:#fef3c7;--blue:#1d4ed8;--blue-lt:#dbeafe}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--white);color:var(--dark);min-height:100vh;font-size:13px;line-height:1.5;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
.hdr{background:var(--red);color:#fff;padding:0 16px;min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;flex-wrap:wrap}
.hdr h1{font-size:14px;font-weight:700;letter-spacing:.3px}
.hdr p{font-size:9.5px;opacity:.75;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:6px 0}
.hdr-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.95);padding:5px 12px;border-radius:4px;font-size:11px;font-weight:600;text-decoration:none;cursor:pointer;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.22)}
#appBody{flex:1;padding:16px;max-width:1100px;margin:0 auto;width:100%}
#authRoot{max-width:420px;margin:60px auto}
.welcome{display:flex;align-items:center;justify-content:space-between;background:var(--lgray);border:1px solid var(--border);border-radius:6px;padding:10px 14px;margin-bottom:12px;flex-wrap:wrap;gap:8px}
.signout{font-size:11px;color:var(--gray);text-decoration:none}
.denied{text-align:center;padding:60px 20px;color:var(--gray)}
.status-bar{display:flex;align-items:center;gap:8px;font-size:11.5px;padding:7px 12px;border-radius:5px;margin-bottom:12px;background:var(--lgray);color:var(--gray);border:1px solid var(--border)}
.status-bar.ok{background:rgba(21,128,61,.08);color:var(--green);border-color:rgba(21,128,61,.3)}
.status-bar.err{background:var(--red-lt);color:var(--red);border-color:rgba(206,0,0,.3)}
.status-bar .retry-btn{margin-left:auto;background:#fff;border:1px solid currentColor;color:inherit;border-radius:4px;padding:2px 9px;font-size:11px;cursor:pointer}
.spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.datasrc-links{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:10.5px;color:#8A96A6;margin-bottom:12px;align-items:center}
.datasrc-links a{color:#8A96A6}

/* Toolbar: view tabs, school filter, search, add */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{background:var(--white);border:1.5px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--gray);cursor:pointer}
.tab[aria-pressed="true"]{background:var(--red-lt);border-color:var(--red);color:var(--red)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:10px;background:var(--lgray);font-size:10.5px;text-align:center}
.search{flex:1;min-width:160px;padding:7px 10px;border:1.5px solid var(--border);border-radius:6px}
.search:focus,.inp:focus,.sel:focus,textarea:focus{outline:2px solid var(--red);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:5px;border:1.5px solid var(--border);background:var(--white);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--dark);min-height:32px}
.btn:hover{border-color:var(--red);color:var(--red)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:var(--red-h);color:#fff}
.btn.ghost{border-color:transparent;color:var(--gray)}
.btn.danger{color:#991b1b}
.btn:disabled{opacity:.5;cursor:default}
.campus-row{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.chip-btn{background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:5px 12px;font-size:11.5px;font-weight:600;color:var(--gray);cursor:pointer}
.chip-btn[aria-pressed="true"]{background:var(--red-lt);border-color:var(--red);color:var(--red)}

/* Today header counts */
.counts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.count{border:1px solid var(--border);border-radius:8px;padding:10px 12px;background:var(--white);text-align:left;cursor:pointer}
.count b{display:block;font-size:22px;line-height:1.1}
.count span{font-size:11px;color:var(--gray)}
.count:hover{border-color:var(--red)}
@media (max-width:600px){.counts{grid-template-columns:repeat(2,1fr)}}

.section{margin-bottom:18px}
.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.section h2 .n{background:var(--lgray);border-radius:10px;padding:0 7px;font-size:11px}
.empty{color:var(--gray);font-size:12px;padding:10px 12px;border:1px dashed var(--border);border-radius:6px}

/* Candidate card */
.card{display:grid;grid-template-columns:1fr auto;gap:6px 12px;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:6px;background:var(--white)}
.card:hover{border-color:#c9c9c9}
.card .who{min-width:0}
.card .name{font-weight:700;font-size:13.5px}
.card .meta{font-size:11.5px;color:var(--gray);overflow-wrap:anywhere}
.card .meta a{color:var(--red);text-decoration:none}
.card .acts{display:flex;gap:6px;flex-wrap:wrap;align-items:flex-start;justify-content:flex-end}
.when{font-weight:700;color:var(--dark)}
.id{font-family:monospace;font-size:10.5px;color:var(--gray);background:var(--lgray);padding:1px 5px;border-radius:3px;font-weight:400}
.pill{display:inline-block;font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:10px;background:var(--lgray);color:var(--gray);margin-right:4px;white-space:nowrap}
.pill.stage{background:var(--blue-lt);color:var(--blue)}
.pill.warn{background:var(--amber-lt);color:var(--amber)}
.pill.ok{background:var(--green-lt);color:var(--green)}
.pill.bad{background:#fee2e2;color:#991b1b}
@media (max-width:600px){.card{grid-template-columns:1fr}.card .acts{justify-content:flex-start}}

/* Modal (candidate panel, add applicant, forms) */
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:900;overflow:auto;padding:16px}
.modal[open]{display:block}
.modal-box{background:#fff;max-width:760px;margin:0 auto;border-radius:10px;padding:16px;position:relative}
.modal-close{position:absolute;top:10px;right:10px}
.modal h3{font-size:16px;margin-bottom:2px;padding-right:60px}
.block{border-top:1px solid var(--border);padding-top:12px;margin-top:12px}
.block h4{font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin-bottom:8px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid.three{grid-template-columns:repeat(3,1fr)}
@media (max-width:600px){.grid{grid-template-columns:1fr}.grid.three{grid-template-columns:1fr 1fr}}
.fld{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--gray)}
.fld.wide{grid-column:1/-1}
.fld b{color:var(--dark);font-weight:600}
.req::after{content:" *";color:var(--red)}
.inp,.sel,textarea{border:1px solid #c9c9c9;border-radius:5px;padding:6px 8px;font-size:13px;color:var(--dark);background:#fff;width:100%}
textarea{min-height:56px;resize:vertical}
.ladder{display:flex;flex-wrap:wrap;gap:4px;margin:8px 0}
.rung{font-size:10.5px;padding:2px 8px;border-radius:10px;border:1px solid var(--border);color:var(--gray)}
.rung.done{background:var(--green-lt);border-color:#bbf7d0;color:var(--green);font-weight:600}
.rung.now{background:var(--red-lt);border-color:var(--red);color:var(--red);font-weight:700}
.scores{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:600px){.scores{grid-template-columns:repeat(2,1fr)}}
.capwrap{overflow-x:auto;border:1px solid var(--border);border-radius:6px}
.cap{border-collapse:collapse;font-size:11px;min-width:640px}
.cap th,.cap td{border-bottom:1px solid var(--border);padding:3px;text-align:center}
.cap th{background:var(--lgray);font-weight:600;color:var(--gray)}
.cap td:first-child{text-align:left;min-width:120px}
.cap select{border:1px solid #ddd;border-radius:3px;padding:2px;font-size:11px;width:38px}
.radio-row{display:flex;flex-wrap:wrap;gap:6px}
.radio-row label{display:flex;align-items:center;gap:5px;border:1.5px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--dark);font-size:12px}
.radio-row input:checked+span{font-weight:700;color:var(--red)}
.formmsg{font-size:12px;margin-top:8px;min-height:16px}
.formmsg.err{color:#991b1b}
.formmsg.ok{color:var(--green)}
.report{border:1px solid var(--border);border-radius:6px;padding:8px 10px;margin-bottom:6px;font-size:12px}
.report .r-head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-weight:600}
.report.earlier{opacity:.7}
.total{font-weight:700;font-size:14px}
.note{font-size:11.5px;color:var(--gray)}
.foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}

#letterModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;overflow:auto;padding:16px}
#letterBox{background:#fff;max-width:860px;margin:0 auto;border-radius:8px;padding:12px}
#letterBar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
#letterSheet{font-family:'Times New Roman',serif;font-size:14px;line-height:1.35;padding:18px 28px;border:1px solid #ddd}
#letterSheet [contenteditable]{outline:1px dashed #cbd5e1}
#letterSheet table{width:100%;border-collapse:collapse;margin:12px 0}
#letterSheet td,#letterSheet th{border:1px solid #000;padding:3px 6px;vertical-align:top}
#letterSheet .lh{text-align:center;border-bottom:3px solid #000;padding-bottom:6px;margin-bottom:10px}
#letterSheet ol{padding-left:22px}
@media print{body>*:not(#letterModal){display:none!important}#letterModal{position:static;background:none;padding:0;display:block!important}#letterBar{display:none}#letterBox{padding:0;max-width:none}#letterSheet{border:0;padding:0}#letterSheet [contenteditable]{outline:none}}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <h1>Hiring Dashboard</h1>
    <p>Teaching applicants — today, appointments, by role, my actions and the rejected pool</p>
  </div>
  <div class="hdr-right">
    <a href="../principals-daily-reporting/index.html#approvals" id="aprLink" class="hdr-btn">✅ Approvals</a>
    <a href="../principal/index.html" class="hdr-btn" id="homeLink">🏠 Portal Home</a>
  </div>
</div>

<div id="appBody">
  <div id="authRoot"></div>
  <div id="appRoot" style="display:none">
    <div class="welcome" id="welcomeStrip"></div>
    <div class="status-bar" id="statusBar" style="display:none" role="status" aria-live="polite"></div>
    <div id="deniedRoot"></div>
    <div id="mainRoot" style="display:none">
      <div class="datasrc-links" id="datasrcHiring"></div>
      <div class="toolbar">
        <div class="tabs" role="group" aria-label="View">
          <button type="button" class="tab" data-act="view" data-view="today">Today</button>
          <button type="button" class="tab" data-act="view" data-view="appts">Appointments <span class="n" id="apptCount">0</span></button>
          <button type="button" class="tab" data-act="view" data-view="role">By role</button>
          <button type="button" class="tab" data-act="view" data-view="actions">My actions <span class="n" id="actCount">0</span></button>
          <button type="button" class="tab" data-act="view" data-view="pool">Rejected pool <span class="n" id="poolCount">0</span></button>
        </div>
        <input type="search" class="search" id="search" placeholder="Find anyone — name or phone" aria-label="Find an applicant by name or phone">
        <button type="button" class="btn primary" data-act="add">+ Add applicant</button>
      </div>
      <div id="campusRow" style="margin-bottom:12px"></div>
      <div id="view"></div>
    </div>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal-box">
    <button type="button" class="btn ghost modal-close" data-act="close" aria-label="Close">✕ Close</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="../assets/auth.js?v=f313a8d7"></script>
<script src="../assets/campus-picker.js?v=cd35c768"></script>
<script src="./hiring-view.js?v=7389ceb1"></script>
<script>
const PDR_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzpkFLy4KvTdSJfioz6wlgRGLjvO_GvbffhOYBb-hHybFtjGTk0ps-GzXz0FrQ9GmYdfg/exec';
const DOC_FORM_URLS = {
  LMS1: 'https://forms.gle/mEtGFD6vGhgK3kJG7', LMS2: 'https://forms.gle/LV1fy13jXzrrcXra9',
  LMS3: 'https://forms.gle/hHgMU9XqBxpk3gWd8', LMS4: 'https://forms.gle/1uFg6AuYpYmP7ukA9',
  LMS5: 'https://forms.gle/ZiTP8jQuJ4SstRSM6', LMS6: 'https://forms.gle/pKP62AwcJuat1byH7',
};
// Prefilled Staff Document Submission Forms (2026-10-03): only campuses whose entry IDs are known (LMS4 so far);
// the rest fall back to DOC_FORM_URLS. A Job Role value that isn't one of the form's labels is ignored by Google.
const DOC_FORM_PREFILL = {
  LMS4: { url: 'https://docs.google.com/forms/d/e/1FAIpQLSdNTYssKiHvr3v0F-tbOZP5_DNJgHjvauts8ttt1h1mar9XLg/viewform',
          name: 'entry.773686043', empId: 'entry.1648508931', role: 'entry.1017094729' },
};
const DOC_FORM_ROLE_LABEL = { PRT: 'PRT, TGT', TGT: 'PRT, TGT', PGT: 'PGT', NTT: 'NTT' };
// Data-source links (Owner/Coordinator): IDs duplicated from apps-script/hiring.gs -- keep in sync.
const DATASRC_APPLICANTS_SHEET_ID = '1aSCQ3IGO-ZP_5yRjtnMpZdlauTdWj3814ATD9qwskPQ';
const DATASRC_APPLICANTS_GID = '1181288827';
const DATASRC_IR_GID = '1241435504';
const DATASRC_TRACKER_GID = '1351967428';
const DATASRC_DOC_WORKBOOK_ID = '1PJ2acPOHopbHzzwGes8X4YPWSDBdXnd0zl46zvFCvIg'; // one workbook, one tab per campus
const CLASSES = ['M1', 'M2', 'M3', 'C1', 'C2', 'C3', 'C4', 'C5', 'C6', 'C7', 'C8', 'C9', 'C10', 'C11', 'C12'];
const SOURCES = ['Walk-in', 'Referral', 'Paper CV', 'Phone call', 'Other'];
const BED_OPTIONS = ['', 'Yes - TET qualified', 'Yes - TET not qualified', 'Yes', 'No', 'Not applicable'];
const DEMO_SCORES = [['pedagogy', 'Pedagogy'], ['content', 'Content'], ['interaction', 'Student Interaction'], ['response', 'Student Response'],
  ['management', 'Classroom Management'], ['clarity', 'Clarity & Audibility'], ['relatable', 'Makes Subject Relatable'], ['aids', 'Use of Teaching Aids']];
const REASON_GROUPS = { notnow: 'Not now (their choice)', filled: 'Position filled or closed', notsuitable: 'Not suitable (our call)', other: 'Other', none: 'Earlier (no reason recorded)' };

let SESSION = null;
let DATA = { applicants: [], statuses: [], rejectReasons: [], positions: [] };
let APPROVAL_STATUS = { campuses: [] };
let ROLES = [];             // every approved role in scope (from hiringapprovalstatus)
let VIEW = 'today';
let SEL = { all: true, campuses: [] }; // the shared campus picker's selection
let selectedRoleKey = null;
let OPEN_ROW = null;        // the candidate panel's row, so it re-renders after a save
let IS_PRINCIPAL = false;   // role Principal: an interview/demo time they set is booked at once (accepted); anyone else proposes
let APPTS = { toAccept: [], myProposals: [], upcoming: [] }; // apptlist (elevated only)
let SL_FILTER = 'all';      // By role: 'not' (not yet shortlisted) | 'yes' (shortlisted) | 'all'
const HV = window.HiringView;
const KIND_LABEL = { interview: 'Interview', demo: 'Demo', md: 'MD Academics interview' };

// ── helpers ───────────────────────────────────────────────────────
function esc_(v) {
  return String(v === undefined || v === null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}
function safeUrl_(u) { return /^https?:\/\//i.test(String(u || '')) ? String(u) : ''; }
function gasGet_(action, params) {
  const qs = Object.assign({ action: action, idToken: SESSION.idToken }, params || {});
  const url = PDR_BACKEND_URL + '?' + Object.keys(qs).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(qs[k]); }).join('&');
  return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); });
}
function gasPost_(action, body) {
  return fetch(PDR_BACKEND_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action: action, idToken: SESSION.idToken }, body)) })
    .then(function (r) { return r.json(); });
}
function myCampuses_() { return LMCSCampus.scope(SESSION); } // the shared picker's scope: from the session only, LMS 1-6 (no HES here)
function campusesOf_(a) { return (String(a.branches || '').match(/LMS-\d/g) || []).map(function (t) { return 'LMS' + t.slice(4); }); }
function campusOf_(a) {
  const mine = myCampuses_(), tags = campusesOf_(a);
  return tags.filter(function (c) { return mine.indexOf(c) !== -1; })[0] || tags[0] || '';
}
function inFilter_(a) { return HV.inSel_(campusesOf_(a), SEL); }
function dayKey_(d) { d = new Date(d); return isNaN(d) ? '' : d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function todayKey_() { return dayKey_(new Date()); }
function fmtTime_(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
function fmtDay_(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString([], { weekday: 'short', day: 'numeric', month: 'short' }); }
function fmtWhen_(iso) { return iso ? fmtDay_(iso) + ', ' + fmtTime_(iso) : ''; }
function toLocalInput_(iso) { const d = new Date(iso); if (isNaN(d)) return ''; const p = function (n) { return ('0' + n).slice(-2); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + 'T' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function byRow_(row) { return (DATA.applicants || []).filter(function (a) { return a.row === row; })[0]; }
function active_(a) { return a.status !== 'Rejected' && a.status !== 'Hired'; }
function reasonGroup_(a) {
  const hit = (DATA.rejectReasons || []).filter(function (r) { return r.label === a.rejectReason; })[0];
  return hit ? hit.group : (a.rejectReason ? 'notsuitable' : 'none');
}
// The approved role this applicant is being looked at for: the clicked role chip if they match it, else their first match.
function roleFor_(a) {
  const keys = a.matchedRoleKeys || [];
  const key = keys.indexOf(selectedRoleKey) !== -1 ? selectedRoleKey : keys[0];
  return ROLES.filter(function (r) { return r.roleKey === key; })[0] || null;
}
function salaryLinkUrl_(a) {
  const role = roleFor_(a), school = campusOf_(a);
  const p = new URLSearchParams({ name: a.name, applicantId: a.applicantId });
  if (school) p.set('school', school);
  if (role && role.roleLevel) p.set('role', role.roleLevel);
  if (role && role.subjects) p.set('subjects', role.subjects);
  return '../salary/index.html?' + p.toString();
}
const DOCS_PAGE_ = '../staff/add-employee.html?view=documents'; // the Staff Portal's Documents page
function docFormUrl_(a) {
  const school = campusOf_(a), cfg = DOC_FORM_PREFILL[school];
  if (!cfg) return DOC_FORM_URLS[school] || '';
  const p = new URLSearchParams({ usp: 'pp_url' });
  p.set(cfg.name, a.name);
  const code = a.employeeCode || a.expectedEmployeeCode;
  if (code) p.set(cfg.empId, code);
  const role = roleFor_(a), label = role && DOC_FORM_ROLE_LABEL[String(role.roleLevel || '').toUpperCase()];
  if (label) p.set(cfg.role, label);
  return cfg.url + '?' + p.toString();
}

// ── what happens next, per stage ──────────────────────────────────
// One primary action per candidate. Every decision is the Principal's.
function nextStep_(a) {
  const open = function (k) { return HV.openAppt_(a, k); };
  if (active_(a) && a.stageMarks && a.stageMarks.rejectPending) return { act: 'open', label: 'Confirm rejection' };
  if (a.reportPending === 'interview') return { act: 'interview', label: 'File interview report' };
  if (a.reportPending === 'demo') return { act: 'demo', label: 'File demo report' };
  const book = IS_PRINCIPAL ? 'Book ' : 'Propose ';
  switch (a.status) {
    case '': return { act: 'shortlist', label: 'Shortlist' };
    case 'Shortlisted': return open('interview') ? { act: 'open', label: 'Interview proposed', disabled: true } : { act: 'book', kind: 'interview', label: book + 'interview' };
    case 'Interview Scheduled': return { act: 'interview', label: 'Interview report' };
    case 'Interview Done': {
      // The demo report only once a demo is accepted; a proposed one waits for the Principal's accept. A past, reported demo is
      // history ("another demo" with no time yet), so the next step is booking one.
      const d = open('demo');
      if (d && d.status === 'accepted') return { act: 'demo', label: 'Demo report' };
      return d ? { act: 'open', label: 'Demo proposed', disabled: true } : { act: 'book', kind: 'demo', label: book + 'demo' };
    }
    case 'Demo Done': return { act: 'salary', label: 'Salary offer' };
    case 'Salary Offer': return open('md') ? { act: 'open', label: 'MD interview proposed', disabled: true } : { act: 'book', kind: 'md', label: 'Propose MD interview' };
    case 'MD Academics Interview Scheduled': return { act: 'open', label: 'Awaiting Owner', disabled: true };
    case 'Hiring Approved': return { act: 'open', label: 'Joining & documents' };
    case 'Hired': return { act: 'open', label: 'Appointment letter' };
    case 'Rejected': return { act: 'revive', label: 'Revive' };
  }
  return null;
}

function chips_(a) {
  const out = ['<span class="pill ' + (a.status === 'Rejected' ? 'bad' : a.status === 'Hired' ? 'ok' : 'stage') + '">' + esc_(a.status || 'Not shortlisted') + '</span>'];
  if (a.reportPending) out.push('<span class="pill warn">' + (a.reportPending === 'interview' ? 'Interview' : 'Demo') + ' report pending</span>');
  if (active_(a) && a.stageMarks && a.stageMarks.rejectPending) out.push('<span class="pill bad">Rejection to confirm</span>');
  (a.appointments || []).forEach(function (x) {
    if (x.status === 'proposed') out.push('<span class="pill warn">' + esc_(KIND_LABEL[x.kind]) + ' proposed · ' + esc_(fmtWhen_(x.start)) + '</span>');
    else if (x.status === 'declined' && !HV.openAppt_(a, x.kind) && active_(a)) out.push('<span class="pill bad" title="' + esc_(x.declineNote) + '">' + esc_(KIND_LABEL[x.kind]) + ' declined</span>');
  });
  if (a.round > 1) out.push('<span class="pill">Revived · round ' + a.round + '</span>');
  if (a.noOpenRole && active_(a)) out.push('<span class="pill warn" title="No approved New/ Backup Position matches this applicant">No open role</span>');
  if (a.source) out.push('<span class="pill">' + esc_(a.source) + '</span>');
  if (a.status === 'Rejected' && a.rejectReason) out.push('<span class="pill bad">' + esc_(a.rejectReason) + '</span>');
  return out.join('');
}

function stepBtn_(a, step) {
  return '<button type="button" class="btn primary" data-act="' + esc_(step.act) + '" data-row="' + a.row + '"' + (step.kind ? ' data-kind="' + esc_(step.kind) + '"' : '') + (step.disabled ? ' disabled' : '') + '>' + esc_(step.label) + '</button>';
}
// One candidate card. `when` = optional bold label; `step` overrides the primary action (false = none); `extra` = more buttons (HTML).
function cardHtml_(a, when, step, extra) {
  const digits = String(a.phone || '').replace(/\D/g, '').slice(-10);
  const phone = digits.length === 10 ? '<a href="tel:+91' + digits + '">' + esc_(a.phone) + '</a> · <a href="https://wa.me/91' + digits + '" target="_blank" rel="noopener">WhatsApp</a>' : esc_(a.phone);
  const role = roleFor_(a);
  const what = role ? (role.roleLevel || '') + (role.subjects ? ': ' + role.subjects : '') : (a.subjects || '—');
  if (step === undefined) step = nextStep_(a);
  const acts = [];
  if (step) acts.push(stepBtn_(a, step));
  if (extra) acts.push(extra);
  if (active_(a)) acts.push('<button type="button" class="btn danger" data-act="reject" data-row="' + a.row + '">Reject</button>');
  acts.push('<button type="button" class="btn" data-act="open" data-row="' + a.row + '">Open</button>');
  return '<div class="card"><div class="who">' +
    '<div class="name">' + (when ? '<span class="when">' + esc_(when) + '</span> · ' : '') + esc_(a.name) + ' <span class="id">' + esc_(a.applicantId) + '</span></div>' +
    '<div class="meta">' + phone + ' · ' + esc_(what) + ' · ' + esc_(campusesOf_(a).map(LMCS.campusLabel).join(', ') || '—') + '</div>' +
    '<div style="margin-top:4px">' + chips_(a) + '</div></div>' +
    '<div class="acts">' + acts.join('') + '</div></div>';
}

function section_(id, title, items, emptyText) {
  return '<div class="section" id="sec-' + id + '"><h2>' + esc_(title) + ' <span class="n">' + items.length + '</span></h2>' +
    (items.length ? items.join('') : '<div class="empty">' + esc_(emptyText) + '</div>') + '</div>';
}
function countsHtml_(counts) {
  return '<div class="counts">' + counts.map(function (c) {
    return '<button type="button" class="count" data-act="jump" data-to="' + c[0] + '"><b>' + c[1] + '</b><span>' + esc_(c[2]) + '</span></button>';
  }).join('') + '</div>';
}
function calRetryBtn_(x) {
  return x.status === 'accepted' && x.calendarMode === 'none' ? '<button type="button" class="btn" data-act="calretry" data-id="' + esc_(x.id) + '" title="The event could not be put on the calendar">Calendar not updated — Retry</button>' : '';
}
// Cancel: a proposal, or an accepted appointment still ahead, for someone not Rejected/Hired. A past accepted one is history
// (the backend refuses it: cancelling would clear the applicant's time column).
function cancelBtn_(x, a) {
  const open = x.status === 'proposed' || (x.status === 'accepted' && new Date(x.start).getTime() > Date.now());
  return open && (!a || active_(a)) ? '<button type="button" class="btn ghost" data-act="cancelappt" data-id="' + esc_(x.id) + '">Cancel</button>' : '';
}

// ── views ─────────────────────────────────────────────────────────
function visible_() { return (DATA.applicants || []).filter(inFilter_); }

// Today (Principal): accepted interviews and demos only -- today in time order, then the next 7 days. Nothing else.
function renderToday_() {
  const t = HV.todayItems_(visible_(), Date.now());
  const card = function (fmt) {
    return function (s) { return cardHtml_(s.a, KIND_LABEL[s.appt.kind] + ' ' + fmt(s.appt.start), { act: s.appt.kind, label: KIND_LABEL[s.appt.kind] + ' report' }, calRetryBtn_(s.appt)); };
  };
  return section_('scheduled', 'Today', t.today.map(card(fmtTime_)), 'Nothing booked for today.') +
    section_('upcoming', 'Next 7 days', t.next.map(card(fmtWhen_)), 'Nothing booked for the coming week.') +
    section_('furthest', 'Furthest along', HV.furthest_(visible_(), Date.now(), 5).map(function (a) { return cardHtml_(a, '', undefined); }), 'Nobody is in progress yet.');
}

// Appointments: proposals waiting for me (Accept, or Decline with a note), then what I proposed.
function inCampus_(x) { return HV.inSel_([x.campus], SEL); }
// Accept, or Decline with a note: a proposal waiting for me, or (Owner override) any proposed interview/demo in the panel.
function overrideBtns_(x) {
  return '<button type="button" class="btn primary" data-act="accept" data-id="' + esc_(x.id) + '">Accept</button>' +
    '<input class="inp" id="dn-' + esc_(x.id) + '" placeholder="Why decline? (they see it)" aria-label="Reason for declining" style="width:auto;flex:1;min-width:140px">' +
    '<button type="button" class="btn danger" data-act="decline" data-id="' + esc_(x.id) + '">Decline</button>';
}
function apptCardHtml_(x, mine) {
  const pill = { proposed: 'warn', accepted: 'ok', declined: 'bad' }[x.status] || '';
  const acts = mine ? cancelBtn_(x, byRow_(Number(x.row))) + calRetryBtn_(x) : overrideBtns_(x);
  return '<div class="card"><div class="who"><div class="name"><span class="when">' + esc_(KIND_LABEL[x.kind] + ' · ' + fmtWhen_(x.start)) + '</span> · ' + esc_(x.name) + ' <span class="id">' + esc_(x.applicantId) + '</span></div>' +
    '<div class="meta">' + esc_([x.phone, LMCS.campusLabel(x.campus), x.place, 'proposed by ' + x.proposedBy].filter(Boolean).join(' · ')) + '</div>' +
    (x.note ? '<div class="note">' + esc_(x.note) + '</div>' : '') +
    '<div style="margin-top:4px">' + (mine ? '<span class="pill ' + pill + '">' + esc_(x.status) + '</span>' : '') + (x.declineNote ? '<span class="note">Declined: ' + esc_(x.declineNote) + '</span>' : '') + '</div></div>' +
    '<div class="acts">' + acts + '<button type="button" class="btn" data-act="open" data-row="' + esc_(x.row) + '">Open</button></div></div>';
}
function renderAppts_() {
  return section_('toaccept', 'Waiting for you', (APPTS.toAccept || []).filter(inCampus_).map(function (x) { return apptCardHtml_(x, false); }), 'No proposals waiting for you.') +
    section_('mine', 'Your proposals', (APPTS.myProposals || []).filter(inCampus_).map(function (x) { return apptCardHtml_(x, true); }), 'You have no open proposals (MD Academics interviews you propose show here).');
}

// My actions (elevated): everything waiting on the Principal, each with its one action.
function renderActions_() {
  const book = IS_PRINCIPAL ? 'Book demo' : 'Propose demo';
  const steps = { interview: { act: 'interview' }, demo: { act: 'demo' }, bookdemo: { act: 'book', kind: 'demo', label: book }, salary: { act: 'salary' },
    md: { act: 'book', kind: 'md' }, joining: { act: 'open' }, confirmreject: { act: 'confirmrej' } };
  const waitingOthers = HV.waitingOnOthers_(visible_(), Date.now()).map(function (it) {
    const a = byRow_(it.row);
    return cardHtml_(a, it.md ? 'MD ' + fmtWhen_(it.md.start) : '', undefined, '<span class="note">' + esc_(it.reason) + '</span>');
  });
  return section_('actions', 'Waiting on you', HV.myActions_(visible_(), Date.now()).map(function (it) {
    const a = byRow_(it.row);
    const step = Object.assign({ label: it.label }, steps[it.kind]);
    if (it.kind !== 'confirmreject') return cardHtml_(a, '', step);
    const p = a.stageMarks.rejectPending;
    return cardHtml_(a, 'Report says reject: ' + p.reason + (p.note ? ' — ' + p.note : ''), step,
      '<button type="button" class="btn" data-act="confirmrej" data-confirm="0" data-row="' + a.row + '">Don\'t reject</button>');
  }), 'Nothing is waiting on you.') + section_('waiting', 'Waiting on the Owner', waitingOthers, 'Nobody is waiting on the Owner.');
}

function renderRole_() {
  const campuses = LMCSCampus.filter(APPROVAL_STATUS.campuses || [], SEL, 'campusId');
  const roles = [];
  campuses.forEach(function (c) { c.newPositions.forEach(function (r) { roles.push({ campusId: c.campusId, roleLevel: r.roleLevel, subjects: r.subjects, roleKey: r.roleKey }); }); });
  if (!roles.length) return '<div class="empty">No approved "New/ Backup Position" roles here. Request one on the <a href="../principals-daily-reporting/index.html#approvals">Approvals</a> tab.</div>';
  let html = '<div class="campus-row" role="group" aria-label="Open role">' + roles.map(function (r) {
    const label = (campuses.length > 1 ? LMCS.campusLabel(r.campusId) + ' — ' : '') + (r.roleLevel || 'Any') + (r.subjects ? ': ' + r.subjects : '');
    const n = (DATA.applicants || []).filter(function (a) { return (a.matchedRoleKeys || []).indexOf(r.roleKey) !== -1 && active_(a); }).length;
    return '<button type="button" class="chip-btn" data-act="role" data-key="' + esc_(r.roleKey) + '" aria-pressed="' + (r.roleKey === selectedRoleKey) + '">' + esc_(label) + ' · ' + n + '</button>';
  }).join('') + '</div>';
  if (!selectedRoleKey) return html + '<div class="empty">Pick a role to see its applicants, best match first.</div>';
  html += '<div class="campus-row" role="group" aria-label="Shortlist filter">' + [['not', 'Not yet shortlisted'], ['yes', 'Shortlisted'], ['all', 'All']].map(function (f) {
    return '<button type="button" class="chip-btn" data-act="slfilter" data-f="' + f[0] + '" aria-pressed="' + (SL_FILTER === f[0]) + '">' + f[1] + '</button>';
  }).join('') + '</div>';
  const list = (DATA.applicants || []).filter(function (a) {
    if ((a.matchedRoleKeys || []).indexOf(selectedRoleKey) === -1) return false;
    return SL_FILTER === 'not' ? a.status === '' : SL_FILTER === 'yes' ? a.status !== '' && a.status !== 'Rejected' : true;
  });
  const unSl = function (a) { return a.status === 'Shortlisted' ? '<button type="button" class="btn ghost" data-act="unshortlist" data-row="' + a.row + '">Un-shortlist</button>' : ''; };
  return html + (list.length ? list.map(function (a) { return cardHtml_(a, a.matchScore != null ? 'Match ' + a.matchScore : '', undefined, unSl(a)); }).join('') : '<div class="empty">No applicants here.</div>');
}

function renderPool_() {
  const pool = visible_().filter(function (a) { return a.status === 'Rejected'; });
  if (!pool.length) return '<div class="empty">No rejected candidates here.</div>';
  return ['notnow', 'filled', 'notsuitable', 'other', 'none'].map(function (g) {
    const items = pool.filter(function (a) { return reasonGroup_(a) === g; });
    return items.length ? section_('pool-' + g, REASON_GROUPS[g], items.map(function (a) { return cardHtml_(a); }), '') : '';
  }).join('') + '<p class="note">"Not now" and "Position filled" are the first people to call when a role opens. Reviving starts them again from a fresh interview; their earlier round stays on their record.</p>';
}

function renderSearch_(q) {
  const digits = q.replace(/\D/g, ''), low = q.toLowerCase();
  const hits = (DATA.applicants || []).filter(function (a) {
    return (digits.length >= 4 && String(a.phone).replace(/\D/g, '').indexOf(digits) !== -1) || (low.length >= 2 && a.name.toLowerCase().indexOf(low) !== -1) || a.applicantId.toLowerCase() === low;
  });
  return section_('search', 'Matches for "' + q + '"', hits.slice(0, 50).map(function (a) { return cardHtml_(a); }),
    'No one by that name or number is visible to you. Applicants who match no open role and haven\'t been interviewed stay hidden — add them with "+ Add applicant" (an existing number just opens their record).');
}

function render_(keepPanel) { // keepPanel: leave an open candidate panel as it is (its form messages survive)
  const q = document.getElementById('search').value.trim();
  document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-pressed', String(t.dataset.view === VIEW && !q)); });
  document.getElementById('poolCount').textContent = visible_().filter(function (a) { return a.status === 'Rejected'; }).length;
  document.getElementById('apptCount').textContent = (APPTS.toAccept || []).filter(inCampus_).length;
  document.getElementById('actCount').textContent = HV.myActions_(visible_(), Date.now()).length;
  document.getElementById('view').innerHTML = q ? renderSearch_(q) : VIEW === 'role' ? renderRole_() : VIEW === 'pool' ? renderPool_() :
    VIEW === 'appts' ? renderAppts_() : VIEW === 'actions' ? renderActions_() : renderToday_();
  if (!keepPanel && OPEN_ROW && document.getElementById('modal').hasAttribute('open') && byRow_(OPEN_ROW) && document.getElementById('panel')) renderPanel_(OPEN_ROW);
}

// ── candidate panel ───────────────────────────────────────────────
function ladderHtml_(a) {
  const ladder = (DATA.statuses || []).filter(function (s) { return s !== 'Rejected'; });
  const idx = ladder.indexOf(a.status);
  return '<div class="ladder">' + ladder.map(function (s, i) {
    return '<span class="rung' + (i < idx ? ' done' : i === idx ? ' now' : '') + '">' + (i <= idx ? '✓ ' : '') + esc_(s) + '</span>';
  }).join('') + (a.status === 'Rejected' ? '<span class="rung now">✗ Rejected</span>' : '') + '</div>';
}

// A clerk-typed report carries its scan: "Scan ↗" (and who typed it in).
function scanLink_(r) {
  const u = safeUrl_(r['Scan Link']);
  return (r['Entered By Role'] === 'clerk' ? ' · typed in by the office' : '') + (u ? ' · <a href="' + esc_(u) + '" target="_blank" rel="noopener">Scan ↗</a>' : '');
}
function reportsHtml_(a) {
  const since = a.revivedAt ? new Date(a.revivedAt).getTime() : 0;
  const ir = (a.interviewReports || []).slice().reverse().map(function (r) {
    const earlier = new Date(r['Submitted At']).getTime() < since;
    return '<div class="report' + (earlier ? ' earlier' : '') + '"><div class="r-head"><span>Interview report' + (earlier ? ' (earlier round)' : '') + '</span><span>' + esc_(fmtWhen_(r['Submitted At'])) + ' · ' + esc_(r['Submitted By']) + scanLink_(r) + '</span></div>' +
      '<div>Confidence <b>' + esc_(r['Confidence']) + '/5</b> · English <b>' + esc_(r['English']) + '/5</b> · ' + esc_(r['Position'] || '') + ' · <b>' + (r['Recommendation'] === 'reject' ? 'Rejected' : 'Proceed to demo') + '</b></div>' +
      (r['Strengths'] ? '<div class="note">Strengths: ' + esc_(r['Strengths']) + '</div>' : '') + (r['Weaknesses'] ? '<div class="note">Weaknesses: ' + esc_(r['Weaknesses']) + '</div>' : '') +
      (r['Remarks'] ? '<div class="note">' + esc_(r['Remarks']) + '</div>' : '') + '</div>';
  });
  const dr = (a.demoReports || []).slice().reverse().map(function (r) {
    const earlier = new Date(r['Submitted At']).getTime() < since;
    const rec = { proceed: 'Proceed to salary offer', another: 'Another demo', reject: 'Rejected' }[r['Recommendation']] || r['Recommendation'];
    return '<div class="report' + (earlier ? ' earlier' : '') + '"><div class="r-head"><span>Demo report · <span class="total">' + esc_(r['Total /45']) + '/45</span>' + (earlier ? ' (earlier round)' : '') + '</span><span>' + esc_(fmtWhen_(r['Submitted At'])) + ' · ' + esc_(r['Submitted By']) + scanLink_(r) + '</span></div>' +
      '<div>' + esc_([r['Class'], r['Subject']].filter(Boolean).join(' · ')) + ' · <b>' + esc_(rec) + '</b></div>' +
      '<div class="note">' + DEMO_SCORES.map(function (k) { return esc_(k[1]) + ' ' + esc_(r[k[1]]); }).join(' · ') + ' · Student Feedback ' + esc_(r['Student Feedback']) + '</div>' +
      (r['Remarks'] ? '<div class="note">' + esc_(r['Remarks']) + '</div>' : '') + '</div>';
  });
  const pdf = safeUrl_(a.interviewReportPdf);
  const legacy = pdf ? '<div class="report"><div class="r-head"><span>Scanned report (Google Form)</span><a href="' + esc_(pdf) + '" target="_blank" rel="noopener">Open PDF ↗</a></div></div>' : '';
  return (ir.concat(dr).join('') + legacy) || '<div class="empty">No reports yet.</div>';
}

// The panel's Appointments block: shortlist, history (Cancel, calendar Retry), and the booking form. A Principal's interview
// or demo time is booked at once (accepted, on their calendar); anyone else's is a proposal the Principal accepts.
function apptBlockHtml_(a) {
  const row = a.row;
  let h = '<div class="block" id="apptBlock"><h4>Appointments</h4>';
  if (a.status === '' || a.status === 'Shortlisted') {
    h += '<div class="foot" style="margin:0 0 10px">' + (a.status === '' ? '<button type="button" class="btn primary" data-act="shortlist" data-row="' + row + '">Shortlist</button>'
      : '<span class="pill ok">Shortlisted</span><button type="button" class="btn ghost" data-act="unshortlist" data-row="' + row + '">Un-shortlist</button>') + '<span class="formmsg" id="slMsg"></span></div>';
  }
  const list = a.appointments || [];
  h += list.length ? list.map(function (x) {
    const pill = { proposed: 'warn', accepted: 'ok', declined: 'bad' }[x.status] || '';
    return '<div class="report"><div class="r-head"><span>' + esc_(KIND_LABEL[x.kind] + ' · ' + fmtWhen_(x.start)) + '</span><span class="pill ' + pill + '">' + esc_(x.status) + '</span></div>' +
      '<div class="note">Proposed by ' + esc_(x.proposedBy) + (x.status === 'accepted' && x.calendarMode === 'none' ? ' · calendar not updated' : '') + (x.reportFiled ? ' · report filed' : '') + '</div>' +
      (x.declineNote ? '<div class="note">Declined: ' + esc_(x.declineNote) + '</div>' : '') +
      (HV.canOverride_(SESSION && SESSION.role, x) ? '<div class="foot" style="margin-top:4px">' + overrideBtns_(x) + '</div>' : '') +
      ((cancelBtn_(x, a) || calRetryBtn_(x)) ? '<div class="foot" style="margin-top:4px">' + cancelBtn_(x, a) + calRetryBtn_(x) + '</div>' : '') + '</div>';
  }).join('') : '<div class="note">No appointments yet.</div>';
  const kinds = [];
  if (a.status === 'Shortlisted' || a.status === 'Interview Scheduled' || (a.status === '' && IS_PRINCIPAL)) kinds.push('interview');
  if (a.status === 'Interview Done') kinds.push('demo');
  if (active_(a) && kinds.length) {
    h += '<div class="grid three" style="margin-top:10px"><label class="fld">What<select class="sel" id="pApptKind">' + kinds.map(function (k) { return '<option value="' + k + '">' + esc_(KIND_LABEL[k]) + '</option>'; }).join('') + '</select></label>' +
      '<label class="fld"><span class="req">When</span><input class="inp" type="datetime-local" id="pApptAt"></label>' +
      '<label class="fld">Place (optional)<input class="inp" id="pApptPlace" maxlength="200"></label>' +
      '<label class="fld wide">Note (optional)<input class="inp" id="pApptNote" maxlength="500"></label></div>' +
      '<div class="foot"><button type="button" class="btn primary" data-act="propose" data-row="' + row + '">' + (IS_PRINCIPAL ? 'Book' : 'Propose time') + '</button><span class="formmsg" id="apptMsg"></span></div>' +
      '<p class="note">' + (IS_PRINCIPAL ? 'You book it directly: it is accepted and goes on your calendar' + (a.status === '' ? ', and they are shortlisted.' : '.') : 'The Principal accepts or declines it.') + '</p>';
  }
  return h + '</div>';
}

function renderPanel_(row) {
  const a = byRow_(row);
  if (!a) return;
  OPEN_ROW = row;
  const cv = safeUrl_(a.cv);
  let h = '<div id="panel"><h3 id="modalTitle">' + esc_(a.name) + ' <span class="id">' + esc_(a.applicantId) + '</span></h3>' +
    '<div class="meta note">' + esc_(a.phone) + ' · ' + esc_(campusesOf_(a).map(LMCS.campusLabel).join(', ')) + (a.timestamp ? ' · applied ' + esc_(fmtDay_(a.timestamp)) : '') + (a.addedBy ? ' · added by ' + esc_(a.addedBy) : '') + '</div>' +
    '<div style="margin-top:6px">' + chips_(a) + '</div>' + ladderHtml_(a);

  if (active_(a) && a.stageMarks && a.stageMarks.rejectPending) {
    const p = a.stageMarks.rejectPending;
    h += '<div class="block"><h4>Rejection to confirm</h4><p>The ' + esc_(p.kind || '') + ' report entered by ' + esc_(p.by || 'the office') + ' says <b>reject</b>: ' + esc_(p.reason) + (p.note ? ' — ' + esc_(p.note) : '') + '</p>' +
      '<div class="foot"><button type="button" class="btn danger" data-act="confirmrej" data-confirm="1" data-row="' + row + '">Confirm rejection</button>' +
      '<button type="button" class="btn" data-act="confirmrej" data-confirm="0" data-row="' + row + '">Don\'t reject</button><span class="formmsg" id="crMsg"></span></div></div>';
  }
  if (active_(a) || (a.appointments || []).length) h += apptBlockHtml_(a);

  h += '<div class="block"><h4>Reports</h4>' + reportsHtml_(a);

  const notYet = ['', 'Shortlisted', 'Interview Scheduled'].indexOf(a.status) !== -1; // no interview evidence yet
  if (active_(a)) {
    h += '<div class="foot"><button type="button" class="btn" data-act="interview" data-row="' + row + '">+ Interview report</button>' +
      (!notYet ? '<button type="button" class="btn" data-act="demo" data-row="' + row + '">+ Demo report</button>' : '') +
      (notYet ? '<button type="button" class="btn ghost" data-act="mark" data-stage="interview" data-row="' + row + '">Interview done — report later</button>' : '') +
      (a.status === 'Interview Done' ? '<button type="button" class="btn ghost" data-act="mark" data-stage="demo" data-row="' + row + '">Demo done — report later</button>' : '') +
      '<span class="formmsg" id="markMsg"></span></div>';
  }
  h += '<div id="formHost"></div></div>';

  if (['Demo Done', 'Salary Offer', 'MD Academics Interview Scheduled', 'Hiring Approved', 'Hired'].indexOf(a.status) !== -1) {

// ── actions ───────────────────────────────────────────────────────
function val_(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
// A message next to the button; a card has no message spot, so its result goes to the status bar.
function msg_(id, text, kind) {
  const el = id && document.getElementById(id);
  if (el) { el.textContent = text; el.className = 'formmsg' + (kind ? ' ' + kind : ''); }
  else if (kind) setStatus_(kind, text, true);
}
// POST, then take the fresh list the backend returns. Buttons are disabled while it runs, so a double click can't double-save.
function post_(action, body, msgId, btn, okText) {
  if (btn) btn.disabled = true;
  msg_(msgId, 'Saving…');
  return gasPost_(action, body).then(function (res) {
    if (btn) btn.disabled = false;
    if (!res.success) { msg_(msgId, res.error || 'Could not save', 'err'); return null; }
    if (res.applicants) { DATA = res; buildRoles_(); render_(); loadAppts_(); }
    if (res.toAccept) { APPTS = res; render_(true); refreshApplicants_(); } // apptdecide / apptcalendarretry return the apptlist
    msg_(msgId, okText || 'Saved ✓', 'ok');
    return res;
  }).catch(function () { if (btn) btn.disabled = false; msg_(msgId, 'Network error — try again', 'err'); return null; });
}

function loadAppts_() {
  gasGet_('apptlist').then(function (r) { if (r.success) { APPTS = r; render_(true); } }).catch(function () {});
}
function refreshApplicants_() {
  gasGet_('hiringapplicants').then(function (r) { if (r.success) { DATA = r; buildRoles_(); render_(); } }).catch(function () {});
}
function showForm_(row, which) {
  const a = byRow_(row);
  if (!a) return;
  if (!document.getElementById('panel') || OPEN_ROW !== row) { renderPanel_(row); openModal_(); }
  const host = document.getElementById('formHost');
  host.innerHTML = which === 'interview' ? interviewFormHtml_(a) : demoFormHtml_(a);
  host.scrollIntoView({ behavior: 'smooth', block: 'start' });
  const first = host.querySelector('input,select');
  if (first) first.focus({ preventScroll: true });
}

// A report with a scan goes to hiringuploadreport (size and type checked here first, before it is read); without one, the
// report goes to the plain submit action. The scan is optional.
function sendReport_(btn, kind, body, msgId, okText) {
  const input = document.getElementById(kind === 'interview' ? 'ifScan' : 'dfScan');
  const f = input && input.files && input.files[0];
  if (!f) {
    return post_(kind === 'interview' ? 'hiringsubmitinterview' : 'hiringsubmitdemo', body, msgId, btn, okText);
  }
  if (['application/pdf', 'image/jpeg', 'image/png'].indexOf(f.type) === -1) return msg_(msgId, 'The scan must be a PDF, JPG or PNG.', 'err');
  if (f.size > HV.SCAN_MAX_BYTES) return msg_(msgId, 'The scan is larger than 7 MB — scan at a lower resolution, or as a PDF.', 'err');
  btn.disabled = true;
  msg_(msgId, 'Reading the scan…');
  const rd = new FileReader();
  rd.onload = function () {
    post_('hiringuploadreport', Object.assign({ kind: kind, file: { name: f.name, mime: f.type, base64: String(rd.result).replace(/^data:[^,]*,/, '') } }, body), msgId, btn, okText);
  };
  rd.onerror = function () { btn.disabled = false; msg_(msgId, 'Could not read the file — pick it again.', 'err'); };
  rd.readAsDataURL(f);
}

function submitInterview_(btn, row) {
  const cap = {};
  for (let i = 0; i < 5; i++) {
    const sub = val_('ifSub' + i);
    if (!sub) continue;
    document.querySelectorAll('#ifForm select[data-sub="' + i + '"]').forEach(function (s) { if (s.value) (cap[sub] = cap[sub] || {})[s.dataset.cls] = Number(s.value); });
  }
  const rec = (document.querySelector('input[name="ifRec"]:checked') || {}).value;
  if (!val_('ifConf') || !val_('ifEng')) return msg_('ifMsg', 'Give Confidence and English a score from 1 to 5.', 'err');
  if (!Object.keys(cap).length) return msg_('ifMsg', 'Score at least one subject × class in the capability grid.', 'err');
  if (rec === 'reject' && !val_('ifRejReason')) return msg_('ifMsg', 'Pick a reason for rejecting.', 'err');
  if (rec === 'reject' && val_('ifRejReason') === 'Other' && !val_('ifRejNote')) return msg_('ifMsg', 'Add a note saying why (reason: Other).', 'err');
  sendReport_(btn, 'interview', {
    row: row, interviewDate: val_('ifDate'), position: val_('ifPos'), confidence: Number(val_('ifConf')), english: Number(val_('ifEng')), capability: cap,
    spouseOccupation: val_('ifSpouse'), familySupport: val_('ifSupport'), qualificationRemarks: val_('ifQual'), otherSkills: val_('ifSkills'),
    experience: { school: val_('ifExSchool'), periods: val_('ifExPeriods'), timing: val_('ifExTiming'), extraWork: val_('ifExExtra'), classes: val_('ifExClasses'), subjects: val_('ifExSubjects'), lastSalary: val_('ifExSalary') },
    commitment: val_('ifCommit'), expectedSalary: val_('ifSalary'), strengths: val_('ifStrengths'), weaknesses: val_('ifWeak'), remarks: val_('ifRemarks'),
    recommendation: rec, rejectReason: val_('ifRejReason'), rejectNote: val_('ifRejNote'),
  }, 'ifMsg', 'Interview report saved ✓');
}

function submitDemo_(btn, row) {
  const scores = {};
  let missing = false;
  DEMO_SCORES.forEach(function (k) { const v = val_('df_' + k[0]); if (!v) missing = true; scores[k[0]] = Number(v); });
  if (missing || !val_('df_feedback')) return msg_('dfMsg', 'Every demo score and Student Feedback needs a 1–5.', 'err');
  const rec = (document.querySelector('input[name="dfRec"]:checked') || {}).value;
  if (rec === 'reject' && !val_('dfRejReason')) return msg_('dfMsg', 'Pick a reason for rejecting.', 'err');
  if (rec === 'reject' && val_('dfRejReason') === 'Other' && !val_('dfRejNote')) return msg_('dfMsg', 'Add a note saying why (reason: Other).', 'err');
  sendReport_(btn, 'demo', {
    row: row, demoDate: val_('dfDate'), class: val_('dfClass'), subject: val_('dfSubject'), scores: scores, studentFeedback: Number(val_('df_feedback')),
    strengths: val_('dfStrengths'), improve: val_('dfImprove'), remarks: val_('dfRemarks'), recommendation: rec, nextDemoAt: val_('dfNext'),
    rejectReason: val_('dfRejReason'), rejectNote: val_('dfRejNote'),
  }, 'dfMsg', 'Demo report saved ✓');
}

function doAdd_(btn) {
  const body = { name: val_('adName'), phone: val_('adPhone'), campusId: val_('adCampus'), source: val_('adSource'), subjects: val_('adSubjects'),
    qualification: val_('adQual'), bed: val_('adBed'), age: val_('adAge'), gender: val_('adGender'), cv: val_('adCv'), notes: val_('adNotes') };
  if (!body.name || String(body.phone).replace(/\D/g, '').slice(-10).length !== 10 || !body.campusId || !body.source) return msg_('adMsg', 'Name, a 10-digit mobile number, the school and "came through" are needed.', 'err');
  const interviewAt = val_('adInterview');
  post_('hiringaddapplicant', body, 'adMsg', btn).then(function (res) {
    if (!res) return;
    const row = parseInt(String(res.applicantId).replace(/^T-0*/, ''), 10);
    const open = function () {
      if (byRow_(row)) { renderPanel_(row); if (res.duplicate) msg_('notesMsg', 'Already on file — this is their record.', 'ok'); }
      else { msg_('adMsg', (res.duplicate ? (res.applicantId ? 'Already on file as ' + res.applicantId : 'Already on file at another school') : 'Added as ' + res.applicantId) + '. They are not in your view — check the school.', 'ok'); }
    };
    // A Principal seeing a walk-in on the spot: a direct booking (accepted, and it shortlists them).
    if (interviewAt && !res.duplicate) gasPost_('apptpropose', { row: row, kind: 'interview', start: interviewAt }).then(function (r2) {
      if (r2.success) { DATA = r2; buildRoles_(); render_(); loadAppts_(); }
      open();
      if (!r2.success) msg_('apptMsg', r2.error || 'Could not book the interview', 'err');
    }).catch(function () { open(); msg_('apptMsg', 'Network error — the interview was not booked', 'err'); });
    else open();
  });
}

document.addEventListener('click', function (e) {
  const b = e.target.closest('[data-act]');
  if (!b) { if (e.target.id === 'modal') closeModal_(); return; }
  const row = b.dataset.row ? parseInt(b.dataset.row, 10) : null;
  const a = row ? byRow_(row) : null;
  switch (b.dataset.act) {
    case 'view': VIEW = b.dataset.view; document.getElementById('search').value = ''; render_(); if (VIEW === 'appts') loadAppts_(); break;
    case 'slfilter': SL_FILTER = b.dataset.f; render_(); break;
    case 'role': selectedRoleKey = b.dataset.key; render_(); break;
    case 'jump': { const s = document.getElementById('sec-' + b.dataset.to); if (s) s.scrollIntoView({ behavior: 'smooth' }); break; }
    case 'add': openModal_(addFormHtml_()); break;
    case 'doadd': doAdd_(b); break;
    case 'close': closeModal_(); break;
    case 'open': case 'revive': case 'reject':
      renderPanel_(row); openModal_();
      { const focus = { revive: 'pRevive', reject: 'pRejReason' }[b.dataset.act];
        if (focus && document.getElementById(focus)) { document.getElementById(focus).scrollIntoView({ block: 'center' }); document.getElementById(focus).focus(); } }
      break;
    case 'book': {
      renderPanel_(row); openModal_();
      const md = b.dataset.kind === 'md', kindSel = document.getElementById('pApptKind');
      if (kindSel && !md) kindSel.value = b.dataset.kind;
      const el = document.getElementById(md ? 'pMdAt' : 'pApptAt');
      if (el) { el.scrollIntoView({ block: 'center' }); el.focus(); }
      break;
    }
    case 'shortlist': case 'unshortlist':
      post_('hiringshortlist', { row: row, on: b.dataset.act === 'shortlist' }, 'slMsg', b, b.dataset.act === 'shortlist' ? 'Shortlisted ✓' : 'Un-shortlisted');
      break;
    case 'propose': {
      const kind = val_('pApptKind'), start = val_('pApptAt');
      if (!start) { msg_('apptMsg', 'Pick the date and time.', 'err'); break; }
      post_('apptpropose', { row: row, kind: kind, start: start, place: val_('pApptPlace'), note: val_('pApptNote') }, 'apptMsg', b,
        IS_PRINCIPAL ? 'Booked ✓ — on your calendar' : 'Proposed ✓ — waiting for the Principal');
      break;
    }
    case 'proposemd':
      if (!val_('pMdAt')) { msg_('mdMsg', 'Pick the date and time.', 'err'); break; }
      post_('apptpropose', { row: row, kind: 'md', start: val_('pMdAt') }, 'mdMsg', b, 'Proposed ✓ — waiting for MD Academics');
      break;
    case 'cancelappt':
      if (!window.confirm('Cancel this appointment?')) break;
      post_('apptcancel', { id: b.dataset.id }, 'apptMsg', b, 'Cancelled');
      break;
    case 'calretry': post_('apptcalendarretry', { id: b.dataset.id }, 'apptMsg', b, 'Calendar updated ✓'); break;
    case 'accept': post_('apptdecide', { id: b.dataset.id, decision: 'accept' }, null, b); break;
    case 'decline': {
      const note = (document.getElementById('dn-' + b.dataset.id) || {}).value || '';
      if (!note.trim()) { setStatus_('err', 'Add a note saying why you are declining (the proposer sees it).', true); break; }
      post_('apptdecide', { id: b.dataset.id, decision: 'decline', note: note.trim() }, null, b);
      break;
    }
    case 'confirmrej':
      post_('hiringconfirmreject', { row: row, confirm: b.dataset.confirm !== '0' }, 'crMsg', b, b.dataset.confirm !== '0' ? 'Rejected' : 'Kept — not rejected');
      break;
    case 'interview': showForm_(row, 'interview'); break;
    case 'demo': showForm_(row, 'demo'); break;
    case 'cancelform': document.getElementById('formHost').innerHTML = ''; break;
    case 'submitinterview': submitInterview_(b, row); break;
    case 'submitdemo': submitDemo_(b, row); break;
    case 'salary': window.open(salaryLinkUrl_(a), '_blank', 'noopener'); break;
    case 'mark': post_('hiringmarkstage', { row: row, stage: b.dataset.stage }, 'markMsg', b, 'Marked ✓ — file the report when you can'); break;
    case 'savenotes': post_('updatehiringstatus', { row: row, status: '', notes: val_('pNotes') }, 'notesMsg', b); break;
    case 'savedoj': if (!val_('pDoj')) { msg_('dojMsg', 'Pick the joining date.', 'err'); break; } post_('updatehiringstatus', { row: row, status: '', dateOfJoining: val_('pDoj') }, 'dojMsg', b); break;
    case 'hire': post_('updatehiringstatus', { row: row, status: 'Hired' }, 'hireMsg', b, 'Hired ✓').then(function (res) { if (res) showAppointmentLetter_(row); }); break;
    case 'letter': showAppointmentLetter_(row); break;
    case 'starthire': {
      const role = roleFor_(a);
      post_('hiringstarthire', { row: row, role: role ? (role.roleLevel || '') + (role.subjects ? ': ' + role.subjects : '') : '' }, 'hireMsg', b, 'Started ✓ — opening the Documents page…')
        .then(function (res) { if (res) setTimeout(function () { location.href = DOCS_PAGE_; }, 800); });
      break;
    }
    case 'dorej':
      if (!val_('pRejReason')) { msg_('rejMsg', 'Pick a reason.', 'err'); break; }
      if (val_('pRejReason') === 'Other' && !val_('pRejNote')) { msg_('rejMsg', 'Add a note saying why (reason: Other).', 'err'); break; }
      post_('updatehiringstatus', { row: row, status: 'Rejected', rejectReason: val_('pRejReason'), rejectNote: val_('pRejNote') }, 'rejMsg', b, 'Rejected');
      break;
    case 'dorevive':
      if (!val_('pRevive')) { msg_('reviveMsg', 'Say why they are being revived.', 'err'); break; }
      post_('hiringrevive', { row: row, note: val_('pRevive') }, 'reviveMsg', b, 'Revived ✓ — book a fresh interview');
      break;
  }
});
document.addEventListener('change', function (e) {
  if (e.target.name === 'ifRec') document.getElementById('ifRejWrap').style.display = e.target.value === 'reject' ? '' : 'none';
  if (e.target.name === 'dfRec') {
    document.getElementById('dfRejWrap').style.display = e.target.value === 'reject' ? '' : 'none';
    document.getElementById('dfNextWrap').style.display = e.target.value === 'another' ? '' : 'none';
  }
  if (e.target.id && e.target.id.indexOf('df_') === 0) {
    let t = 0;
    document.querySelectorAll('#dfForm select[id^="df_"]').forEach(function (s) { t += Number(s.value) || 0; });
    document.getElementById('dfTotal').textContent = t;
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.getElementById('modal').hasAttribute('open')) closeModal_(); });
let SEARCH_T = null;
document.getElementById('search').addEventListener('input', function () { clearTimeout(SEARCH_T); SEARCH_T = setTimeout(render_, 150); });

// ── load ──────────────────────────────────────────────────────────
function buildRoles_() {
  ROLES = [];
  (APPROVAL_STATUS.campuses || []).forEach(function (c) { c.newPositions.forEach(function (r) { ROLES.push({ campusId: c.campusId, roleLevel: r.roleLevel, subjects: r.subjects, roleKey: r.roleKey }); }); });
}
function setStatus_(state, text, noRetry) {
  const bar = document.getElementById('statusBar');
  bar.style.display = '';
  bar.className = 'status-bar' + (state ? ' ' + state : '');
  bar.innerHTML = (state === 'loading' ? '<span class="spin"></span>' : '') + '<span>' + esc_(text) + '</span>' + (state === 'err' && !noRetry ? '<button type="button" class="retry-btn" onclick="loadAll_()">Retry</button>' : '');
}
function refreshTracker_() {
  const btn = document.getElementById('refreshTrackerBtn'), msg = document.getElementById('refreshTrackerMsg');
  btn.disabled = true; msg.textContent = 'Refreshing…';
  gasPost_('hiringrefreshtracker', {}).then(function (res) { btn.disabled = false; msg.textContent = res.success ? 'Updated ' + res.count + ' applicants ✓' : (res.error || 'Failed'); })
    .catch(function () { btn.disabled = false; msg.textContent = 'Network error — try again'; });
}
function renderDataSourceLinks_() {
  const el = document.getElementById('datasrcHiring');
  if (!LMCS.canViewDataSources(SESSION)) { el.innerHTML = ''; return; }
  const u = function (id, gid) { return 'https://docs.google.com/spreadsheets/d/' + id + '/edit' + (gid ? '#gid=' + gid : ''); };
  const links = [['Teaching Applicants sheet', u(DATASRC_APPLICANTS_SHEET_ID, DATASRC_APPLICANTS_GID)], ['Interview Report sheet', u(DATASRC_APPLICANTS_SHEET_ID, DATASRC_IR_GID)],
    ['Applicant Live Status sheet', u(DATASRC_APPLICANTS_SHEET_ID, DATASRC_TRACKER_GID)], ['Doc Submission sheet', u(DATASRC_DOC_WORKBOOK_ID)]];
  el.innerHTML = '📄 ' + links.map(function (l) { return '<a href="' + l[1] + '" target="_blank" rel="noopener">' + l[0] + ' ↗</a>'; }).join('') +
    ' · <button type="button" class="btn ghost" id="refreshTrackerBtn" onclick="refreshTracker_()" style="min-height:0;padding:1px 6px;font-size:10.5px">🔄 Refresh Tracker</button> <span id="refreshTrackerMsg"></span>';
}
function loadAll_() {
  setStatus_('loading', 'Loading applicants…');
  Promise.all([gasGet_('hiringapplicants'), gasGet_('hiringapprovalstatus')]).then(function (r) {
    if (!r[0].success) { setStatus_('err', r[0].error || 'Failed to load.'); return; }
    DATA = r[0];
    APPROVAL_STATUS = r[1].success ? r[1] : { campuses: [] };
    loadAppts_();
    buildRoles_();
    document.getElementById('mainRoot').style.display = '';
    renderDataSourceLinks_();
    render_();
    setStatus_('ok', 'Loaded ' + (DATA.applicants || []).length + ' applicant(s) — ' + new Date().toLocaleTimeString());
  }).catch(function () { setStatus_('err', 'Network error — could not reach the backend.'); });
}

// Appointment Letter (2026-10-03, per Uday): opens right after a successful
// Hired save, prefilled from the applicant + the Salary Dashboard's recorded
// breakdown; the Principal edits any dashed field, then prints / saves as PDF.
// Address isn't stored anywhere (it's on the Interview Report PDF) -> typed in.
function showAppointmentLetter_(row) {
  const a = (DATA.applicants || []).filter(function (x) { return x.row === row; })[0];
  if (!a) return;
  const b = a.offerBreakdown || {};
  const school = campusOf_(a);
  const campus = school ? LMCS.campusLabel(school) : '';
  const role = roleFor_(a);
  const position = b.designation || (role && role.roleLevel) || '';
  const d = a.dateOfJoining ? a.dateOfJoining.split('-').reverse().join('-') : '';
  const t = new Date(), today = ('0' + t.getDate()).slice(-2) + '-' + ('0' + (t.getMonth() + 1)).slice(-2) + '-' + t.getFullYear();
  const e = function (v, ph) { return '<span contenteditable="true">' + (v === undefined || v === '' ? (ph || '_____') : esc_(v)) + '</span>'; };
  const n = function (v) { return '<span contenteditable="true">' + (Number(v) || 0) + '</span>'; };
  const row2 = function (l1, v1, l2, v2, l3, v3) {
    return '<tr><td>' + l1 + '<span style="float:right">' + v1 + '</span></td><td>' + l2 + '<span style="float:right">' + v2 + '</span></td><td>' + l3 + '<span style="float:right">' + v3 + '</span></td></tr>';
  };
  const earn = [['Basic:', b.basic], ['DA:', b.da]];
  if (b.ada) earn.push(['ADA:', b.ada]);
  earn.push(['Employer Share (EPF):', b.epfE], ['Employer Share (PF):', b.pfE], ['Employer Share (ESI):', b.esiE]);
  const ded = [['Total EPF (EPF):', b.totEpf], ['RRF:', b.rrf], ['ESI To ESIC:', b.totEsi]];
  if (b.tuition) ded.push(['Staff-child tuition:', b.tuition]);
  const ov = [['Cost to Institution:', b.cti]];
  const rows = Math.max(earn.length, ded.length, ov.length);
  let tbody = '';
  for (let i = 0; i < rows; i++) {
    const c = function (arr) { return arr[i] ? arr[i][0] + '<span style="float:right">' + n(arr[i][1]) + '</span>' : ''; };
    tbody += '<tr><td>' + c(earn) + '</td><td>' + c(ded) + '</td><td>' + c(ov) + '</td></tr>';
  }
  tbody += '<tr><td>Total CTI:<span style="float:right">' + n(b.cti) + '</span></td><td>Total Deduction:<span style="float:right">' + n(b.cti != null && b.net != null ? b.cti - b.net : 0) + '</span></td><td>Bank Transfer:<span style="float:right">' + n(b.net) + '</span></td></tr>';
  document.getElementById('letterSheet').innerHTML =
    '<div class="lh"><div style="font-size:30px;font-weight:700;color:#0b2a6b">HIDIMBA EDUCATIONAL SOCIETY</div><div style="font-size:18px;font-weight:700;color:#0b2a6b">THE MALL, DHALPUR KULLU-175101</div>' +
    '<div style="font-size:11px;font-weight:700;color:#0b2a6b">(Regd. Under Societies Act XXI, 1860 &amp; Amended Under H.P. Soc. Reg. Act 2006)</div>' +
    '<div style="font-size:15px;font-weight:700;color:#e11d2e">Running &amp; Managing La Montessori Chain of Schools</div></div>' +
    '<div style="text-align:center;font-weight:700;font-size:16px">By Hand</div>' +
    '<p><b>Ref. No.:</b> <i>' + e(a.employeeCode || a.expectedEmployeeCode || '') + '</i></p>' +
    '<p>' + e((a.name || '').toUpperCase()) + '<br>' + e('', 'ADDRESS (from the Interview Report / Aadhaar)') + '</p>' +
    '<p>Dated: ' + e(today) + '<br><b>Reg.:</b> Appointment Letter.</p><p>Dear ' + e('Sir / Madam') + '</p>' +
    '<p>I, on behalf of the administration would like to congratulate you on your appointment to the position of ' + e(position) + ' on a probation period of one complete academic year at ' + e(campus) + '. Your date of joining is ' + e(d) + '.</p>' +
    '<p>Your salary details as on today are:</p>' +
    '<table><tr><th>Earnings</th><th>Deductions</th><th>Overall</th></tr>' + tbody + '</table>' +
    '<p>You will be regular after the completion of probation period subject to the completion of the minimum required qualifications as per the concerned Education Department or Education Boards. You also hereby agree to adhere to the following terms and conditions in full sense and under no pressure of any sorts.</p>' +
    '<ol><li>A regular performance review will be conducted to assess your performance and suitability. On the successful completion of your probation period you could be hired as a regular employee.</li>' +
    '<li>Service rules of a probationer shall be applicable till the employee is switched to regular status.</li>' +
    '<li>You assure to serve for ' + e('', '_____') + ' years ' + e('', '____') + ' months. In case, of a change in intention to serve, you shall intimate your incharge in writing atleast 3 months prior to your leaving or the end of the session whichever is later.</li>' +
    '<li>You shall receive your monthly salary after the completion of each months service, on 10th of the following month. The date may vary due to occurrence of public/gazetted holidays.</li>' +
    '<li>In case of serious grievances or inadequate service standards, a meeting shall be held with your immediate senior and the salary can be withheld for no longer than 2 additional weeks. This must be treated as a warning/ notice from the School’s side. Three such instances can lead to immediate termination.</li>' +
    '<li>Kindly speak to your respective in charge at the recieval of this letter in case they see the need of induction.</li>' +
    '<li>Please submit attested copies of the following documents (Within one month of date of joining):<ol type="a"><li>All Certificates of Academic Qualifications</li><li>Police Verification</li><li>Photocopy of PAN Card</li><li>One Cancelled Cheque</li><li>Medical Certificate</li><li>Signed Service Contract</li><li>Photocopy of Aadhar Card</li><li>Old EPF Number, if any</li></ol></li>' +
    '<li>The rules and regulations of the management are reviewed and issued from time to time, orally or in writing by the administration.</li>' +
    '<li>Your appointment will be cancelled immediately, if any information provided by you is found to be incorrect.</li>' +
    '<li>You are free to clear any doubt etc. before joining your duties.</li>' +
    '<li>You can be transferred during your job period to any of the Institutions/ Schools run by the Society and you cannot deny for the same. In case, of your default, your services can be terminated without notice.</li></ol>' +
    '<p>Your signing this appointment letter confirms your acceptance of the terms and conditions.<br>Wish you best of luck for your future endeavor.</p>' +
    '<p>Yours Sincerely</p><br><br><p><b><i>Copy to :</i></b> Principal, ' + e(campus) + ', for information and necessary action please.</p>';
  document.getElementById('letterModal').style.display = 'block';
}


function showApp(session) {
  SESSION = session;
  // Decisions by role, not by campus: a Fee Clerk whose campus is ALL is still a Fee Clerk.
  if (!['Principal', 'Coordinator', 'Owner'].some(function (r) { return LMCS.hasRole(session, r); })) { location.replace('../office/hiring.html'); return; } // Fee Clerks have their own screen
  IS_PRINCIPAL = LMCS.hasRole(session, 'Principal');
  if (LMCS.canViewCoordinatorPortal(session)) document.getElementById('aprLink').href = '../coordinator/systems/index.html#approvals';
  let mounted = false; // the picker's first onChange fires inside mount, before anything is loaded
  LMCSCampus.mount('#campusRow', { session: session, label: 'School', onChange: function (sel) { SEL = sel; selectedRoleKey = null; if (mounted) render_(); } });
  mounted = true;
  document.getElementById('authRoot').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  document.getElementById('welcomeStrip').innerHTML = '<span>Signed in as <b>' + esc_(session.name) + '</b> — ' + esc_(session.campusName || session.campusId) + '</span><a href="#" class="signout" id="signoutLink">Sign out</a>';
  document.getElementById('signoutLink').onclick = function (e) { e.preventDefault(); LMCS.signOut(); };
  if (!LMCS.canUseHiring(session)) {
    document.getElementById('deniedRoot').innerHTML = '<div class="denied"><div style="font-size:36px">🔒</div><h3>Not available for your role</h3><p>The Hiring Dashboard is for Principals, Coordinators, the Owner and Fee Clerks.</p></div>';
    return;
  }
  loadAll_();
}

const cachedSession = LMCS.getSession();
if (cachedSession) showApp(cachedSession);
else LMCS.requireSession('#authRoot').then(showApp);
</script>
