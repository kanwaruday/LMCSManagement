<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMCS — Hiring Dashboard</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://accounts.google.com">
<style>
:root{--red:#CE0000;--red-h:#a50000;--red-lt:rgba(206,0,0,.07);--dark:#1a1a1a;--gray:#555;--lgray:#f5f5f5;--border:#ddd;--white:#fff;--green:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--white);color:var(--dark);min-height:100vh;font-size:13px;line-height:1.6;display:flex;flex-direction:column}

.hdr{background:var(--red);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;border-bottom:1px solid var(--red-h);flex-wrap:wrap}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:14px;font-weight:700;letter-spacing:.3px}
.hdr p{font-size:9.5px;opacity:.75;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hdr-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.92);padding:5px 12px;border-radius:4px;font-size:11px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.22)}

#appBody{flex:1;overflow:auto;padding:24px;max-width:1100px;margin:0 auto;width:100%}
#authRoot{max-width:420px;margin:60px auto}

.welcome{display:flex;align-items:center;justify-content:space-between;background:var(--lgray);border:1px solid var(--border);border-radius:6px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap;gap:10px}
.welcome b{color:var(--dark)}
.signout{font-size:11px;color:var(--gray);text-decoration:none}
.signout:hover{color:var(--red)}

.denied{text-align:center;padding:60px 20px;color:var(--gray)}
.denied .icon{font-size:36px;margin-bottom:10px}

.getting-started{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:18px}

/* Owner-only "data source" links (2026-09-20) -- same pattern as
   principals-daily-reporting/index.html's, kept file-local rather than
   a shared module since every page here is already self-contained. */
.datasrc-links{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:10.5px;color:#8A96A6;margin-bottom:14px}
.datasrc-links a{color:#8A96A6;text-decoration:underline}
.datasrc-links a:hover{color:var(--red)}
.gs-card{border:1px solid var(--border);border-radius:6px;padding:12px 14px;text-decoration:none;color:inherit;transition:border-color .15s}
.gs-card:hover{border-color:var(--red)}
.gs-card .t{font-size:12px;font-weight:700;margin-bottom:3px}
.gs-card .d{font-size:11px;color:var(--gray)}


/* Campus tabs + role picker (2026-09-25) -- same convention as
   principals-daily-reporting/index.html's .campus-btn/.role-btn, so the
   "pick a school, then pick from what's open there" pattern looks
   consistent across the portal instead of reinventing a dropdown here. */
.role-picker{display:flex;gap:6px;flex-wrap:wrap}
.campus-btn{background:var(--white);border:1.5px solid var(--border);border-radius:6px;padding:7px 14px;font-size:12px;font-weight:600;color:var(--gray);cursor:pointer}
.campus-btn.active{background:var(--red-lt);border-color:var(--red);color:var(--red)}
.campus-btn.school-btn{padding:8px 16px;font-size:13px}
.role-btn{background:var(--white);border:1.5px solid var(--border);border-radius:20px;padding:6px 14px;font-size:11.5px;font-weight:600;color:var(--gray);cursor:pointer}
.role-btn.active{background:var(--red-lt);border-color:var(--red);color:var(--red)}

table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;background:var(--lgray);border-bottom:2px solid var(--border);font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--gray);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--border);vertical-align:top}
tr:hover td{background:var(--red-lt)}
.name{font-weight:700}
.applicant-id{font-weight:400;font-family:monospace;font-size:10.5px;color:var(--gray);background:var(--lgray);padding:1px 5px;border-radius:3px}
.score-cell{font-weight:700;text-align:center;cursor:help}
.sub{color:var(--gray);font-size:11px}
a.linklike{color:var(--red);text-decoration:none}
a.linklike:hover{text-decoration:underline}
input.notes-input{display:block;width:190px;margin-top:8px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:11.5px}
input.interview-input{padding:4px 6px;border:1px solid var(--border);border-radius:4px;font-size:11px;margin-top:3px;width:100%}
.interview-label{font-size:9.5px;color:var(--gray);text-transform:uppercase;letter-spacing:.3px}
/* Stage ladder (2026-09-25) -- replaces the plain status <select> with a
   checklist: past/current stages tick green, future ones stay plain,
   clicking any of them just changes the PENDING selection (same as the
   old dropdown did) -- nothing saves until the row's Save button runs. */
.ladder{display:flex;flex-direction:column;gap:3px;min-width:190px}
.req-bar{min-width:200px}
.req-hint{font-size:10.5px;font-weight:700;color:var(--red);margin-bottom:4px}
.ladder-item{display:block;width:100%;text-align:left;background:var(--white);border:1px solid var(--border);border-radius:4px;padding:3px 7px;font-size:11px;color:var(--gray);cursor:pointer}
.ladder-item:hover{border-color:var(--red)}
.ladder-item.ladder-derived{cursor:default;background:var(--lgray)}
.ladder-item.ladder-derived:hover{border-color:var(--border)}
.ladder-item.ladder-done{background:#dcfce7;border-color:#bbf7d0;color:var(--green);font-weight:600}
.ladder-item.ladder-pending{background:var(--red-lt);border-color:var(--red);color:var(--red);font-weight:700}
.ladder-item.ladder-reject{color:#991b1b;margin-top:2px}
.ladder-item.ladder-reject.ladder-pending{background:#fef2f2;border-color:#991b1b;color:#991b1b}
.row-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:5px}
.mini-btn{font-size:10.5px;padding:3px 7px;border:1px solid var(--border);border-radius:4px;background:var(--white);cursor:pointer;color:var(--gray)}
.mini-btn:hover{border-color:var(--red);color:var(--red)}
.save-btn{font-size:10.5px;padding:3px 9px;border:none;border-radius:4px;background:var(--red);color:#fff;cursor:pointer;font-weight:600}
.save-btn:hover{background:var(--red-h)}
.save-btn:disabled{opacity:.5;cursor:default}
.row-msg{font-size:10.5px;margin-top:4px}
.row-msg.err{color:#991b1b}
.row-msg.ok{color:var(--green)}
.empty{text-align:center;padding:40px;color:var(--gray)}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">
    <div>
      <h1>Hiring Dashboard</h1>
      <p>Teaching Applicants — browse, track, hire</p>
    </div>
  </div>
  <div class="hdr-right">
    <a href="../principals-daily-reporting/index.html" class="hdr-btn">✅ Approvals</a>
    <a href="../index.html" class="hdr-btn">🏠 Portal Home</a>
  </div>
</div>

<div id="appBody">

  <div id="authRoot"></div>

  <div id="appRoot" style="display:none">
    <div class="welcome" id="welcomeStrip"></div>
    <div id="deniedRoot"></div>
    <div id="mainRoot" style="display:none">

      <!-- 2026-09-25, per Uday: cards 4 (Interview Report Form), 7/8
           (Salary Slip), and 9 (Staff Document Submission) removed --
           all three are now baked into the per-row stage ladder
           (renderRowActions_), contextual to the exact applicant and
           campus instead of generic/static (card 9 used to render
           visibly broken -- grayed out -- whenever "All Campuses" was
           selected, since it only ever resolved one campus's link). -->
      <div class="getting-started">
        <a href="../principals-daily-reporting/index.html" class="gs-card" target="_blank">
          <div class="t">1 — Request to open a role</div>
          <div class="d">Approvals tab → "New/ Backup Position"</div>
        </a>
      </div>

      <div class="datasrc-links" id="datasrcHiring"></div>

      <div id="campusTabsRow" style="display:none;margin-bottom:14px">
        <div class="role-picker" id="campusTabs"></div>
      </div>

      <!-- Step 2 of the journey: pick a campus (above), see its approved
           open roles here as clickable pills -- nothing below shows
           until one is picked (Step 3). -->
      <div id="rolesRow" style="margin-bottom:14px"></div>

      <div id="applicantSection" style="display:none">
        <table>
          <thead>
            <tr>
              <th>Match</th><th>Applicant</th><th>Applied</th><th>Subjects</th><th>Qualification</th><th>CV</th>
              <th>Stage</th><th>Next steps</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty" id="emptyMsg" style="display:none">Pick a role above to see matching applicants.</div>
      </div>
    </div>
  </div>

</div>

<script src="../assets/auth.js"></script>
<script>
const PDR_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzpkFLy4KvTdSJfioz6wlgRGLjvO_GvbffhOYBb-hHybFtjGTk0ps-GzXz0FrQ9GmYdfg/exec';
const DOC_FORM_URLS = {
  LMS1: 'https://forms.gle/mEtGFD6vGhgK3kJG7', LMS2: 'https://forms.gle/LV1fy13jXzrrcXra9',
  LMS3: 'https://forms.gle/hHgMU9XqBxpk3gWd8', LMS4: 'https://forms.gle/1uFg6AuYpYmP7ukA9',
  LMS5: 'https://forms.gle/ZiTP8jQuJ4SstRSM6', LMS6: 'https://forms.gle/pKP62AwcJuat1byH7',
};

// Owner-only "data source" links (2026-09-20) -- IDs duplicated from
// apps-script/hiring.gs (HIR_SHEET_ID / HIR_IR_SHEET_ID / HIR_DOC_SHEET_IDS),
// same as DOC_FORM_URLS above is already duplicated from that file's
// per-campus Form links. Keep both in sync if a sheet/form is ever recreated.
// 2026-09-25: Teaching Applicants and Interview Reports are now tabs in
// the SAME spreadsheet (Uday merged them) -- same ID, gid picks the tab.
const DATASRC_APPLICANTS_SHEET_ID = '1aSCQ3IGO-ZP_5yRjtnMpZdlauTdWj3814ATD9qwskPQ'; // "Teaching Applicants" + "Interview Reports" + "Applicant Live Status" tabs
const DATASRC_APPLICANTS_GID = '1181288827';
const DATASRC_IR_GID = '1241435504';
const DATASRC_TRACKER_GID = '1351967428';
const DATASRC_DOC_SHEET_IDS = {
  LMS1: '1PJ2acPOHopbHzzwGes8X4YPWSDBdXnd0zl46zvFCvIg', LMS2: '10xxFM1li1-6xzWEBEEPkZIF4MJcilddoVJkEfVbkScM',
  LMS3: '1qdQnXrWWTrgnCt82MSk_fN6Fqaox-EoenuF_XToypAc', LMS4: '1x8eFlnFcEKaCwF9HMRan_EQwTgSPq9xHubZ7n5vyR8k',
  LMS5: '1-bhS4eu4OHFhRzllsALtWLRWiGFt-KutbNke3nNlCk8', LMS6: '1-3_3BT7zHVJXy7UqxwZuZmpzUJp4uaibHNaA7onI0jU',
};

// "Refresh Tracker" (2026-09-25) -- Owner-only button that recomputes
// the ungated "Applicant Live Status" tab (see hiringRefreshTracker_ in
// hiring.gs). Lives alongside the data-source links since both are
// Owner-only, sheet-adjacent conveniences.
function refreshTracker_() {
  const btn = document.getElementById('refreshTrackerBtn');
  const msg = document.getElementById('refreshTrackerMsg');
  btn.disabled = true;
  msg.textContent = 'Refreshing…';
  gasPost_('hiringrefreshtracker', {}).then(function (res) {
    btn.disabled = false;
    msg.textContent = res.success ? ('Updated ' + res.count + ' applicants ✓') : (res.error || 'Failed');
  }).catch(function () {
    btn.disabled = false;
    msg.textContent = 'Network error — try again';
  });
}

function renderDataSourceLinks_() {
  const el = document.getElementById('datasrcHiring');
  if (!LMCS.hasRole(SESSION, 'Owner')) { el.innerHTML = ''; return; }
  const sheetUrl = function (id, gid) { return 'https://docs.google.com/spreadsheets/d/' + id + '/edit' + (gid ? '#gid=' + gid : ''); };
  const links = [
    { label: 'Teaching Applicants sheet', url: sheetUrl(DATASRC_APPLICANTS_SHEET_ID, DATASRC_APPLICANTS_GID) },
    { label: 'Interview Report sheet', url: sheetUrl(DATASRC_APPLICANTS_SHEET_ID, DATASRC_IR_GID) },
    { label: 'Applicant Live Status sheet', url: sheetUrl(DATASRC_APPLICANTS_SHEET_ID, DATASRC_TRACKER_GID) },
  ];
  const campus = activeCampus_();
  if (DATASRC_DOC_SHEET_IDS[campus]) links.push({ label: 'Doc Submission sheet', url: sheetUrl(DATASRC_DOC_SHEET_IDS[campus]) });
  el.innerHTML = '📄 ' + links.map(function (l) { return '<a href="' + l.url + '" target="_blank" rel="noopener">' + l.label + ' ↗</a>'; }).join('') +
    ' · <button type="button" class="mini-btn" id="refreshTrackerBtn" onclick="refreshTracker_()">🔄 Refresh Tracker</button>' +
    ' <span class="sub" id="refreshTrackerMsg"></span>';
}

let SESSION = null;
let APPLICANTS = [];
let APPROVAL_STATUS = { campuses: [] };
let campusFilter = 'ALL'; // only meaningful when SESSION.campusId === 'ALL'
let selectedRoleKey = null; // which specific open role's applicants are showing (Step 3 of the journey) -- null until one's clicked
let ROLES = []; // every approved role in scope, set by renderRolesList_ -- salaryLinkUrl_ looks up selectedRoleKey in here

function gasGet_(action, params) {
  const qs = Object.assign({ action: action, idToken: SESSION.idToken }, params || {});
  const url = PDR_BACKEND_URL + '?' + Object.keys(qs).map(function (k) {
    return encodeURIComponent(k) + '=' + encodeURIComponent(qs[k]);
  }).join('&');
  return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); });
}

function gasPost_(action, body) {
  return fetch(PDR_BACKEND_URL, {
    method: 'POST',
    body: JSON.stringify(Object.assign({ action: action, idToken: SESSION.idToken }, body)),
  }).then(function (r) { return r.json(); });
}

function activeCampus_() {
  return SESSION.campusId === 'ALL' ? campusFilter : SESSION.campusId;
}

// Step 1 of the journey: pick a campus. Tabs instead of a dropdown, same
// .campus-btn/.school-btn convention principals-daily-reporting/index.html
// already uses for its own school picker -- Owner/ALL only, a locked
// Principal has nothing to pick (they already see their whole district).
function renderCampusTabs_() {
  const wrap = document.getElementById('campusTabsRow');
  if (SESSION.campusId !== 'ALL') { wrap.style.display = 'none'; return; }
  wrap.style.display = '';
  const opts = ['ALL', 'LMS1', 'LMS2', 'LMS3', 'LMS4', 'LMS5', 'LMS6'];
  document.getElementById('campusTabs').innerHTML = opts.map(function (c) {
    return '<button type="button" class="campus-btn school-btn' + (c === campusFilter ? ' active' : '') + '" onclick="selectCampusTab_(\'' + c + '\')">' + (c === 'ALL' ? 'All Campuses' : LMCS.campusLabel(c)) + '</button>';
  }).join('');
}

function selectCampusTab_(c) {
  campusFilter = c;
  selectedRoleKey = null; // changing campus means starting the role pick over
  renderCampusTabs_();
  renderDataSourceLinks_();
  renderRolesList_();
  renderRows();
}

// Which campuses' approval status/roles are currently in view: Owner
// narrowed to one specific tab -> just that campus; Owner viewing "All
// Campuses" or a locked Principal (already district-scoped server-side
// by hiringApprovalStatus_) -> everything the backend returned.
function campusesInScope_() {
  if (SESSION.campusId === 'ALL' && campusFilter !== 'ALL') {
    return (APPROVAL_STATUS.campuses || []).filter(function (c) { return c.campusId === campusFilter; });
  }
  return APPROVAL_STATUS.campuses || [];
}

// Step 2 of the journey: every approved "New/ Backup Position" role in
// scope, as clickable pills -- nothing about applicants shows until one
// is clicked (Step 3, selectRole_ below). An empty list here doubles as
// the "nothing approved yet" signal that used to be APPLICANTS.gated.
function renderRolesList_() {
  const el = document.getElementById('rolesRow');
  const campuses = campusesInScope_();
  const roles = [];
  campuses.forEach(function (c) {
    c.newPositions.forEach(function (r) {
      roles.push({ campusId: c.campusId, roleLevel: r.roleLevel, subjects: r.subjects, roleKey: r.roleKey });
    });
  });
  // Kept globally (2026-09-25) so salaryLinkUrl_ can look up the
  // currently-selected role's level/subjects by key -- this function is
  // the only place that already knows that mapping, rather than
  // recomputing it or threading it through renderRows/renderRowActions_.
  ROLES = roles;
  if (!roles.length) {
    el.innerHTML = '<div class="empty">No approved "New/ Backup Position" roles yet. Use the "Request to open a role" link above.</div>';
    document.getElementById('applicantSection').style.display = 'none';
    return;
  }
  const multiCampus = campuses.length > 1;
  el.innerHTML = '<div class="role-picker">' + roles.map(function (r) {
    const label = (multiCampus ? LMCS.campusLabel(r.campusId) + ' — ' : '') + (r.roleLevel || 'Any') + (r.subjects ? ': ' + r.subjects : '');
    return '<button type="button" class="role-btn' + (r.roleKey === selectedRoleKey ? ' active' : '') + '" onclick="selectRole_(\'' + r.roleKey + '\')">' + label + '</button>';
  }).join('') + '</div>';
  document.getElementById('applicantSection').style.display = '';
}

function selectRole_(roleKey) {
  selectedRoleKey = roleKey;
  renderRolesList_();
  renderRows();
}

// Which campus actually owns acting on this applicant -- the CALLER's
// own campus when locked (a Principal can now act on a sister-district
// applicant, and it's their own school's process that applies), falling
// back to the first campus the applicant's own form branches mention
// only for Owner/ALL, who has no campus of their own. Shared by the
// Staff Portal link, the Document Submission link, and the docs check
// -- one place for this resolution instead of three slightly different
// copies.
function applicantCampusFor_(a) {
  if (SESSION.campusId !== 'ALL') return SESSION.campusId;
  const m = a.branches.match(/LMS-(\d)/);
  return m ? 'LMS' + m[1] : '';
}

// Deep-links into the Staff Portal's New Hire tab with name + campus
// pre-filled -- same "hand off via URL params" pattern the old Salary
// Slip integration used, rather than duplicating the hire form here.
function hireLinkUrl_(a) {
  const school = applicantCampusFor_(a);
  const params = new URLSearchParams({ name: a.name });
  if (school) params.set('school', school);
  return '../staff/add-employee.html?' + params.toString();
}

// Same hand-off pattern as hireLinkUrl_ above, into the Salary Dashboard
// module (2026-09-25) -- applicantId doubles as the sheet row (hiring.gs's
// hirApplicantId_ is literally 'T-' + row padded), so the calculator can
// parse it back out and write salaryOfferAt to the right row without a
// second lookup call. Also carries the specific role being hired for
// (level + subjects) -- per Uday, name + role are the two base
// parameters a salary calculation actually starts from, so they're
// pre-filled rather than re-typed. Looked up from ROLES by
// selectedRoleKey (the role the Principal is currently viewing this
// applicant under) rather than a.matchedRoleKeys[0], since an applicant
// can match more than one open role and the one on-screen right now is
// the one actually being acted on.
function salaryLinkUrl_(a) {
  const school = applicantCampusFor_(a);
  const role = ROLES.filter(function (r) { return r.roleKey === selectedRoleKey; })[0];
  const params = new URLSearchParams({ name: a.name, applicantId: a.applicantId });
  if (school) params.set('school', school);
  if (role && role.roleLevel) params.set('role', role.roleLevel);
  if (role && role.subjects) params.set('subjects', role.subjects);
  return '../salary/index.html?' + params.toString();
}

// The ladder (2026-09-25, per Uday) -- HIR_LADDER-equivalent order lives
// in hiring.gs; APPLICANTS.statuses is that same list plus 'Rejected'
// tacked on (see hiring.gs's HIR_STATUSES), so slicing it here keeps
// this file from hand-duplicating the ladder order as a second literal.
function ladderStatuses_() { return (APPLICANTS.statuses || []).filter(function (s) { return s !== 'Rejected'; }); }

// 2026-09-25, per Uday ("not by my clicking"): only 'Hired' and
// 'Rejected' are still a deliberate click -- real decisions, never
// inferred. Every earlier rung is DERIVED server-side from actual
// evidence (a date entered, an Interview Report found -- see
// hirEffectiveStatus_ in hiring.gs) and just renders as a plain tick
// here, not a button; `currentStatus` is that server-computed value,
// used purely for displaying how far along the ladder someone is.
function ladderHtml_(currentStatus) {
  const ladder = ladderStatuses_();
  const idx = ladder.indexOf(currentStatus);
  const rungs = ladder.map(function (s, i) {
    const done = idx !== -1 && i <= idx;
    const isPending = s === currentStatus;
    if (s === 'Hired') {
      const cls = 'ladder-item' + (done ? ' ladder-done' : '') + (isPending ? ' ladder-pending' : '');
      return '<button type="button" class="' + cls + '" data-stage="Hired">' + (done ? '✓ ' : '○ ') + s + '</button>';
    }
    const cls = 'ladder-item ladder-derived' + (done ? ' ladder-done' : '');
    // 'Interview & Demo Done' only ever ticks once a real Interview Report
    // is on file (see hirDerivedLadderStage_ in hiring.gs) -- once done,
    // make the tick itself open that report's PDF instead of leaving it a
    // dead label, so a Principal doesn't have to dig for it separately.
    if (s === 'Interview & Demo Done' && done) {
      return '<button type="button" class="' + cls + '" data-open-report="1">' + '✓ ' + s + '</button>';
    }
    return '<span class="' + cls + '">' + (done ? '✓ ' : '○ ') + s + '</span>';
  }).join('');
  const rejectCls = 'ladder-item ladder-reject' + (currentStatus === 'Rejected' ? ' ladder-pending' : '');
  return '<div class="ladder">' + rungs + '<button type="button" class="' + rejectCls + '" data-stage="Rejected">✗ Reject</button></div>';
}

// 2026-09-25, per Uday: a dedicated "what do I need to do next, and
// where do I do it" bar living right under the ticks, instead of the
// update controls sitting off in the separate Notes column where the
// connection to the Stage ticks wasn't obvious.
//
// 2026-09-26, per Uday: laid out as a genuine progression -- Interview
// Scheduled date, then the Interview Report Form link, then the MD
// Academics date, then Open Salary Dashboard, each section only
// appearing once its own trigger has actually fired (idx crossing the
// matching ladder rung), and staying visible after that rather than
// disappearing again once you've moved past it -- so a Principal never
// sees, say, the MD Academics date field before there's even an
// Interview Report on file for it to mean anything.
function reqBarHtml_(a) {
  if (a.status === 'Hired' || a.status === 'Rejected') return '';
  const idx = ladderStatuses_().indexOf(a.status);
  let html = '<div class="req-bar">';

  // 1. Interview Scheduled -- always available, the very first trigger.
  if (idx < 0) html += '<div class="req-hint">Next: enter the interview date below, then Save.</div>';
  html += '<div class="interview-label">Interview scheduled</div><input class="interview-input" type="datetime-local" value="' + (a.interviewAt ? a.interviewAt.slice(0, 16) : '') + '">';

  // 2. Interview Reports -- 2026-09-26, per Uday: this was one button
  // trying to do two different jobs depending on stage (go submit vs.
  // go view), which read as broken/confusing. Now it's a header with
  // exactly one action under it at a time: "Submit Report" (the blank
  // Google Form) before a report's on file, "View Report" (the
  // applicant's own PDF via openInterviewReportPdf_/data-open-report --
  // column G "Upload Scanned PDF..." on the Interview Reports sheet,
  // matched by phone) once idx has actually advanced past this rung,
  // i.e. hirDerivedLadderStage_ in hiring.gs already confirmed one
  // exists.
  if (idx === 0) {
    html += '<div class="req-hint">Next: submit the Interview Report, then refresh.</div>' +
      '<div class="interview-label">Interview Reports</div>' +
      '<a class="mini-btn" style="text-decoration:none;display:inline-block;margin-top:4px" href="https://forms.gle/3J5hhHVfTdjn162t9" target="_blank">📝 Submit Report</a>';
  } else if (idx >= 1) {
    html += '<div class="interview-label">Interview Reports</div>' +
      '<button type="button" class="mini-btn" style="display:inline-block;margin-top:4px" data-open-report="1">🔍 View Report</button>';
  }

  // 3. MD Academics interview date -- opens once the Interview Report is on file.
  if (idx >= 1) {
    if (idx === 1) html += '<div class="req-hint">Next: enter the MD Academics interview date below, then Save.</div>';
    html += '<div class="interview-label">MD Academics interview</div><input class="md-interview-input" type="datetime-local" value="' + (a.mdInterviewAt ? a.mdInterviewAt.slice(0, 16) : '') + '">';
  }

  // 4. Salary Dashboard -- opens once the MD Academics date is saved.
  if (idx >= 2) {
    if (idx === 2) html += '<div class="req-hint">Next: compute and record a Salary Offer.</div>';
    html += '<a class="mini-btn" style="text-decoration:none;display:inline-block;margin-top:4px" href="' + salaryLinkUrl_(a) + '" target="_blank">💰 Open Salary Dashboard</a>';
  }

  return html + '</div>';
}

// Saves immediately (whatever Notes/dates are currently in the row at
// that moment go with it) -- a Hired/Reject click is already an
// unambiguous, deliberate action, no separate confirm step needed.
// 2026-09-25, per Uday: "only when all of the relevant submissions are
// made would the stage of an applicant actually change" -- this used
// to optimistically redraw the ladder as ticked the instant a rung was
// clicked, BEFORE the server confirmed the save. If the hard gate then
// rejected it (e.g. Hired without a CV/Interview Report/documents on
// file), the ladder kept showing the false, unsaved state until a full
// page reload -- exactly backwards from what's required. Now the
// ladder-cell is left completely untouched by a click; it only ever
// re-renders from the FRESH server response inside saveRow_'s success
// path (renderRows(), full-table rebuild), so a rejected save leaves
// the ladder exactly as it truly was, no false-positive tick possible.
function selectLadderStage_(tr, stage) {
  tr.dataset.pendingStatus = stage;
  saveRow_(tr, tr._applicant);
}

// Only Hired/Reject carry data-stage now -- the derived rungs are plain
// <span>s with no click handler at all.
function wireLadderClicks_(tr) {
  tr.querySelectorAll('.ladder-item[data-stage]').forEach(function (btn) {
    btn.onclick = function () { selectLadderStage_(tr, btn.dataset.stage); };
  });
  tr.querySelectorAll('[data-open-report]').forEach(function (btn) {
    btn.onclick = function () { openInterviewReportPdf_(tr._applicant); };
  });
}

// Shared by the ladder's own "Interview & Demo Done" tick, the req-bar's
// "Interview Report" button, and the "🔍 report" row-action button, so
// there's one place that knows how to turn a lookup result into either
// an opened PDF or an alert.
//
// Opens the blank tab SYNCHRONOUSLY, before the async lookup even
// starts, and redirects it once the PDF URL comes back -- calling
// window.open() only after gasGet_'s fetch resolves lost the "this was
// a real click" context by then, so most browsers silently popup-block
// it (no error, no alert, just nothing happening -- exactly what Uday
// hit live). A blank tab opened inside the click handler itself still
// counts as user-initiated, so it's allowed, and can be redirected or
// closed once the lookup finishes.
// .catch added 2026-09-26 -- without it, a failed fetch or a non-JSON
// response (gasGet_ has no error handling of its own) left the blank
// tab opened above sitting blank FOREVER with no alert either, since
// the .then() callback simply never ran -- exactly the "still leads to
// a blank page" Uday hit even after the res.result fix. Now a failure
// closes the tab and says so, instead of leaving it hanging silently.
function openInterviewReportPdf_(applicant) {
  const win = window.open('', '_blank');
  gasGet_('hiringcheckinterviewreport', { phone: applicant.phone }).then(function (r) {
    if (r.found && r.pdf) { if (win) win.location = r.pdf; else window.open(r.pdf, '_blank'); return; }
    if (win) win.close();
    if (r.found) { alert('Interview report found but no PDF link on file.\nRemarks: ' + (r.remarks || '—')); return; }
    alert('No interview report found for this phone number yet.');
  }).catch(function (err) {
    if (win) win.close();
    alert('Could not look up the interview report (network or server error). Try again.\n' + (err && err.message ? err.message : err));
  });
}

// Contextual link buttons, keyed off the applicant's TRUE current
// status (server-derived from evidence, applicant.status) -- ladder
// index gates: Interview Report Form once past the interview itself;
// Document Submission and Salary Dashboard both from MD Academics
// Interview Scheduled onward, so documents can start flowing in and an
// offer can be computed BEFORE the Hired click hits the hard gate in
// hiring.gs (CV + Interview Report + all documents + both Approvals) --
// none of those three are prerequisites of each other.
function renderRowActions_(tr) {
  const applicant = tr._applicant;
  const idx = ladderStatuses_().indexOf(applicant.status);
  const school = applicantCampusFor_(applicant);
  const extra = [];
  if (idx >= 1) extra.push('<a class="mini-btn" style="text-decoration:none" href="https://forms.gle/3J5hhHVfTdjn162t9" target="_blank">🔗 Interview Report Form</a>');
  // Real link (2026-09-25) -- opens the Salary Dashboard's offer-letter
  // calculator, name/campus/applicantId pre-filled via URL params (same
  // hand-off pattern as hireLinkUrl_ below).
  if (idx >= 2) extra.push('<a class="mini-btn" style="text-decoration:none" href="' + salaryLinkUrl_(applicant) + '" target="_blank">🔗 Salary Dashboard</a>');
  if (idx >= 2 && DOC_FORM_URLS[school]) extra.push('<a class="mini-btn" style="text-decoration:none" href="' + DOC_FORM_URLS[school] + '" target="_blank">🔗 Document Submission Form</a>');
  if (applicant.status === 'Hired') extra.push('<a class="mini-btn" style="text-decoration:none" href="' + hireLinkUrl_(applicant) + '" target="_blank">➕ Complete hire in Staff Portal</a>');
  tr.querySelector('.row-extra-actions').innerHTML = extra.join('');
}

function renderRows() {
  const emptyMsg = document.getElementById('emptyMsg');
  // Nothing shows until a specific role is picked (Step 3) -- an empty
  // roles list already covers "nothing approved anywhere" via
  // renderRolesList_ hiding applicantSection entirely, so this only
  // ever needs to handle "roles exist, none picked yet" and "picked,
  // here's who matches."
  if (!selectedRoleKey) {
    document.getElementById('rows').innerHTML = '';
    emptyMsg.textContent = 'Pick a role above to see matching applicants.';
    emptyMsg.style.display = '';
    return;
  }
  const list = (APPLICANTS.applicants || []).filter(function (a) {
    return (a.matchedRoleKeys || []).indexOf(selectedRoleKey) !== -1;
  });
  emptyMsg.textContent = 'No applicants match this role yet.';
  emptyMsg.style.display = list.length ? 'none' : '';
  document.getElementById('rows').innerHTML = list.map(function (a) {
    const phoneDigits = a.phone.replace(/\D/g, '');
    // matchScore/matchRemarks come pre-computed from hirScoreApplicant_
    // (hiring.gs) -- the list itself is already sorted recent-first then
    // best-match-first server-side, this just makes the score (and WHY)
    // visible instead of an invisible sort order.
    // data-pending-status only ever carries a Hired/Rejected click
    // through to saveRow_ -- the derived rungs (a.status could be
    // "Interview Scheduled" etc.) are never a valid value to SEND, only
    // to DISPLAY (ladderHtml_(a.status) below handles that separately).
    const initialPending = (a.status === 'Hired' || a.status === 'Rejected') ? a.status : '';
    return '<tr data-row="' + a.row + '" data-pending-status="' + initialPending + '">' +
      '<td class="score-cell" title="' + (a.matchRemarks || []).join(' · ').replace(/"/g, '&quot;') + '">' + (a.matchScore != null ? a.matchScore : '—') + '</td>' +
      '<td><div class="name">' + a.name + ' <span class="applicant-id">' + a.applicantId + '</span></div><div class="sub">' +
        (phoneDigits ? '<a class="linklike" href="tel:' + a.phone + '">' + a.phone + '</a> · <a class="linklike" href="https://wa.me/91' + phoneDigits.slice(-10) + '" target="_blank">WhatsApp</a>' : a.phone) +
        ' · ' + (a.age || '—') + ' · ' + (a.gender || '—') + '</div></td>' +
      '<td class="sub">' + (a.timestamp ? new Date(a.timestamp).toLocaleString() : '—') + '</td>' +
      '<td>' + (a.subjects || '—') + '</td>' +
      '<td>' + (a.qualification || '—') + (a.bed ? ' · ' + a.bed : '') + '</td>' +
      '<td>' + (a.cv ? '<a class="linklike" href="' + a.cv + '" target="_blank">View</a>' : '—') + '</td>' +
      '<td class="ladder-cell">' + ladderHtml_(a.status) + '</td>' +
      '<td class="reqbar-cell">' + reqBarHtml_(a) +
        '<input class="notes-input" type="text" value="' + (a.notes || '').replace(/"/g, '&quot;') + '" placeholder="Notes"></td>' +
      '<td>' +
        '<button class="save-btn">Save</button>' +
        '<div class="row-actions">' +
          '<button class="mini-btn" data-check="report">🔍 report</button>' +
          '<button class="mini-btn" data-check="docs">🔍 docs</button>' +
        '</div>' +
        '<div class="row-actions row-extra-actions"></div>' +
        '<div class="row-msg"></div>' +
      '</td>' +
    '</tr>';
  }).join('');

  document.querySelectorAll('#rows tr').forEach(function (tr) {
    const row = tr.dataset.row;
    const applicant = list.find(function (a) { return String(a.row) === row; });
    tr._applicant = applicant;
    tr.querySelector('.save-btn').onclick = function () { saveRow_(tr, applicant); };
    tr.querySelectorAll('[data-check]').forEach(function (btn) {
      btn.onclick = function () { runCheck_(applicant, btn.dataset.check); };
    });
    wireLadderClicks_(tr);
    renderRowActions_(tr);
  });
}

function saveRow_(tr, applicant) {
  const btn = tr.querySelector('.save-btn');
  const msg = tr.querySelector('.row-msg');
  const status = tr.dataset.pendingStatus || '';
  const notes = tr.querySelector('.notes-input').value;
  const interviewAt = tr.querySelector('.interview-input').value;
  const mdInterviewAt = tr.querySelector('.md-interview-input').value;
  // Blank status is the normal case now -- saving a date/Notes edit
  // without a Hired/Reject click. hiring.gs treats blank as "don't
  // touch Status, the stage is derived from evidence anyway."
  btn.disabled = true;
  msg.textContent = 'Saving…'; msg.className = 'row-msg';
  gasPost_('updatehiringstatus', { row: applicant.row, status: status, notes: notes, interviewAt: interviewAt, mdInterviewAt: mdInterviewAt })
    .then(function (res) {
      btn.disabled = false;
      // A rejected write (e.g. Hired without CV/Report/documents) leaves
      // the ladder untouched -- it was never optimistically updated in
      // the first place (see selectLadderStage_), so there's nothing to
      // revert here. The error just explains why nothing changed.
      if (!res.success) { msg.textContent = res.error; msg.className = 'row-msg err'; return; }
      APPLICANTS = res; msg.textContent = 'Saved'; msg.className = 'row-msg ok';
      setTimeout(function () { renderRows(); }, 400);
    })
    .catch(function () { btn.disabled = false; msg.textContent = 'Network error — try again'; msg.className = 'row-msg err'; });
}

function runCheck_(applicant, kind) {
  if (kind === 'report') {
    openInterviewReportPdf_(applicant);
  } else {
    const campusId = applicantCampusFor_(applicant);
    gasGet_('hiringcheckdocuments', { campusId: campusId, name: applicant.name }).then(function (r) {
      if (!r.found) { alert('No document submission found yet for ' + applicant.name + ' at ' + campusId + '.'); return; }
      alert(r.complete ? 'All required documents present.' : 'Missing: ' + r.missing.join(', '));
    });
  }
}

function loadAll_() {
  Promise.all([gasGet_('hiringapplicants'), gasGet_('hiringapprovalstatus')]).then(function (results) {
    const applicants = results[0], approvalStatus = results[1];
    if (!applicants.success) { document.getElementById('mainRoot').innerHTML = '<div class="empty">' + applicants.error + '</div>'; document.getElementById('mainRoot').style.display = ''; return; }
    APPLICANTS = applicants;
    APPROVAL_STATUS = approvalStatus.success ? approvalStatus : { campuses: [] };
    document.getElementById('mainRoot').style.display = '';
    renderCampusTabs_();
    renderDataSourceLinks_();
    renderRolesList_();
    renderRows();
  });
}

function showApp(session) {
  SESSION = session;
  document.getElementById('authRoot').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  document.getElementById('welcomeStrip').innerHTML =
    '<span>Signed in as <b>' + session.name + '</b> — ' + session.campusName + '</span>' +
    '<a href="#" class="signout" id="signoutLink">Sign out</a>';
  document.getElementById('signoutLink').onclick = function (e) { e.preventDefault(); LMCS.signOut(); };

  if (!LMCS.canViewTeacherSS(session)) {
    document.getElementById('deniedRoot').innerHTML =
      '<div class="denied"><div class="icon">🔒</div><h3>Not available for your role</h3>' +
      '<p>Hiring Dashboard is for Principals, Coordinators, and the Owner.</p></div>';
    return;
  }
  loadAll_();
}

// Fast path: skip the live allowlist re-check (can take 20s+ — see the
// perf audit) when there's already a cached, valid session, same as
// every other module page's gate.
const cachedSession = LMCS.getSession();
if (cachedSession) {
  showApp(cachedSession);
} else {
  LMCS.requireSession('#authRoot').then(showApp);
}
</script>
