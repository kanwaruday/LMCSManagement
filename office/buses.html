<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMCS Portal — Live Buses</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1f3a5f" />
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="../assets/style.css?v=0049023a" />
  <link rel="stylesheet" href="../coordinator/shared.css?v=29f58300" />
  <link rel="stylesheet" href="office.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="../index.html">
        <span class="logo-badge"><img src="../assets/img/lms-logo.png" alt="LMS logo" /></span>
        <span>LMCS Portal <span class="tagline">Fee Clerk + PRO</span></span>
      </a>
      <nav class="roles" id="header-status">
        <span id="sync-indicator" role="status" aria-live="polite"></span>
        <select id="campus-pick" aria-label="Campus" hidden></select>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="hero" id="auth-root" style="padding-top:40px;">
      <span class="eyebrow">Internal · Staff use only</span>
      <h1>Live Buses</h1>
      <div id="gate-slot"></div>
    </section>
    <div id="app-root" style="display:none">
      <div class="welcome">
        <div class="welcome-text" id="who"></div>
        <a href="#" class="signout" id="signout-link">Sign out</a>
      </div>
      <p id="auth-notice" role="alert" hidden>Your sign-in has expired. Sign in again to send waiting entries.</p>
      <nav class="office-nav"><a class="btn-lg" href="index.html">Today</a></nav>
      <p class="hint">Fuel bills to check, then where your campus buses are now.</p>
      <section class="block" id="bus-checks"></section>
      <section class="block" id="today"></section><!-- id "today" is the shell's message slot too -->
    </div>
  </main>
  <footer class="site"><div class="wrap">LMCS Portal — internal management system for La Montessori Schools.</div></footer>
  <script src="../assets/auth.js?v=ffa8751c"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="../coordinator/transport-live.js?v=9eeb093f"></script>
  <script src="../coordinator/transport-checks.js?v=e2b283ed"></script>
  <script type="module">
    import { bootOffice } from './js/shell.js';
    bootOffice({ onReady: (session) => {
      window.TransportChecks.mountClerk(document.getElementById('bus-checks'), session);
      window.TransportLive.mount(document.getElementById('today'), session);
    } });
  </script>
</body>
</html>
