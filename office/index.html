<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMCS Portal — Fee Clerk + PRO</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#1f3a5f" />
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="../assets/style.css" />
  <link rel="stylesheet" href="office.css" />
</head>
<body>
  <header class="site">
    <div class="wrap">
      <a class="brand" href="../index.html">
        <span class="logo-badge"><img src="../assets/img/lms-logo.png" alt="LMS logo" /></span>
        <span>LMCS Portal <span class="tagline">Fee Clerk + PRO</span></span>
      </a>
      <nav class="roles" id="header-status">
        <span id="sync-indicator" role="status" aria-live="polite"></span>
        <select id="campus-pick" aria-label="Campus" hidden></select>
      </nav>
    </div>
  </header>
  <main class="wrap">
    <section class="hero" id="auth-root" style="padding-top:40px;">
      <span class="eyebrow">Internal · Staff use only</span>
      <h1>Fee Clerk + PRO</h1>
      <div id="gate-slot"></div>
    </section>
    <div id="app-root" style="display:none">
      <div class="welcome">
        <div class="welcome-text" id="who"></div>
        <a href="#" class="signout" id="signout-link">Sign out</a>
      </div>
      <p id="auth-notice" role="alert" hidden>Your sign-in has expired. Sign in again to send waiting entries.</p>
      <nav class="office-nav"><a class="btn-lg" href="daybook.html">Day Book</a><a class="btn-lg" href="report.html">Daily Report</a><a class="btn-lg" href="deposits.html">Deposits</a><a class="btn-lg" href="close.html">Close Day</a><a class="btn-lg" href="../staff/add-employee.html?view=documents">Staff Documents</a><a class="btn-lg" href="transport.html">Transport Papers</a></nav>
      <section class="block" id="today"></section>
    </div>
  </main>
  <footer class="site"><div class="wrap">LMCS Portal — internal management system for La Montessori Schools.</div></footer>
  <script src="../assets/auth.js"></script>
  <script type="module">
    import { bootOffice } from './js/shell.js';
    import { showToday } from './js/today.js';
    import { canSeeAccounts } from './js/accounts.js';
    bootOffice({ onReady: (session, api) => {
      if (canSeeAccounts(session)) { const a = document.createElement('a'); a.className = 'btn-lg'; a.href = 'accounts.html'; a.textContent = 'Accounts'; document.querySelector('.office-nav').append(a); }
      return showToday(document.getElementById('today'), session, api);
    } });
  </script>
</body>
</html>
