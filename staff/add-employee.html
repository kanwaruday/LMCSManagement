<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMCS — Add / Transfer Staff</title>
<style>
:root{--red:#CE0000;--red-h:#a50000;--red-lt:rgba(206,0,0,.07);--dark:#1a1a1a;--gray:#555;--lgray:#f5f5f5;--border:#ddd;--white:#fff;--green:#15803d}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--white);color:var(--dark);min-height:100vh;font-size:13px;line-height:1.6;display:flex;flex-direction:column}

.hdr{background:var(--red);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;border-bottom:1px solid var(--red-h)}
.hdr-brand{display:flex;align-items:center;gap:10px}
.hdr h1{font-size:14px;font-weight:700;letter-spacing:.3px}
.hdr p{font-size:9.5px;opacity:.75;margin-top:1px}
.hdr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.hdr-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.92);padding:5px 12px;border-radius:4px;font-size:11px;font-weight:600;text-decoration:none;cursor:pointer;transition:background .15s;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.22)}

#appBody{flex:1;overflow:auto;padding:24px;max-width:820px;margin:0 auto;width:100%}

.notice{background:#fff3cd;border:1px solid #ffc107;color:#92400e;padding:12px 16px;font-size:12px;border-radius:6px;margin-bottom:16px;line-height:1.6}
.denied{text-align:center;padding:60px 20px;color:var(--gray)}
.denied .icon{font-size:36px;margin-bottom:10px}
.denied h3{font-size:15px;color:var(--dark);margin-bottom:6px}

.tabs{display:flex;gap:6px;margin-bottom:20px;border-bottom:2px solid var(--border)}
.tab-btn{background:none;border:none;padding:10px 16px;font-size:13px;font-weight:600;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px}
.tab-btn.active{color:var(--red);border-bottom-color:var(--red)}
.tab-panel{display:none}
.tab-panel.active{display:block}

.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.field input,.field select{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:5px;font-size:13px;font-family:inherit;color:var(--dark)}
.field input:focus,.field select:focus{outline:none;border-color:var(--red)}
.field input:disabled,.field select:disabled{background:var(--lgray);color:var(--gray)}
.field-hint{font-size:10.5px;color:#9ca3af;margin-top:4px}
.code-preview{font-size:12px;color:var(--gray);margin-top:4px}
.code-preview b{color:var(--red);font-family:monospace}

.cs-row{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center}
.cs-remove{background:none;border:1px solid var(--border);border-radius:5px;color:var(--gray);cursor:pointer;padding:7px 10px;font-size:12px}
.cs-remove:hover{border-color:var(--red);color:var(--red)}
.add-row-btn{background:var(--lgray);border:1.5px dashed var(--border);border-radius:5px;padding:8px 14px;font-size:12px;font-weight:600;color:var(--gray);cursor:pointer;width:100%;margin-top:4px}
.add-row-btn:hover{border-color:var(--red);color:var(--red)}

.sec-lbl{font-size:12px;font-weight:700;color:var(--dark);margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--border)}

.submit-btn{background:var(--red);color:#fff;border:none;border-radius:6px;padding:11px 22px;font-size:13px;font-weight:700;cursor:pointer;margin-top:8px}
.submit-btn:hover{background:var(--red-h)}
.submit-btn:disabled{background:#e5b8b8;cursor:not-allowed}

.result-box{margin-top:16px;padding:14px 16px;border-radius:6px;font-size:12.5px;line-height:1.7}
.result-box.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:var(--green)}
.result-box.err{background:#fff8f8;border:1px solid #fecaca;color:var(--red)}
</style>
</head>
<body>

<!-- LMCS Portal auth gate -->
<style>
  #lmcs-gate{position:fixed;inset:0;z-index:99999;background:#fff;display:flex;align-items:center;justify-content:center}
  #lmcs-gate .auth-gate{max-width:380px;margin:0 auto;padding:32px 28px;border:1px solid #ddd;border-top:3px solid #CE0000;border-radius:6px;text-align:center;font-family:'Segoe UI',Arial,sans-serif}
  #lmcs-gate .auth-gate p{color:#555;font-size:13px;line-height:1.6;margin:0 0 20px}
  #lmcs-gate #lmcs-g-signin{display:flex;justify-content:center}
  #lmcs-gate .auth-denied{margin-top:16px;background:#fde8e8;border:1px solid #CE0000;color:#a70000;border-radius:8px;padding:12px 14px;font-size:12px;line-height:1.6;text-align:left}
</style>
<div id="lmcs-gate"><div id="lmcs-gate-slot"></div></div>
<script src="../assets/auth.js"></script>
<script>
(function () {
  if (LMCS.getSession()) { document.getElementById('lmcs-gate').style.display = 'none'; return; }
  LMCS.requireSession('#lmcs-gate-slot').then(function () { window.location.reload(); });
})();
</script>

<!-- HEADER -->
<div class="hdr">
  <div class="hdr-brand">
    <div>
      <h1>LMCS — Add / Transfer Staff</h1>
      <p id="hdrCtx">Writes to the Employee Master workbook</p>
    </div>
  </div>
  <div class="hdr-right">
    <a href="../index.html" class="hdr-btn">← Portal</a>
  </div>
</div>

<div id="appBody">
  <div id="deniedBox" style="display:none"></div>
  <div id="formArea" style="display:none">

    <div class="tabs">
      <button class="tab-btn active" data-tab="hire" onclick="switchTab('hire')">➕ New Hire</button>
      <button class="tab-btn" data-tab="transfer" onclick="switchTab('transfer')">🔁 Transfer</button>
      <button class="tab-btn" data-tab="inactive" onclick="switchTab('inactive')">⛔ Mark Inactive</button>
    </div>

    <!-- ══════════════════ NEW HIRE ══════════════════ -->
    <div class="tab-panel active" id="panel-hire">
      <div class="field">
        <label>Name</label>
        <input type="text" id="hireName" placeholder="Full name">
      </div>
      <div class="field-row">
        <div class="field">
          <label>Date of Joining</label>
          <input type="date" id="hireDoj" onchange="previewCode('hire')">
        </div>
        <div class="field">
          <label>School</label>
          <select id="hireSchool" onchange="previewCode('hire');loadEmployeesFor('hire')"></select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Job Role / Title</label>
          <input type="text" id="hireRole" placeholder="e.g. Subject Teacher">
        </div>
        <div class="field">
          <label>Reports To</label>
          <input type="text" id="hireReportsTo" list="hireReportsToList" placeholder="Search by name…">
          <datalist id="hireReportsToList"></datalist>
        </div>
      </div>
      <div class="field-hint" id="hireCodePreview"></div>

      <div class="sec-lbl">Class &amp; Subject Assignments</div>
      <div id="hireCsRows"></div>
      <button class="add-row-btn" onclick="addCsRow('hire')">+ Add class/subject</button>

      <div>
        <button class="submit-btn" onclick="submitHire(event)">Add Employee</button>
      </div>
      <div id="hireResult"></div>
    </div>

    <!-- ══════════════════ TRANSFER ══════════════════ -->
    <div class="tab-panel" id="panel-transfer">
      <div class="field">
        <label>Employee being transferred</label>
        <input type="text" id="xferEmployee" list="xferEmployeeList" placeholder="Search by name…" onchange="onXferEmployeePicked()">
        <datalist id="xferEmployeeList"></datalist>
        <div class="field-hint" id="xferCurrentInfo"></div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>New School</label>
          <select id="xferNewSchool" onchange="previewCode('xfer')"></select>
        </div>
        <div class="field">
          <label>New Job Role / Title</label>
          <input type="text" id="xferRole" placeholder="e.g. Subject Teacher">
        </div>
      </div>
      <div class="field">
        <label>Reports To (at new school)</label>
        <input type="text" id="xferReportsTo" list="xferReportsToList" placeholder="Search by name…">
        <datalist id="xferReportsToList"></datalist>
      </div>
      <div class="field-hint" id="xferCodePreview"></div>

      <div class="sec-lbl">Class &amp; Subject Assignments (at new school)</div>
      <div id="xferCsRows"></div>
      <button class="add-row-btn" onclick="addCsRow('xfer')">+ Add class/subject</button>

      <div>
        <button class="submit-btn" onclick="submitTransfer(event)">Transfer Employee</button>
      </div>
      <div id="xferResult"></div>
    </div>

    <!-- ══════════════════ MARK INACTIVE ══════════════════ -->
    <div class="tab-panel" id="panel-inactive">
      <div class="field">
        <label>Employee</label>
        <input type="text" id="inactEmployee" list="inactEmployeeList" placeholder="Search by name…">
        <datalist id="inactEmployeeList"></datalist>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Date of Resignation</label>
          <input type="date" id="inactDoRes">
        </div>
        <div class="field">
          <label>Date of Relieving</label>
          <input type="date" id="inactDoRel">
        </div>
      </div>
      <div>
        <button class="submit-btn" onclick="submitInactive(event)">Mark Inactive</button>
      </div>
      <div id="inactResult"></div>
    </div>

  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONFIG
   STAFF_API_URL: the write-capable "LMCS Staff Management API"
   project -- deploy apps-script/staff-management-api.gs and paste its
   Web App URL here. EMPLOYEE_ROSTER_URL is the existing read-only
   proxy, reused here only for populating the search dropdowns (already
   excludes departed/inactive staff).
═══════════════════════════════════════════════════════════ */
const STAFF_API_URL = 'https://script.google.com/macros/s/AKfycbwPKhRNsGCjbhtpKOCxzj9k1xqT6Pr2MxwbZLUdKQd0eLGS6yVlqn5Hqm6qHjrIH5yV/exec';
const EMPLOYEE_ROSTER_URL = 'https://script.google.com/macros/s/AKfycbyHiaZY_iWK2VTKKFJcCsBNnIbUndJYUSjnPkxvJ-dYavaihiul2xBJuJohPRsP9Spf/exec';

const CAMPUS_LABELS = {
  LMS1: 'LMS 1 — Dhalpur', LMS2: 'LMS 2 — Kelheli', LMS3: 'LMS 3 — Dunkhra',
  LMS4: 'LMS 4 — Ner Chowk', LMS5: 'LMS 5 — Sayoli', LMS6: 'LMS 6 — Jogindernagar',
};
const CLASS_OPTIONS = ['M-I','M-II','M-III','Class 1','Class 2','Class 3','Class 4','Class 5',
  'Class 6','Class 7','Class 8','Class 9','Class 10','Class 11','Class 12'];
const SUBJECT_SUGGESTIONS = ['English','Hindi','Sanskrit','Math','Science','Social Science',
  'E.V.S.','GK','Cognitive Activities','P.Ed','Physics','Chemistry','Biology','Accountancy',
  'Business Studies','Economics','History','Political Science','Information Technology'];

let SESSION = null;
let employeesByLabel = {}; // "Name (CODE) — School" -> {employeeCode, name, school}

function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
async function init() {
  SESSION = LMCS.getSession();
  if (!LMCS.canManageStaff(SESSION)) {
    document.getElementById('deniedBox').style.display = 'block';
    document.getElementById('deniedBox').innerHTML =
      '<div class="denied"><div class="icon">🔒</div><h3>You don\'t have staff-management access</h3>' +
      '<p>This page is limited to Coordinators and the Owner. Contact the owner if this is wrong.</p></div>';
    return;
  }

  populateSchoolSelect('hireSchool');
  populateSchoolSelect('xferNewSchool');
  if (SESSION.campusId !== 'ALL') {
    document.getElementById('hireSchool').value = SESSION.campusId;
    document.getElementById('hireSchool').disabled = true;
  }

  addCsRow('hire');
  document.getElementById('hireDoj').value = new Date().toISOString().slice(0, 10);

  document.getElementById('formArea').style.display = 'block';

  await loadAllEmployees();
}

function populateSchoolSelect(id) {
  const el = document.getElementById(id);
  const schools = SESSION.campusId === 'ALL' ? Object.keys(CAMPUS_LABELS) : [SESSION.campusId];
  el.innerHTML = schools.map(function (c) { return '<option value="' + c + '">' + esc(CAMPUS_LABELS[c]) + '</option>'; }).join('');
}

function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.dataset.tab === tab); });
  document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.remove('active'); });
  document.getElementById('panel-' + tab).classList.add('active');
}

/* ═══════════════════════════════════════════════════════════
   EMPLOYEE SEARCH (reads the existing read-only Roster Proxy)
═══════════════════════════════════════════════════════════ */
async function loadAllEmployees() {
  try {
    const res = await fetch(EMPLOYEE_ROSTER_URL + '?action=employees&_=' + Date.now(), { cache: 'no-store' });
    const json = await res.json();
    if (!json.success) throw new Error(json.error || 'proxy error');
    employeesByLabel = {};
    const dl1 = document.getElementById('hireReportsToList');
    const dl2 = document.getElementById('xferEmployeeList');
    const dl3 = document.getElementById('xferReportsToList');
    const dl4 = document.getElementById('inactEmployeeList');
    [dl1, dl2, dl3, dl4].forEach(function (dl) { dl.innerHTML = ''; });
    json.employees.forEach(function (e) {
      if (!e.employeeCode || !e.name) return;
      const label = e.name + ' (' + e.employeeCode + ') — ' + (e.school || '?');
      employeesByLabel[label] = e;
      [dl1, dl2, dl3, dl4].forEach(function (dl) {
        const opt = document.createElement('option');
        opt.value = label;
        dl.appendChild(opt);
      });
    });
  } catch (e) {
    console.warn('Could not load employee list for search boxes:', e);
  }
}

function loadEmployeesFor() { /* datalist is already the full network-wide list; school filtering
  isn't necessary for a search box, kept as a no-op hook in case per-school scoping is wanted later */ }

function resolveEmployeeLabel(inputEl) {
  return employeesByLabel[inputEl.value] || null;
}

/* ═══════════════════════════════════════════════════════════
   CLASS/SUBJECT ROWS
═══════════════════════════════════════════════════════════ */
function addCsRow(prefix) {
  const container = document.getElementById(prefix + 'CsRows');
  if (container.children.length >= 10) return;
  const row = document.createElement('div');
  row.className = 'cs-row';
  const classOpts = CLASS_OPTIONS.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
  const dlId = prefix + 'SubjList' + Date.now() + Math.floor(Math.random() * 1000);
  row.innerHTML =
    '<select class="cs-class">' + classOpts + '</select>' +
    '<input class="cs-subject" list="' + dlId + '" placeholder="Subject">' +
    '<datalist id="' + dlId + '">' + SUBJECT_SUGGESTIONS.map(function (s) { return '<option value="' + s + '">'; }).join('') + '</datalist>' +
    '<button type="button" class="cs-remove" onclick="this.closest(\'.cs-row\').remove()">✕</button>';
  container.appendChild(row);
}

function collectCsRows(prefix) {
  const rows = document.querySelectorAll('#' + prefix + 'CsRows .cs-row');
  const out = [];
  rows.forEach(function (r) {
    const cls = r.querySelector('.cs-class').value;
    const subj = r.querySelector('.cs-subject').value.trim();
    if (cls && subj) out.push({ class: cls, subject: subj });
  });
  return out;
}

/* ═══════════════════════════════════════════════════════════
   CODE PREVIEW
═══════════════════════════════════════════════════════════ */
async function previewCode(which) {
  try {
    let school, doj, targetEl;
    if (which === 'hire') {
      school = document.getElementById('hireSchool').value;
      doj = document.getElementById('hireDoj').value;
      targetEl = document.getElementById('hireCodePreview');
      if (!school || !doj) { targetEl.textContent = ''; return; }
      const json = await callStaffApi('nextcode', { school: school, dateOfJoining: doj });
      targetEl.innerHTML = json.success ? 'Will be assigned: <b>' + esc(json.employeeCode) + '</b>' : '';
    } else {
      // No preview call here: the roster search (employeeCode/name/school
      // only) doesn't carry the employee's original join date, and the real
      // new code reuses THEIR join month from their actual old EmployeeCode
      // -- something only the server can compute correctly, from the real
      // record, at submit time. Guessing here would just be misleading.
      const picked = resolveEmployeeLabel(document.getElementById('xferEmployee'));
      school = document.getElementById('xferNewSchool').value;
      targetEl = document.getElementById('xferCodePreview');
      targetEl.textContent = (picked && school)
        ? 'New code keeps their original join month (from ' + picked.employeeCode + ') with a fresh sequence number at the new school — shown after you submit.'
        : '';
    }
  } catch (e) { /* preview is best-effort, ignore failures */ }
}

function onXferEmployeePicked() {
  const picked = resolveEmployeeLabel(document.getElementById('xferEmployee'));
  const info = document.getElementById('xferCurrentInfo');
  // employee-roster.gs returns school as "LMS 1" (with a space); campusId
  // convention everywhere else in the portal is "LMS1" -- normalize before
  // the CAMPUS_LABELS lookup so this shows the full campus name, not a
  // bare fallback string.
  const normSchool = String(picked && picked.school || '').replace(/\s+/g, '');
  info.textContent = picked ? ('Currently at ' + (CAMPUS_LABELS[normSchool] || picked.school) + ' — Code: ' + picked.employeeCode) : '';
  previewCode('xfer');
}

/* ═══════════════════════════════════════════════════════════
   API CALL
═══════════════════════════════════════════════════════════ */
async function callStaffApi(action, data) {
  const url = STAFF_API_URL + '?action=' + encodeURIComponent(action) +
    '&idToken=' + encodeURIComponent(SESSION.idToken) +
    '&data=' + encodeURIComponent(JSON.stringify(data)) + '&_=' + Date.now();
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function showResult(elId, json) {
  const el = document.getElementById(elId);
  if (json.success) {
    el.innerHTML = '<div class="result-box ok">✅ Done' + (json.employeeCode ? ' — new code: <b>' + esc(json.employeeCode) + '</b>' : '') + '</div>';
  } else {
    el.innerHTML = '<div class="result-box err">⚠ ' + esc(json.error || 'Something went wrong') + '</div>';
  }
}

/* ═══════════════════════════════════════════════════════════
   SUBMIT HANDLERS
═══════════════════════════════════════════════════════════ */
async function submitHire(event) {
  const btn = event.target; btn.disabled = true;
  try {
    const reportsTo = resolveEmployeeLabel(document.getElementById('hireReportsTo'));
    const data = {
      name: document.getElementById('hireName').value.trim(),
      dateOfJoining: document.getElementById('hireDoj').value,
      school: document.getElementById('hireSchool').value,
      role: document.getElementById('hireRole').value.trim(),
      reportsTo: reportsTo ? reportsTo.employeeCode : '',
      classSubjects: collectCsRows('hire'),
    };
    if (!data.name || !data.dateOfJoining || !data.school) throw new Error('Name, date of joining, and school are required');
    const json = await callStaffApi('addnewhire', data);
    showResult('hireResult', json);
    if (json.success) { await loadAllEmployees(); }
  } catch (e) {
    showResult('hireResult', { success: false, error: e.message });
  } finally { btn.disabled = false; }
}

async function submitTransfer(event) {
  const btn = event.target; btn.disabled = true;
  try {
    const picked = resolveEmployeeLabel(document.getElementById('xferEmployee'));
    if (!picked) throw new Error('Pick an existing employee from the list first');
    const reportsTo = resolveEmployeeLabel(document.getElementById('xferReportsTo'));
    const data = {
      oldEmployeeCode: picked.employeeCode,
      newSchool: document.getElementById('xferNewSchool').value,
      role: document.getElementById('xferRole').value.trim(),
      reportsTo: reportsTo ? reportsTo.employeeCode : '',
      classSubjects: collectCsRows('xfer'),
    };
    const json = await callStaffApi('transfer', data);
    showResult('xferResult', json);
    if (json.success) { await loadAllEmployees(); }
  } catch (e) {
    showResult('xferResult', { success: false, error: e.message });
  } finally { btn.disabled = false; }
}

async function submitInactive(event) {
  const btn = event.target; btn.disabled = true;
  try {
    const picked = resolveEmployeeLabel(document.getElementById('inactEmployee'));
    if (!picked) throw new Error('Pick an existing employee from the list first');
    const data = {
      employeeCode: picked.employeeCode,
      dateOfResignation: document.getElementById('inactDoRes').value,
      dateOfRelieving: document.getElementById('inactDoRel').value,
    };
    const json = await callStaffApi('markinactive', data);
    showResult('inactResult', json);
    if (json.success) { await loadAllEmployees(); }
  } catch (e) {
    showResult('inactResult', { success: false, error: e.message });
  } finally { btn.disabled = false; }
}

init();
</script>
</body>
</html>
