<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LMCS — Salary Dashboard · Monthly Payroll</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://accounts.google.com">
<style>
:root{--red:#CE0000;--red-h:#a50000;--red-lt:rgba(206,0,0,.07);--dark:#1a1a1a;--gray:#555;--lgray:#f5f5f5;--border:#ddd;--white:#fff;--green:#15803d;--green-lt:#f0fdf4;--amber:#b45309;--blue:#1e3a8a;--blue-lt:#eff6ff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--white);color:var(--dark);min-height:100vh;font-size:12px;line-height:1.4;display:flex;flex-direction:column}
.hdr{background:var(--red);color:#fff;padding:4px 20px;min-height:36px;flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0;border-bottom:1px solid var(--red-h)}
.hdr h1{font-size:13px;font-weight:700;letter-spacing:.3px}
.hdr p{font-size:8.5px;opacity:.75}
.hdr-btn{display:inline-flex;align-items:center;gap:5px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:rgba(255,255,255,.92);padding:4px 10px;border-radius:4px;font-size:10.5px;font-weight:600;text-decoration:none;white-space:nowrap}
.hdr-btn:hover{background:rgba(255,255,255,.22)}
#appBody{flex:1;overflow:auto;padding:10px 16px;width:100%;max-width:1400px;margin:0 auto}
#authRoot{max-width:420px;margin:60px auto}
.welcome{display:flex;align-items:center;justify-content:space-between;background:var(--lgray);border:1px solid var(--border);border-radius:6px;padding:7px 12px;margin-bottom:8px;gap:10px;font-size:11.5px}
.signout{font-size:10.5px;color:var(--gray);text-decoration:none}
.denied{text-align:center;padding:60px 20px;color:var(--gray)}
.denied .icon{font-size:36px;margin-bottom:10px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
input,select{padding:4px 7px;border:1px solid var(--border);border-radius:4px;font-size:11.5px;font-family:inherit}
.btn{font-size:11.5px;padding:5px 14px;border:none;border-radius:5px;background:var(--red);color:#fff;cursor:pointer;font-weight:700}
.btn:hover{background:var(--red-h)}
.btn:disabled{opacity:.45;cursor:default}
.mini-btn{font-size:10.5px;padding:4px 9px;border:1px solid var(--border);border-radius:5px;background:var(--white);cursor:pointer;color:var(--gray)}
.mini-btn:hover{border-color:var(--red);color:var(--red)}
.x-btn{border:none;background:none;color:#991b1b;cursor:pointer;font-size:13px;padding:0 4px}
.note{font-size:10.5px;color:var(--gray);background:var(--lgray);border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin-bottom:8px}
.warn{font-size:10.5px;color:var(--amber);background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:6px 10px;margin-bottom:8px}
.err{font-size:11px;color:#991b1b;background:#fef2f2;border:1px solid #fecaca;border-radius:6px;padding:8px 10px;margin-bottom:8px}
.ok{font-size:11px;color:var(--green);background:var(--green-lt);border:1px solid #bbf7d0;border-radius:6px;padding:6px 10px;margin-bottom:8px}
.status{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;background:var(--lgray);border:1px solid var(--border);border-radius:6px;padding:8px 12px;margin-bottom:10px}
.status .k{font-size:9.5px;text-transform:uppercase;letter-spacing:.3px;color:var(--gray)}
.status .v{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.status .deadline{margin-left:auto;font-size:10.5px;color:var(--gray)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin-bottom:10px}
.card{border:1px solid var(--border);border-radius:8px;padding:9px 12px;cursor:pointer;background:var(--white);position:relative}
.card:hover{border-color:var(--dark)}
.card.on{border:2px solid var(--dark);padding:8px 11px}
.card.soon{cursor:default;opacity:.55}
.card .t{font-weight:700;font-size:12px}
.card .s{font-size:10.5px;color:var(--gray);margin-top:3px;min-height:15px}
.card .badge{position:absolute;top:8px;right:10px;font-size:9.5px;font-weight:700;padding:1px 7px;border-radius:10px}
.badge.done{background:var(--green-lt);color:var(--green)}
.badge.todo{background:#fffbeb;color:var(--amber)}
.badge.lock{background:var(--blue-lt);color:var(--blue)}
.panel{border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:10px}
.panel h2{font-size:13px;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel h2 .grow{flex:1}
.addrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--lgray);border-radius:6px;padding:7px 8px;margin-bottom:8px}
.addrow input[list]{width:260px}
.wrap{overflow:auto;border:1px solid var(--border);border-radius:6px;margin-bottom:8px}
table{border-collapse:collapse;font-size:11px;width:100%}
th{position:sticky;top:0;background:var(--dark);color:#fff;font-weight:600;padding:5px 6px;text-align:right;white-space:nowrap;font-size:10px}
th.l,td.l{text-align:left}
td{padding:3px 6px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input[type=number]{width:70px;text-align:right;padding:2px 4px;font-size:11px}
tr.diff td{background:#fff7ed}
tr.total td{font-weight:700;border-top:2px solid var(--dark);background:var(--lgray)}
td.pos{color:var(--green);font-weight:600}
td.neg{color:#991b1b;font-weight:600}
.tick{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;padding:4px 10px;border:1px solid var(--border);border-radius:14px;cursor:pointer;background:var(--white)}
.tick.done{background:var(--green-lt);border-color:#bbf7d0;color:var(--green)}
.muted{color:var(--gray);font-size:10.5px}
.viewbar{display:flex;gap:0;border-bottom:2px solid var(--dark);margin-bottom:10px}
.view{font-size:12px;font-weight:700;padding:6px 14px;cursor:pointer;color:var(--gray);border-radius:6px 6px 0 0}
.view:hover{color:var(--dark)}
.view.on{background:var(--dark);color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){.two{grid-template-columns:1fr}}
.schools{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.school{font-size:11.5px;font-weight:600;padding:5px 12px;border:1px solid var(--border);border-radius:16px;background:var(--white);cursor:pointer}
.school:hover{border-color:var(--dark)}
.school.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.school .n{font-weight:400;opacity:.7;margin-left:4px}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--lgray)}
tr.cur td{background:#fef9c3}
.loading-pill{display:none;position:fixed;top:16px;right:16px;background:var(--dark);color:#fff;padding:8px 14px;border-radius:20px;font-size:11.5px;align-items:center;gap:8px;z-index:1000}
.loading-pill.on{display:flex}
.loading-spinner{width:12px;height:12px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="loading-pill" id="loadingPill"><span class="loading-spinner"></span><span id="loadingText">Working…</span></div>
<div class="hdr">
  <div><h1>Salary Dashboard · Monthly Payroll</h1><p>Month checklist — Owner only</p></div>
  <div><a href="../salary/index.html" class="hdr-btn">🧮 Offer Calculator</a> <a href="../index.html" class="hdr-btn">🏠 Portal Home</a></div>
</div>
<div id="appBody">
  <div id="authRoot"></div>
  <div id="appRoot" style="display:none">
    <div class="welcome" id="welcomeStrip"></div>
    <div id="deniedRoot"></div>
    <div id="mainRoot" style="display:none">
      <div class="toolbar">
        <label>Month <input type="month" id="fMonth"></label>
        <button class="btn" id="loadBtn">Open month</button>
      </div>
      <div class="viewbar" id="viewBar"></div>
      <div id="msgRoot"></div>
      <div id="monthRoot"></div>
      <datalist id="empList"></datalist>
      <datalist id="reportsToList"></datalist>
    </div>
  </div>
</div>

<script src="../assets/auth.js"></script>
<script>
// "LMCS Payroll Backend" -- its own Apps Script project (apps-script/payroll.gs).
const PAYROLL_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbziOoYaIol_jeiAjJw4uVKlI5HNpV2BT2MGkQ0AcSdnYGq3MZnHW0ju2W46JrIHovUv/exec';
// "Employee Roster Proxy" (apps-script/staff-management-api.gs) -- the same
// backend staff/add-employee.html's New Hire/Transfer tabs wrote to. Folded in
// here (2026-10-03, per Uday) since every hire now runs Hiring Dashboard ->
// Salary Dashboard -> here, and this was the only step left asking someone to
// go re-type the same name/role a second time. Calls the SAME addnewhire/transfer
// actions, unchanged -- same code generation, same scope checks, same cache-bust
// -- just from a new place, so no EmpMaster write path is new or less safe.
const EMPLOYEE_ROSTER_URL = 'https://script.google.com/macros/s/AKfycbyHiaZY_iWK2VTKKFJcCsBNnIbUndJYUSjnPkxvJ-dYavaihiul2xBJuJohPRsP9Spf/exec';
const CLASS_OPTIONS = ['M-I', 'M-II', 'M-III', 'Class 1', 'Class 2', 'Class 3', 'Class 4', 'Class 5',
  'Class 6', 'Class 7', 'Class 8', 'Class 9', 'Class 10', 'Class 11', 'Class 12'];
const SUBJECT_SUGGESTIONS = ['English', 'Hindi', 'Sanskrit', 'Math', 'Science', 'Social Science',
  'E.V.S.', 'GK', 'Cognitive Activities', 'P.Ed', 'Physics', 'Chemistry', 'Biology', 'Accountancy',
  'Business Studies', 'Economics', 'History', 'Political Science', 'Information Technology'];
let employeesByLabel = {}; // "Name (CODE) — School" -> {employeeCode, name, school}

// 2026-09-30 redesign, per Uday: the month as a checklist of what actually
// changes (leave, one-offs, holds), scoped to all schools or one -- the full
// register is the detailed view inside Review, not the main screen.
const ENTITY_LABEL = { HES: 'HES', LMS1: 'LMS 1', LMS2: 'LMS 2', LMS3: 'LMS 3', LMS4: 'LMS 4', LMS5: 'LMS 5', LMS6: 'LMS 6' };
const STEPS = [
  { id: 'staff', n: '①', t: 'Staff changes' },
  { id: 'leave', n: '②', t: 'Leave & paid days' },
  { id: 'adjustments', n: '③', t: 'Adjustments' },
  { id: 'holds', n: '④', t: 'Holds' },
  { id: 'review', n: '⑤', t: 'Review' },
  { id: 'lock', n: '⑥', t: 'Lock' },
];
// 2026-09-30, per Uday: school-wise by default feel (tabs + by-school table, like the
// first payroll screen), with All schools kept as an option.
let SESSION = null, M = null, SCOPE = 'ALL', OPEN = 'staff', ONLY_DIFF = false;

// ── Backend ──────────────────────────────────────────────────────────
function payGet_(action, data) {
  const url = PAYROLL_BACKEND_URL + '?action=' + encodeURIComponent(action) + '&idToken=' + encodeURIComponent(SESSION.idToken) +
    '&data=' + encodeURIComponent(JSON.stringify(data || {})) + '&_=' + Date.now();
  return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); });
}
function payPost_(action, data) {
  return fetch(PAYROLL_BACKEND_URL, { method: 'POST', body: JSON.stringify({ action: action, idToken: SESSION.idToken, data: data }) })
    .then(function (r) { return r.json(); });
}
function rosterPost_(action, data) {
  const url = EMPLOYEE_ROSTER_URL + '?action=' + encodeURIComponent(action) + '&idToken=' + encodeURIComponent(SESSION.idToken) +
    '&data=' + encodeURIComponent(JSON.stringify(data)) + '&_=' + Date.now();
  return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); }).catch(function () { return { success: false, error: 'network error reaching the Staff Roster' }; });
}
function loadAllEmployees_() {
  return fetch(EMPLOYEE_ROSTER_URL + '?action=employees&_=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (json) {
      if (!json.success) return;
      employeesByLabel = {};
      const dl = document.getElementById('reportsToList');
      dl.innerHTML = '';
      json.employees.forEach(function (e) {
        if (!e.employeeCode || !e.name) return;
        const label = e.name + ' (' + e.employeeCode + ') — ' + (e.school || '?');
        employeesByLabel[label] = e;
        const opt = document.createElement('option');
        opt.value = label;
        dl.appendChild(opt);
      });
    }).catch(function () { /* best-effort -- Reports to just stays free text */ });
}
function resolveEmployeeLabel_(value) { return employeesByLabel[String(value || '').trim()] || null; }

// ── Class/subject rows (ported as-is from staff/add-employee.html) ────
function addCsRow_(prefix) {
  const container = document.getElementById(prefix + 'CsRows');
  if (!container || container.children.length >= 10) return;
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:6px;margin-bottom:4px;align-items:center';
  row.className = 'cs-row';
  const classOpts = CLASS_OPTIONS.map(function (c) { return '<option value="' + c + '">' + c + '</option>'; }).join('');
  const dlId = prefix + 'SubjList' + Date.now() + Math.floor(Math.random() * 1000);
  row.innerHTML =
    '<select class="cs-class">' + classOpts + '</select>' +
    '<input class="cs-subject" list="' + dlId + '" placeholder="Subject" style="width:140px">' +
    '<datalist id="' + dlId + '">' + SUBJECT_SUGGESTIONS.map(function (s) { return '<option value="' + s + '">'; }).join('') + '</datalist>' +
    '<button type="button" class="x-btn" onclick="this.closest(\'.cs-row\').remove()">✕</button>';
  container.appendChild(row);
}
function collectCsRows_(prefix) {
  const rows = document.querySelectorAll('#' + prefix + 'CsRows .cs-row');
  const out = [];
  rows.forEach(function (r) {
    const cls = r.querySelector('.cs-class').value, subj = r.querySelector('.cs-subject').value.trim();
    if (cls && subj) out.push({ class: cls, subject: subj });
  });
  return out;
}
// Every call returns the whole month -- one handler redraws everything.
// Nothing here stops two requests being in flight at once (no button is disabled
// while saving), and fetch/Apps Script give no guarantee the responses arrive back
// in the order they were sent. Without REQ_SEQ, a quick second click (or a slow
// network reordering a response) could let an OLDER response land after a newer
// one and silently overwrite it in M -- audit 2026-10-01, matches a reported case
// of an adjustment that "saved" but didn't show. Only the most recently ISSUED
// request's response is ever applied; every other one is dropped as stale.
// Buttons stayed clickable while a save was in flight (quick win, audit 2026-10-01)
// -- a fast double-click could fire the same action twice. render_() always rebuilds
// the buttons on success, so only the error/catch paths need to re-enable explicitly.
function setButtonsDisabled_(on) { document.querySelectorAll('.btn, button').forEach(function (b) { b.disabled = on; }); }
let REQ_SEQ = 0;
function call_(promise, label, okMsg) {
  const seq = ++REQ_SEQ;
  const msg = document.getElementById('msgRoot');
  document.getElementById('loadingText').textContent = label || 'Working…';
  document.getElementById('loadingPill').classList.add('on');
  setButtonsDisabled_(true);
  return promise.then(function (res) {
    if (seq !== REQ_SEQ) return false; // a newer request already landed -- this one is stale
    document.getElementById('loadingPill').classList.remove('on');
    if (!res.success) { setButtonsDisabled_(false); msg.innerHTML = '<div class="err">' + esc_(res.error) + '</div>'; return false; }
    M = res;
    const msgText = typeof okMsg === 'function' ? okMsg(res) : okMsg;
    msg.innerHTML = msgText ? '<div class="ok">' + esc_(msgText) + '</div>' : '';
    render_(); // rebuilds the buttons, re-enabled
    return true;
  }).catch(function (err) {
    if (seq !== REQ_SEQ) return false;
    document.getElementById('loadingPill').classList.remove('on');
    setButtonsDisabled_(false);
    msg.innerHTML = '<div class="err">Could not reach the payroll backend: ' + esc_(err.message) + '</div>';
    return false;
  });
}
function post_(action, data, label, okMsg) { return call_(payPost_(action, Object.assign({ month: M.month }, data)), label, okMsg); }

// ── Helpers ──────────────────────────────────────────────────────────
function esc_(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function inr_(n) { return n == null ? '—' : n === 0 ? '-' : Math.round(n).toLocaleString('en-IN'); }
function sum_(rows, fn) { return rows.reduce(function (a, r) { return a + (Number(fn(r)) || 0); }, 0); }
function cls_(v) { return v > 0 ? 'pos' : v < 0 ? 'neg' : ''; }
function netDiff_(r) { return r.erpNet == null ? null : r.net - r.erpNet; }
function ctiDiff_(r) { return r.erpCti == null ? null : r.cti - r.erpCti; }
function inScope_(r) { return SCOPE === 'ALL' || r.entity === SCOPE; }
function scopeRows_() { return M.rows.filter(inScope_); }
function isLocked_(entity) { return !!M.locked[entity]; }
function openRows_() { return scopeRows_().filter(function (r) { return !isLocked_(r.entity); }); }
function entitiesInScope_() { return Object.keys(ENTITY_LABEL).filter(function (e) { return (SCOPE === 'ALL' || SCOPE === e) && M.rows.some(function (r) { return r.entity === e; }); }); }
function label_(r) { return r.code + ' — ' + r.name + ' (' + ENTITY_LABEL[r.entity] + ')'; }
function pick_(inputId) {
  const v = document.getElementById(inputId).value;
  return M.rows.find(function (r) { return label_(r) === v || r.code === v.trim(); });
}
// A step is done for a school if ticked for it or for ALL; for the ALL scope, when every school in scope is done.
function stepDone_(step, entity) { const c = M.checklist; return !!((c[entity] || {})[step] || (c.ALL || {})[step]); }
function scopeStepDone_(step) {
  const es = entitiesInScope_().filter(function (e) { return !isLocked_(e); });
  return es.length > 0 && es.every(function (e) { return stepDone_(step, e); });
}
function monthLabel_(ym) { return new Date(ym + '-01T00:00:00').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' }); }

// ── Render ───────────────────────────────────────────────────────────
function render_() {
  if (!M) return;
  document.getElementById('viewBar').innerHTML = viewBar_();
  document.querySelectorAll('[data-view]').forEach(function (el) { el.onclick = function () { show_(el.dataset.view); }; });
  if (VIEW !== 'month') { renderView_(); return; }
  const rows = scopeRows_();
  const open = openRows_();
  document.getElementById('empList').innerHTML = open.map(function (r) { return '<option value="' + esc_(label_(r)) + '">'; }).join('');

  // Status strip
  const next = new Date(M.month + '-01T00:00:00'); next.setMonth(next.getMonth() + 1);
  const nextLabel = next.toLocaleDateString('en-IN', { month: 'short' });
  const lockedEs = entitiesInScope_().filter(isLocked_);
  const hasErp = rows.some(function (r) { return r.erpNet != null; });
  const nd = sum_(rows, netDiff_), cd = sum_(rows, ctiDiff_);
  const erpStat = function (v) { return hasErp ? '<span class="' + cls_(v) + '">' + inr_(v) + '</span>' : '<span class="muted">no ERP data</span>'; };
  let html = schoolTabs_() + '<div class="status">' +
    stat_('Month', monthLabel_(M.month)) + stat_('Scope', SCOPE === 'ALL' ? 'All schools' : ENTITY_LABEL[SCOPE]) +
    stat_('Staff', rows.length) + stat_('Gross', '₹' + inr_(sum_(rows, function (r) { return r.gross; }))) +
    stat_('Net pay', '₹' + inr_(sum_(rows, function (r) { return r.net; }))) +
    stat_('Bank transfer', '₹' + inr_(sum_(rows, function (r) { return r.bankPayable; }))) +
    stat_('CTI', '₹' + inr_(sum_(rows, function (r) { return r.cti; }))) +
    stat_('vs ERP net', erpStat(nd)) + stat_('vs ERP CTI', erpStat(cd)) +
    '<span class="deadline">Lock by 8 ' + nextLabel + ' · pay on 10 ' + nextLabel + (lockedEs.length ? ' · 🔒 ' + lockedEs.map(function (e) { return ENTITY_LABEL[e]; }).join(', ') : '') + '</span></div>';

  // Checklist cards
  html += bySchool_();
  html += '<div class="cards">' + STEPS.map(function (s) {
    const done = s.id === 'lock' ? entitiesInScope_().every(isLocked_) : scopeStepDone_(s.id);
    const allLocked = entitiesInScope_().every(isLocked_);
    const badge = s.soon ? '' : allLocked ? '<span class="badge lock">Locked</span>' : done ? '<span class="badge done">✓ Done</span>' : '<span class="badge todo">To do</span>';
    return '<div class="card' + (OPEN === s.id ? ' on' : '') + (s.soon ? ' soon' : '') + '" data-step="' + s.id + '">' + badge +
      '<div class="t">' + s.n + ' ' + s.t + '</div><div class="s">' + cardSummary_(s.id) + '</div></div>';
  }).join('') + '</div>';

  html += '<div class="panel">' + panel_(OPEN) + '</div>';
  document.getElementById('monthRoot').innerHTML = html;
  wire_();
}

function schoolTabs_() {
  const present = Object.keys(ENTITY_LABEL).filter(function (e) { return M.rows.some(function (r) { return r.entity === e; }); });
  return '<div class="schools">' + ['ALL'].concat(present).map(function (e) {
    const n = e === 'ALL' ? M.rows.length : M.rows.filter(function (r) { return r.entity === e; }).length;
    return '<span class="school' + (SCOPE === e ? ' on' : '') + '" data-scope="' + e + '">' + (e === 'ALL' ? 'All schools' : ENTITY_LABEL[e]) +
      (e !== 'ALL' && isLocked_(e) ? ' 🔒' : '') + '<span class="n">' + n + '</span></span>';
  }).join('') + '</div>';
}

// By-school totals (always every school); click a row to switch to that school.
function bySchool_() {
  const present = Object.keys(ENTITY_LABEL).filter(function (e) { return M.rows.some(function (r) { return r.entity === e; }); });
  const hasErp = M.rows.some(function (r) { return r.erpNet != null; });
  const cols = [['Staff', null], ['Gross', function (r) { return r.gross; }], ['EPF (Ee+Er)', function (r) { return r.epf + r.epfEmployer; }],
    ['ESI (Ee+Er)', function (r) { return r.esi + r.esiEmployer; }], ['RRF', function (r) { return r.rrf; }], ['Net Pay', function (r) { return r.net; }],

// ── Leave template (.xlsx with data validation), built and read in the browser ──
let LEAVE_PREVIEW = null; // {rows, upload} while an uploaded file awaits confirmation
const LEAVE_COLS = function () { // [header, key, kind]

      ['Vacation Days Worked', 'vacWorked', 'worked'], ['Remarks', 'remarks', 'text']]);
};
function loadExcelJs_() {
  if (window.ExcelJS) return Promise.resolve();

    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';

function downloadLeaveTemplate_() {
  loadExcelJs_().then(function () {

    const ws = wb.addWorksheet('Leave', { views: [{ state: 'frozen', xSplit: 2, ySplit: 1 }] });
    ws.columns = cols.map(function (c) { return { header: c[0], key: c[1], width: c[2] === 'info' ? (c[1] === 'name' ? 24 : 14) : c[2] === 'text' ? 30 : 13 }; });
    const hdr = ws.getRow(1);

      const f = c[2] === 'count' && M.leaveFields.find(function (x) { return 'c:' + x[0] === c[1]; });
      if (f) hdr.getCell(i + 1).note = 'Number of instances this month. Each = ' + (Math.round(f[2] * 100) / 100) + ' leave day(s).';
    });
    const vacDays = {};
    const rows = openRows_();
    rows.forEach(function (r) {
      const l = r.leave || {};
      // No upload yet for this month -- carry the balance left over from their
      // last month with a Leave Record forward, instead of a blank cell.
      const carry = r.leaveCarryOpening || {};
      const v = { code: r.code, name: r.name, school: ENTITY_LABEL[r.entity], designation: r.designation, probation: r.probation ? 'Yes' : '',
        clBalance: r.leave ? l.clBalance : (r.leaveCarryOpening ? carry.cl : ''),
        compBalance: r.leave ? l.compBalance : (r.leaveCarryOpening ? carry.comp : ''),
        vacRule: r.leave ? l.vacRule : r.vacRule, vacWorked: l.vacWorked };
      M.leaveFields.forEach(function (f) { v['c:' + f[0]] = (l.counts || {})[f[0]]; });
      const row = ws.addRow(v);
      cols.forEach(function (c, i) {
        const cell = row.getCell(i + 1);
        if (c[2] === 'info') { cell.fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FFF2F2F2' } }; return; }
        cell.protection = { locked: false };
        if (c[2] === 'count') cell.dataValidation = { type: 'whole', operator: 'between', formulae: [0, 99], allowBlank: true, showErrorMessage: true, errorTitle: 'Leave count', error: 'Whole number of instances, 0–99.' };
        if (c[2] === 'balance') cell.dataValidation = { type: 'decimal', operator: 'between', formulae: [0, 400], allowBlank: true, showErrorMessage: true, error: 'Balance in days, 0 or more.' };
        if (c[2] === 'worked') cell.dataValidation = { type: 'whole', operator: 'between', formulae: [0, 31], allowBlank: true, showErrorMessage: true, error: 'Whole days worked during the vacation.' };
        if (c[2] === 'rule') cell.dataValidation = { type: 'list', allowBlank: true, formulae: ['"' + M.vacRules.join(',') + '"'], showErrorMessage: true, error: 'Pick from the list.' };
      });
      if (r.leave && r.leave.vacDays !== '' && r.leave.vacDays != null) vacDays[r.entity] = r.leave.vacDays;
    });
    ws.protect('', { selectLockedCells: true, selectUnlockedCells: true, formatColumns: true, autoFilter: true, sort: true });

    const vs = wb.addWorksheet('Vacation days');
    vs.columns = [{ header: 'School', key: 's', width: 12 }, { header: 'Vacation working days this month', key: 'd', width: 34 }];
    vs.getRow(1).font = { bold: true };
    entitiesInScope_().filter(function (e) { return !isLocked_(e); }).forEach(function (e) {
      const row = vs.addRow({ s: ENTITY_LABEL[e], d: vacDays[e] });
      row.getCell(2).protection = { locked: false };
      row.getCell(2).dataValidation = { type: 'whole', operator: 'between', formulae: [0, 31], allowBlank: true, showErrorMessage: true, error: 'Whole days, 0–31.' };
    });
    vs.protect('', { selectLockedCells: true, selectUnlockedCells: true });

    const hs = wb.addWorksheet('How to fill');
    hs.getColumn(1).width = 110;
    ['LEAVE TEMPLATE — ' + monthLabel_(M.month) + ' (' + (SCOPE === 'ALL' ? 'all schools' : ENTITY_LABEL[SCOPE]) + ')', '',
      'Leave sheet: one row per employee. Grey columns are fixed. Leave counts are NUMBER OF INSTANCES this month (whole numbers); leave blank for none.',
      'Leave days per instance (bye-laws, OO-09/26): ' + M.leaveFields.map(function (f) { return f[1] + ' ' + (Math.round(f[2] * 100) / 100); }).join(' · '),
      'The month’s total leave days are charged to Compensatory Leave first, then CL, then unpaid. Half-day CL counts as one full CL.',
      'Opening CL / Comp Balance: balance available at the start of the month. Blank = none, so all leave is charged as unpaid.',
      'Vacation Rule (from JobRole Norms, pick if blank): Full = vacation paid · Half = must work half the vacation working days (rounded down); shortfall becomes leave · Works = no vacation · Not tracked = no leave deductions (coordinators/heads).',
      'Vacation Days Worked: only for Half-rule roles and probationers (Probation = Yes). Probationers are not paid for vacation days they do not work.',
      'Vacation days sheet: number of vacation WORKING days in this month for each school (0 or blank if no vacation).',
      'Upload the file on the Payroll page (② Leave & paid days → Upload). You will see the conversion before anything is saved.']
      .forEach(function (t, i) { const c = hs.getCell(i + 1, 1); c.value = t; c.alignment = { wrapText: true }; if (!i) c.font = { bold: true, size: 13 }; });

    return wb.xlsx.writeBuffer().then(function (buf) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
      a.download = 'Leave ' + M.month + (SCOPE === 'ALL' ? '' : ' ' + ENTITY_LABEL[SCOPE]) + '.xlsx';
      a.click();
    });
  }).catch(function (err) { document.getElementById('msgRoot').innerHTML = '<div class="err">' + esc_(err.message) + '</div>'; });
}
function cellVal_(v) {

      ws.getRow(1).eachCell(function (c, i) { hdr[String(cellVal_(c.value))] = i; });
      if (!hdr['Employee Code']) throw new Error('The Leave sheet needs an "Employee Code" column.');
      const cols = LEAVE_COLS().filter(function (c) { return c[2] !== 'info' && c[2] !== 'text'; });
      const rows = [];
      ws.eachRow(function (row, n) {
        if (n === 1) return;
        const code = String(cellVal_(row.getCell(hdr['Employee Code']).value));
        if (!code) return;
        const o = { code: code, counts: {} };
        cols.forEach(function (c) {
          if (!hdr[c[0]]) return;
          const v = cellVal_(row.getCell(hdr[c[0]]).value);
          if (c[1].indexOf('c:') === 0) o.counts[c[1].slice(2)] = v; else o[c[1]] = v;
        });
        rows.push(o);
      });
      const vacDays = {};
      const vs = wb.getWorksheet('Vacation days');
      const byLabel = {};
      Object.keys(ENTITY_LABEL).forEach(function (e) { byLabel[ENTITY_LABEL[e]] = e; });
      if (vs) vs.eachRow(function (row, n) { if (n > 1 && byLabel[cellVal_(row.getCell(1).value)]) vacDays[byLabel[cellVal_(row.getCell(1).value)]] = cellVal_(row.getCell(2).value); });
      const upload = { month: M.month, rows: rows, vacDays: vacDays };
      document.getElementById('loadingPill').classList.add('on');
      return payPost_('previewleave', upload).then(function (res) {
        document.getElementById('loadingPill').classList.remove('on');
        if (!res.success) throw new Error(res.error);
        LEAVE_PREVIEW = { rows: res.preview, upload: upload, file: file.name };
        msg.innerHTML = '';
        render_();
      });
    });
  }).catch(function (err) { document.getElementById('loadingPill').classList.remove('on'); msg.innerHTML = '<div class="err">Upload failed: ' + esc_(err.message) + '</div>'; });
}

// ⑤ Review -- warnings, month-on-month changes, ERP comparison, full register.
function bigChanges_() {
  return scopeRows_().filter(function (r) { return r.prevNet && Math.abs(r.net - r.prevNet) / r.prevNet > 0.10; });
}
function reviewPanel_() {
  const w = M.warnings.filter(function (x) { return SCOPE === 'ALL' || !x.entity || x.entity === SCOPE; });
  let h = '<h2>⑤ Review <span class="grow"></span>' + tick_('review') + '</h2>';
  if (w.length) h += '<div class="warn"><b>' + w.length + ' warning(s) — fix before locking:</b><br>' + w.map(function (x) { return esc_(x.text); }).join('<br>') + '</div>';
  const big = bigChanges_();
  h += '<h2 style="font-size:12px">Net pay changed more than 10% vs last month (' + big.length + ')</h2>';
  h += big.length ? '<div class="wrap"><table><tr><th class="l">Employee</th><th class="l">School</th><th>Last month</th><th>This month</th><th>Change</th><th class="l">Why</th></tr>' + big.map(function (r) {
    const why = [];
    if (r.paidDays !== M.daysInMonth) why.push(r.paidDays + ' paid days');
    r.adjustments.forEach(function (a) { why.push(a.type + ' ₹' + inr_(a.amount)); });
    if (r.heldForFnF || r.withheld) why.push('held');
    if (r.released) why.push('released earlier hold');
    return '<tr><td class="l">' + esc_(r.code + ' — ' + r.name) + '</td><td class="l">' + ENTITY_LABEL[r.entity] + '</td><td>' + inr_(r.prevNet) + '</td><td>' + inr_(r.net) +
      '</td><td class="' + cls_(r.net - r.prevNet) + '">' + inr_(r.net - r.prevNet) + '</td><td class="l">' + esc_(why.join(', ') || '—') + '</td></tr>';
  }).join('') + '</table></div>' : '<div class="muted" style="margin-bottom:8px">' + (scopeRows_().some(function (r) { return r.prevNet != null; }) ? 'None.' : 'No previous month to compare with yet.') + '</div>';

  const hasErp = scopeRows_().some(function (r) { return r.erpNet != null; });
  // No ERP data (months after the parallel run) -> the review table is simply the full register.
  const erpRows = scopeRows_().filter(function (r) { return !hasErp || !ONLY_DIFF || netDiff_(r) || ctiDiff_(r); });
  h += '<h2 style="font-size:12px">Register — ' + (SCOPE === 'ALL' ? 'all schools' : ENTITY_LABEL[SCOPE]) + (hasErp ? ', with the ERP parallel run' : ' <span class="muted">— no ERP Reference rows for this month</span>') +
    ' <span class="grow"></span>' + (hasErp ? '<label class="muted"><input type="checkbox" id="erpDiff"' + (ONLY_DIFF ? ' checked' : '') + '> only rows that differ from ERP</label> ' : '') +
    '<button class="mini-btn" id="csvBtn">⬇ Export CSV</button></h2>';
  const cols = registerCols_();
  h += '<div class="wrap" style="max-height:60vh"><table><tr>' + cols.map(function (c) { return '<th' + (c[2] ? ' class="l"' : '') + '>' + c[0] + '</th>'; }).join('') + '</tr>';
  erpRows.forEach(function (r) {
    h += '<tr' + (netDiff_(r) || ctiDiff_(r) ? ' class="diff"' : '') + '>' + cols.map(function (c) {
      const v = c[1](r);
      if (c[2]) return '<td class="l">' + esc_(v) + '</td>';
      if (c[4]) return '<td class="' + cls_(v) + '">' + inr_(v) + '</td>';
      return '<td>' + (typeof v === 'number' || v == null ? inr_(v) : esc_(v)) + '</td>';
    }).join('') + '</tr>';
  });
  return h + '<tr class="total">' + cols.map(function (c, i) {
    return i === 0 ? '<td class="l">TOTAL</td>' : i === 1 ? '<td class="l">' + erpRows.length + ' shown</td>' : c[3] ? '<td>' + inr_(sum_(erpRows, c[1])) + '</td>' : '<td></td>';
  }).join('') + '</tr></table></div>';
}
// [header, value, left?, total?, signed-diff?]
function registerCols_() {
  return [
    ['Code', function (r) { return r.code; }, true], ['Name', function (r) { return r.name; }, true],
    ['School', function (r) { return ENTITY_LABEL[r.entity]; }, true], ['Designation', function (r) { return r.designation; }, true],
    ['Days', function (r) { return r.paidDays; }], ['Basic', function (r) { return r.basic; }, false, true], ['ADA', function (r) { return r.ada; }, false, true],
    ['DA', function (r) { return r.da; }, false, true], ['Gross', function (r) { return r.gross; }, false, true],
    ['EPF', function (r) { return r.epf; }, false, true], ['ESI', function (r) { return r.esi; }, false, true],
    ['RRF', function (r) { return r.rrf; }, false, true], ['TDS', function (r) { return r.tds || 0; }, false, true], ['Loan Rec', function (r) { return r.loanRecovery; }, false, true], ['Deductions', function (r) { return r.totalDeductions; }, false, true],
    ['Net Pay', function (r) { return r.net; }, false, true], ['Bank', function (r) { return r.bankPayable; }, false, true],
    ['CTI', function (r) { return r.cti; }, false, true], ['Gratuity Prov', function (r) { return r.gratuityProvision; }, false, true],
    ['ERP Net', function (r) { return r.erpNet; }, false, true], ['Net Diff', netDiff_, false, true, true],
    ['ERP CTI', function (r) { return r.erpCti; }, false, true], ['CTI Diff', ctiDiff_, false, true, true],
  ];
}

// ⑥ Lock -- per school; needs ② to ⑤ done and no warnings.
function lockPanel_() {
  const es = entitiesInScope_();
  let h = '<h2>⑥ Lock</h2><div class="note">Locking writes the Payroll Register, a Run Log row per school (with the rates used) and the Ledger (RRF deducted, salary held or released). A locked school’s month is read-only; corrections go into next month as Adjustments.</div>';
  h += '<div class="wrap"><table><tr><th class="l">School</th><th>Staff</th><th>Net pay</th><th>Bank transfer</th><th class="l">Steps</th><th class="l">Status</th></tr>';
  es.forEach(function (e) {
    const rs = M.rows.filter(function (r) { return r.entity === e; });
    const missing = M.steps.filter(function (s) { return !stepDone_(s, e); });
    const warn = M.warnings.filter(function (x) { return x.entity === e || !x.entity; }).length;
    const status = isLocked_(e) ? '🔒 ' + esc_(M.locked[e].at) + ' by ' + esc_(M.locked[e].by) + ' <button class="mini-btn" data-unlock="' + e + '">Unlock</button>'
      : missing.length || warn ? '<span class="muted">' + (missing.length ? 'to do: ' + missing.join(', ') : '') + (warn ? (missing.length ? ' · ' : '') + warn + ' warning(s)' : '') + '</span>'
      : '<button class="btn" data-lock="' + e + '">Lock ' + ENTITY_LABEL[e] + '</button>';
    h += '<tr><td class="l">' + ENTITY_LABEL[e] + '</td><td>' + rs.length + '</td><td>' + inr_(sum_(rs, function (r) { return r.net; })) + '</td><td>' +
      inr_(sum_(rs, function (r) { return r.bankPayable; })) + '</td><td class="l">' + (isLocked_(e) ? '—' : (M.steps.length - missing.length) + ' / ' + M.steps.length) + '</td><td class="l">' + status + '</td></tr>';
  });
  h += '</table></div>';
  // Lock-all only when every open school is ready -- the backend refuses ALL otherwise.
  const unlocked = es.filter(function (e) { return !isLocked_(e); });
  const ready = unlocked.filter(function (e) { return M.steps.every(function (s) { return stepDone_(s, e); }) && !M.warnings.some(function (x) { return x.entity === e || !x.entity; }); });
  if (SCOPE === 'ALL' && unlocked.length > 1 && ready.length === unlocked.length) h += '<button class="btn" data-lock="ALL">Lock all schools (' + ready.length + ')</button>';
  return h;
}

// ── Actions ──────────────────────────────────────────────────────────
function inputFor_(r, over) {
  const i = r.input || {};
  return Object.assign({ code: r.code, paidDays: i.paidDays, clDays: i.clDays, hold: i.hold || '', release: i.release }, over);
}
function wire_() {
  const q = function (s) { return document.querySelector(s); };
  document.querySelectorAll('.card').forEach(function (c) {
    c.onclick = function () { const s = STEPS.find(function (x) { return x.id === c.dataset.step; }); if (!s.soon) { OPEN = s.id; render_(); } };
  });
  document.querySelectorAll('[data-tick]').forEach(function (t) {
    t.onclick = function () { post_('markstep', { entity: SCOPE, step: t.dataset.tick, done: !scopeStepDone_(t.dataset.tick) }, 'Saving…'); };
  });
  document.querySelectorAll('[data-join]').forEach(function (b) {
    b.onclick = function () {
      const id = b.dataset.join, doj = q('[data-joindoj="' + id + '"]').value;
      if (!doj) { alert('Enter the joining date.'); return; }
      if (b.dataset.existingcode) {
        post_('joinoffer', { applicantId: id, code: b.dataset.existingcode, doj: doj }, 'Adding to payroll…', id + ' joined as ' + b.dataset.existingcode + '.');
        return;
      }
      const offer = M.staff.offers.find(function (o) { return o.id === id; });
      const reportsTo = resolveEmployeeLabel_(q('[data-reportsto="' + id + '"]').value);
      // applicantId lets the roster's addnewhire use the employee code the Hiring Dashboard locked
      // at Owner approval (and error rather than issue a different one) -- no locked code, same as before.
      const hireData = { applicantId: id, name: offer.name, dateOfJoining: doj, school: offer.entity,
        role: offer.designation + (offer.subjects ? ': ' + offer.subjects : ''),
        reportsTo: reportsTo ? reportsTo.employeeCode : '', classSubjects: collectCsRows_(b.dataset.joincid) };
      call_(rosterPost_('addnewhire', hireData).then(function (hireRes) {
        if (!hireRes.success) return hireRes; // same error shape -- call_ shows it as-is
        return payPost_('joinoffer', Object.assign({ month: M.month }, { applicantId: id, code: hireRes.employeeCode, doj: doj }));
      }), 'Adding to payroll…', id + ' added to payroll.');
    };
  });
  document.querySelectorAll('[data-dismiss]').forEach(function (b) {
    b.onclick = function () { if (confirm('Dismiss offer ' + b.dataset.dismiss + '? It will no longer show here.')) post_('dismissoffer', { applicantId: b.dataset.dismiss }, 'Saving…'); };
  });
  document.querySelectorAll('[data-addemp]').forEach(function (b) {
    b.onclick = function () {
      const code = b.dataset.addemp, x = M.staff.notOnPayroll.find(function (n) { return n.code === code; });
      const nb = q('[data-nb="' + code + '"]').value;
      if (!(Number(nb) > 0)) { alert('Enter the full monthly basic for ' + x.name + '.'); return; }
      post_('addemployee', { code: code, name: x.name, entity: x.entity, designation: x.designation, doj: x.doj, fullBasic: nb,
        epf: q('[data-nepf="' + code + '"]').checked, rrf: q('[data-nrrf="' + code + '"]').checked, tuition: q('[data-ntf="' + code + '"]').value }, 'Adding to payroll…', x.name + ' added to payroll.');
    };
  });
  document.querySelectorAll('[data-transfer]').forEach(function (b) {
    b.onclick = function () {
      const x = M.staff.transfers.find(function (t) { return t.oldCode === b.dataset.transfer; });
      if (confirm('Transfer ' + x.name + ' to ' + ENTITY_LABEL[x.to] + ' (' + x.newCode + ') for all of ' + monthLabel_(M.month) + '?\nRRF and held-salary balances move to the new code.'))
        post_('applytransfer', { oldCode: x.oldCode, newCode: x.newCode, entity: x.to }, 'Applying transfer…', x.name + ' transferred.');
    };
  });
  if (q('#xfStart')) q('#xfStart').onclick = function () {
    const r = pick_('xfEmp');
    if (!r) { alert('Pick an employee from the list.'); return; }
    const newSchool = q('#xfNewSchool').value;
    const reportsTo = resolveEmployeeLabel_(q('#xfReportsTo').value);
    const data = { oldEmployeeCode: r.code, newSchool: newSchool, role: q('#xfRole').value.trim(),
      reportsTo: reportsTo ? reportsTo.employeeCode : '', classSubjects: collectCsRows_('xf') };
    call_(rosterPost_('transfer', data).then(function (res) {
      if (!res.success) return res;
      return payGet_('month', { month: M.month }); // re-fetch so the new row shows up to Apply below
    }), 'Starting transfer…', r.name + ' moved to ' + ENTITY_LABEL[newSchool] + ' — click Apply below to redirect this month’s pay.');
  };
  document.querySelectorAll('[data-left]').forEach(function (b) {
    b.onclick = function () {
      const code = b.dataset.left, d = q('[data-lwd="' + code + '"]').value;
      if (!d) { alert('Enter the last working day.'); return; }
      post_('markleft', { code: code, lastDay: d }, 'Saving…', code + ' marked left from ' + d + '.');
    };
  });
  document.querySelectorAll('[data-skip]').forEach(function (b) {
    b.onclick = function () {
      const r = M.rows.find(function (x) { return x.code === b.dataset.skip; });
      const reason = q('[data-skipreason="' + b.dataset.skip + '"]').value.trim();
      if (!r.skipLoan && !reason) { alert('Enter the reason (the employee’s application) to skip this month’s recovery.'); return; }
      post_('saveinputs', { rows: [{ code: r.code, skipLoan: !r.skipLoan, skipReason: reason }] }, 'Saving…', r.skipLoan ? 'Recovery resumed for ' + r.name + '.' : 'Recovery skipped this month for ' + r.name + '.');
    };
  });
  if (q('#lvTemplate')) q('#lvTemplate').onclick = downloadLeaveTemplate_;
  if (q('#lvUpload')) q('#lvUpload').onclick = function () { q('#lvFile').click(); };
  if (q('#lvFile')) q('#lvFile').onchange = function (e) { if (e.target.files[0]) uploadLeave_(e.target.files[0]); e.target.value = ''; };
  if (q('#lvCancel')) q('#lvCancel').onclick = function () { LEAVE_PREVIEW = null; render_(); };
  if (q('#lvConfirm')) q('#lvConfirm').onclick = function () {
    const up = LEAVE_PREVIEW.upload, n = LEAVE_PREVIEW.rows.length;

function exportCsv_() {

// Times > 1 (Owner-only -- the whole Payroll tool already is) compounds that many
// separate annual increments in one go, e.g. for someone who missed prior years.
// Net Pay/CTI columns are the real payCalc_ re-run with the new Basic, not a % guess.
// % change shown next to Net Pay/CTI can differ from the Basic's own % (RRF tier
// boundaries, ESI/EPF ceilings etc. can shift non-linearly) -- that's real, not a bug.
function incPct_(a, b) {
  if (a == null || b == null || !a) return '';
  const p = (b - a) / a * 100;
  return ' <span class="muted">(' + (p >= 0 ? '+' : '') + p.toFixed(1) + '%)</span>';
}
function incrementView_() {
  const timesPicker = '<p>Increments to apply: <input type="number" id="incTimes" min="1" max="12" value="' + INC_TIMES + '" style="width:48px"> <span class="muted">(more than 1 compounds that many years at once -- Owner only)</span></p>';
  if (!INC.eligible.length) return timesPicker + '<p>Nobody is eligible for an increment in ' + monthLabel_(M.month) + ' (36+ months tenure, not already given one this month).</p>';

function codeFromTally_(name) {
  const m = String(name).match(/([A-Z]{3})[-\/ ]*(\d{2})\/(\d{1,2})\/(\d+)/);
  return m ? m[1] + '/' + m[2] + '/' + m[3].padStart(2, '0') + '/' + m[4] : 'FORMER: ' + String(name).trim();
}
function parseOpening_(wb, accept) {
  const sheet = function (n) {
    const ws = wb.getWorksheet(n); if (!ws) throw new Error('Workbook has no "' + n + '" sheet');
    const hdr = ws.getRow(1).values.map(function (v) { return String(cellVal_(v)).trim(); });
    const out = [];
    ws.eachRow(function (row, i) { if (i === 1) return; const o = {}; hdr.forEach(function (h, j) { if (h) o[h] = cellVal_(row.getCell(j).value); }); out.push(o); });
    return out;
  };
  const problems = [], balances = [], loans = [];
  sheet('Mapping').forEach(function (r) {
    if (!r['Tally Ledger Name'] || !(Number(r['Balance 31-Aug (Rs)']) > 0)) return;
    const conf = String(r['Confirmed Code'] || '').trim().toUpperCase(), status = String(r['Status'] || '');
    let code = '', former = false;
    if (conf === 'NONE' || (!conf && /^not on/i.test(status))) { former = true; code = codeFromTally_(r['Tally Ledger Name']); }
    else if (conf) code = conf;
    else if (/^(exact|code differs|likely)/i.test(status) || (accept && /^check/i.test(status))) code = String(r['Suggested Code'] || '').trim();
    else problems.push('Mapping: "' + r['Tally Ledger Name'] + '" (' + status + ') — fill Confirmed Code' + (r['Suggested Code'] ? ' (suggested ' + r['Suggested Code'] + ')' : ''));
    if (code) balances.push({ code: code, account: String(r['Account']), amount: Number(r['Balance 31-Aug (Rs)']), source: String(r['Tally Branch'] + ': ' + r['Tally Ledger Name']), former: former });
  });
  sheet('Advances').forEach(function (r) {
    if (!r['Tally Ledger'] || r['Tally Ledger'] === 'TOTAL' || !(Number(r['Balance (Rs)']) > 0)) return;
    const conf = String(r['Confirmed Code'] || '').trim().toUpperCase();
    const code = conf === 'NONE' ? codeFromTally_(r['Tally Ledger']) : conf || String(r['Suggested Code'] || '').trim();
    if (!code) { problems.push('Advances: "' + r['Tally Ledger'] + '" — fill Confirmed Code (or NONE if not on payroll)'); return; }
    const former = conf === 'NONE';
    if (!former && !(Number(r['Monthly Recovery (Rs)']) > 0)) problems.push('Advances: "' + r['Tally Ledger'] + '" — fill Monthly Recovery');
    loans.push({ code: code, amount: Number(r['Balance (Rs)']), monthly: Number(r['Monthly Recovery (Rs)']) || 0, source: String(r['Tally Branch'] + ': ' + r['Tally Ledger']), history: String(r['Recovery history'] || ''), former: former });
  });
  return { balances: balances, loans: loans, problems: problems };
}

// Indian-system amount in words: 793246 -> "Seven Lakh Ninety Three Thousand Two Hundred Forty Six Rupees only".
function inWords_(n) {
  n = Math.round(n);
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const t = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  const two = function (x) { return x < 20 ? a[x] : t[Math.floor(x / 10)] + (x % 10 ? ' ' + a[x % 10] : ''); };
  const three = function (x) { return (x >= 100 ? a[Math.floor(x / 100)] + ' Hundred' + (x % 100 ? ' ' : '') : '') + (x % 100 ? two(x % 100) : ''); };
  if (!n) return 'Zero Rupees only';
  const parts = [], cr = Math.floor(n / 1e7), lk = Math.floor(n / 1e5) % 100, th = Math.floor(n / 1e3) % 100, rest = n % 1000;
  if (cr) parts.push(two(cr) + ' Crore'); if (lk) parts.push(two(lk) + ' Lakh'); if (th) parts.push(two(th) + ' Thousand'); if (rest) parts.push(three(rest));
  return parts.join(' ') + ' Rupees only';
}
function fyOf_(ym) { const y = Number(ym.slice(0, 4)), mo = Number(ym.slice(5, 7)); const s = mo >= 4 ? y : y - 1; return { start: s, label: s + '-' + String(s + 1).slice(2) }; }

  const L = readLetter_(), e = SCOPE, rs = outRows_(e).filter(function (r) { return r.bankPayable > 0 && key_(r).account; });
  const total = sum_(rs, function (r) { return r.bankPayable; });
  const d = L.date ? L.date.split('-').reverse().join('/') : '';
  openPrint_('Bank letter ' + ENTITY_LABEL[e], LETTERHEAD + '<p><b>Ref No.:</b> ' + esc_(L.ref) + '</p><p>' + esc_(L.addressee).replace(/\n/g, '<br>') + '</p><p><b>Dated :</b> ' + d + '</p>' +
    '<p><b>Reg :</b> Salary for ' + monthLabel_(M.month) + '</p><p>Sir</p><p>We will be thankful to you if you kindly debit the account of ' + esc_(L.debitAccount) + ' and credit in the accounts of the following staff members working in ' +
    esc_(L.debitAccount) + '.<br>Cheque No. : ' + esc_(L.cheque) + ' for Rs.' + total + ' dated ' + d + ' is attached for debit purpose.</p>' +
    '<table><tr><th>Sr. No</th><th>Name</th><th class="n">Net Payable</th><th>Account Number</th><th>IFSC CODE</th></tr>' + rs.map(function (r, i) {
      return '<tr><td>' + (i + 1) + '</td><td>' + esc_(r.name) + '</td><td class="n">' + r.bankPayable + '</td><td>' + esc_(key_(r).account) + '</td><td>' + esc_(key_(r).ifsc) + '</td></tr>';
    }).join('') + '<tr><td></td><td>Total</td><td class="n">' + total + '</td><td></td><td></td></tr></table><p><b>' + inWords_(total) + '</b></p><p><b>Thanking You</b></p><p><b>Yours Sincerely</b></p>');
}

// Salary sheet columns, in the ERP SALARY.xlsx order.
function sheetCols_() {
  return [['S.No', null], ['Emp.Code', function (r) { return r.code; }], ['Name', function (r) { return r.name; }], ['Designation', function (r) { return r.designation; }],
    ['Present', function (r) { return r.paidDays; }], ['Month Basic', function (r) { return r.basic; }], ['Additional Duty Allowance', function (r) { return r.ada; }], ['DA', function (r) { return r.da; }],
    ['LENC', function (r) { return r.clEncashment; }], ['INCENTIVE', function (r) { return adjSum_(r, ['Admission Incentive', 'Performance Bonus']); }], ['TRAV. AL.', function (r) { return adjSum_(r, ['Travel Allowance']); }],
    ['OTHER EARN.', function (r) { return adjSum_(r, ['Arrears', 'Notice Pay', 'Other Earning']); }], ['TF(A)', function (r) { return r.tuitionA; }], ['Gr Sal', function (r) { return r.gross; }],
    ['CTI', function (r) { return r.cti; }], ['EPF', function (r) { return r.epf; }], ['ESI', function (r) { return r.esi; }], ['TDS', function (r) { return r.tds || 0; }], ['RRF', function (r) { return r.rrf; }],
    ['ADV. RECOVERY', function (r) { return r.loanRecovery || 0; }], ['OTHER RECOVERY', function (r) { return r.otherDeductions; }], ['TF(D)', function (r) { return r.tuitionD; }],
    ['Total Ded', function (r) { return r.totalDeductions; }], ['Net Pay', function (r) { return r.net; }], ['Held', function (r) { return (r.heldForFnF || 0) + (r.withheld || 0); }],
    ['Bank Transfer', function (r) { return r.bankPayable; }], ['Pay Mode', function (r) { return key_(r).account ? 'Transfer' : 'Cash/Cheque'; }],
    ['Account No', function (r) { return key_(r).account || ''; }], ['IFSC Code', function (r) { return key_(r).ifsc || ''; }], ['UAN No', function (r) { return key_(r).uan || ''; }], ['Sign', function () { return ''; }]];
}
function sheetPrint_() {
  const rs = outRows_(SCOPE), cols = sheetCols_();
  const num = function (c) { return ['S.No', 'Emp.Code', 'Name', 'Designation', 'Pay Mode', 'Account No', 'IFSC Code', 'UAN No', 'Sign'].indexOf(c[0]) === -1; };
  openPrint_('Salary sheet ' + ENTITY_LABEL[SCOPE], '<div style="font-size:9px">' + LETTERHEAD + '<h3 style="text-align:center">' + esc_(SCHOOL_NAME[SCOPE]) + ' — Salary Sheet for ' + monthLabel_(M.month) + '</h3>' +
    '<table style="font-size:8.5px"><tr>' + cols.map(function (c) { return '<th>' + c[0] + '</th>'; }).join('') + '</tr>' + rs.map(function (r, i) {
      return '<tr>' + cols.map(function (c) { const v = c[1] ? c[1](r) : i + 1; return '<td' + (num(c) ? ' class="n"' : '') + (c[0] === 'Sign' ? ' style="width:60px"' : '') + '>' + esc_(v) + '</td>'; }).join('') + '</tr>';
    }).join('') + '<tr>' + cols.map(function (c, i) { return i === 1 ? '<td><b>Total</b></td>' : '<td class="n"><b>' + (num(c) && c[0] !== 'Present' && c[1] ? sum_(rs, c[1]) : '') + '</b></td>'; }).join('') + '</tr></table>' +
    '<p style="margin-top:40px">Prepared by: ____________________ &nbsp;&nbsp; Checked by: ____________________ &nbsp;&nbsp; Approved by: ____________________</p></div>', true);
}
function sheetXlsx_() {
  loadExcelJs_().then(function () {
    const rs = outRows_(SCOPE), cols = sheetCols_(), wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('SalaryReport');
    ws.addRow([SCHOOL_NAME[SCOPE] + ' — ' + monthLabel_(M.month)]).font = { bold: true };
    ws.addRow(cols.map(function (c) { return c[0]; })).font = { bold: true };
    rs.forEach(function (r, i) { ws.addRow(cols.map(function (c) { return c[1] ? c[1](r) : i + 1; })); });
    ws.getColumn(28).numFmt = '@';
    return wb.xlsx.writeBuffer().then(function (buf) { download_('Salary ' + ENTITY_LABEL[SCOPE] + ' ' + M.month + '.xlsx', new Blob([buf])); });
  });
}
function download_(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); }

function slipsPrint_() {
  const rs = outRows_(SCOPE), s = OUT.settings;
  const line = function (k, v) { return '<tr><td>' + k + '</td><td>:</td><td style="text-align:right">' + (Number(v) || 0).toFixed(2) + '</td></tr>'; };
  openPrint_('Pay slips ' + ENTITY_LABEL[SCOPE], rs.map(function (r) {
    const k = key_(r), l = r.leave || { counts: {} }, c = l.counts || {};
    const eps = Math.round(Math.min(r.basic + r.ada + r.da, s.epfCeiling) * s.epsRate), epsEr = r.epfEmployer ? Math.min(eps, r.epfEmployer) : 0;
    const open = l.clBalance === '' || l.clBalance == null ? '' : Number(l.clBalance);
    const earnings = line('Basic', r.basic) + line('DA', r.da) + line('Additional Duty Allowance', r.ada) + line('Employer Share of EPF', epsEr) + line('Employer Share of PF', r.epfEmployer - epsEr) +
      line('Employer Share of ESI', r.esiEmployer) + line('LENC', r.clEncashment) + (r.adjustments || []).filter(function (a) { return a.direction === 'Earning'; }).map(function (a) { return line(esc_(a.type), a.amount); }).join('') +
      (r.tuitionA ? line('TF(A)', r.tuitionA) : '');
    const deductions = line('EPF (Employee)', r.epf) + line('ESI (Employee)', r.esi) + (r.tds ? line('TDS', r.tds) : '') + line('RRF', r.rrf) + (r.loanRecovery ? line('Advance Recovery', r.loanRecovery) : '') +
      (r.adjustments || []).filter(function (a) { return a.direction === 'Deduction' && a.type !== 'TDS'; }).map(function (a) { return line(esc_(a.type), a.amount); }).join('') + (r.tuitionD ? line('TF(D)', r.tuitionD) : '');
    return '<div class="slip"><div style="text-align:center;font-weight:bold">' + esc_(SLIP_TITLE[r.entity]) + '<br>Pay Slip For The Month Of ' + monthLabel_(M.month) + '</div>' +
      '<table style="width:100%"><tr><td>Emp Code</td><td>: ' + esc_(r.code) + '</td><td>Days Present</td><td>: ' + Number(r.paidDays).toFixed(2) + '</td></tr><tr><td>Name</td><td>: ' + esc_(r.name) +
      '</td><td>Account No.</td><td>: ' + esc_(k.account || 'Cash/Cheque') + '</td></tr><tr><td>Designation</td><td>: ' + esc_(r.designation) + '</td><td>IFSC CODE</td><td>: ' + esc_(k.ifsc || '') +
      '</td></tr><tr><td>ESI No.</td><td>: ' + esc_(k.esi || 'N/A') + '</td><td>UAN No.</td><td>: ' + esc_(k.uan || 'N/A') + '</td></tr></table>' +
      '<div>Leave Details</div><table class="lv" style="width:100%"><tr><th>Opening CL</th><th>CL</th><th>Late</th><th>Short</th><th>Half</th><th>Leave</th><th>Absent</th><th>Special Day</th><th>Comp. Leave</th><th>Unpaid days</th><th>Closing CL</th></tr><tr>' +
      [open, c.casual, c.late, c.short, c.half, c.single, c.absent, (c.sd7 || 0) + (c.sdLt7 || 0) + (c.sdNone || 0) || '', c.comp, l.unpaidLeave || l.vacUnpaid ? (l.unpaidLeave || 0) + (l.vacUnpaid || 0) : '',
        open === '' ? '' : Math.max(0, open - (l.clUsed || 0))].map(function (v) { return '<td>' + (v === undefined || v === '' ? '' : v) + '</td>'; }).join('') + '</tr></table>' +
      '<table style="width:100%"><tr><td style="vertical-align:top;width:50%"><b>Earnings</b><table style="width:100%">' + earnings + '</table></td><td style="vertical-align:top"><b>Deductions</b><table style="width:100%">' + deductions + '</table></td></tr></table>' +
      '<table style="width:100%;border-top:1px solid #999"><tr><td><b>Total CTI :</b> ' + r.cti.toFixed(2) + '</td><td><b>Total Deduction :</b> ' + r.totalDeductions.toFixed(2) + '</td><td><b>Net Bank Transfer :</b> ' + r.bankPayable.toFixed(2) +
      ((r.heldForFnF || r.withheld) ? ' (held: ' + ((r.heldForFnF || 0) + (r.withheld || 0)).toFixed(2) + ')' : '') + '</td></tr></table></div>';
  }).join(''));
}

// EPF ECR 2.0 text: UAN#~#Name#~#Gross#~#EPF wages#~#EPS wages#~#EDLI wages#~#EE#~#EPS#~#ER (EPF-EPS)#~#NCP days#~#Refund
function ecr_() {
  const s = OUT.settings, rows = OUT.rows.filter(function (r) { return r.epf > 0; }), missing = [];
  const lines = rows.map(function (r) {
    const uan = key_(r).uan;
    if (!uan) { missing.push(r.code + ' ' + r.name); return null; }
    const wages = Math.min(r.basic + r.ada + r.da, s.epfCeiling), eps = Math.round(wages * s.epsRate);
    return [uan, r.name.toUpperCase().replace(/[^A-Z ]/g, ' ').replace(/\s+/g, ' ').trim(), r.gross - r.tuitionA, wages, wages, wages, r.epf, eps, r.epf - eps,
      Math.max(0, Math.round(M.daysInMonth - r.paidDays)), 0].join('#~#');
  }).filter(Boolean);
  const tot = function (i) { return lines.reduce(function (t, l) { return t + Number(l.split('#~#')[i]); }, 0); };
  download_('ECR ' + M.month + '.txt', new Blob([lines.join('\n')], { type: 'text/plain' }));
  const w = tot(3);
  document.getElementById('msgRoot').innerHTML = '<div class="ok">ECR for ' + lines.length + ' members: EE ₹' + inr_(tot(6)) + ' · EPS ₹' + inr_(tot(7)) + ' · ER ₹' + inr_(tot(8)) +
    ' · estimated admin (0.5%) ₹' + inr_(Math.round(w * 0.005)) + ' · EDLI (0.5%) ₹' + inr_(Math.round(w * 0.005)) + ' (not in CTI — CA question).</div>' +
    (missing.length ? '<div class="warn">No UAN in EmpKeyNumbers, left out of the file: ' + missing.map(esc_).join(', ') + '</div>' : '');
}
// ESIC monthly contribution upload (MC template).
function esiFile_() {
  loadExcelJs_().then(function () {
    const rows = OUT.rows.filter(function (r) { return r.esi > 0; }), missing = [];
    const wb = new ExcelJS.Workbook(), ws = wb.addWorksheet('Sheet1');
    ws.addRow(['IP Number (10 Digits)', 'IP Name( Only alphabets and space )', 'No of Days for which wages paid/payable during the month', 'Total Monthly Wages',
      'Reason Code for Zero workings days(numeric only; provide 0 for all other reasons- Click on the link for reference)', 'Last Working Day( Format DD/MM/YYYY  or DD-MM-YYYY)']).font = { bold: true };
    rows.forEach(function (r) {
      const ip = String(key_(r).esi || '').replace(/\D/g, '');
      if (ip.length !== 10) { missing.push(r.code + ' ' + r.name); return; }
      ws.addRow([ip, r.name.replace(/[^A-Za-z ]/g, ' ').replace(/\s+/g, ' ').trim(), Math.round(r.paidDays), r.basic + r.ada + r.da, 0, '']);
    });
    ws.getColumn(1).numFmt = '@';
    return wb.xlsx.writeBuffer().then(function (buf) {
      download_('ESI ' + M.month + '.xlsx', new Blob([buf]));
      document.getElementById('msgRoot').innerHTML = '<div class="ok">ESI file for ' + (rows.length - missing.length) + ' employees: employee ₹' + inr_(sum_(rows, function (r) { return r.esi; })) +
        ' · employer ₹' + inr_(sum_(rows, function (r) { return r.esiEmployer; })) + '.</div>' + (missing.length ? '<div class="warn">No 10-digit ESI number in EmpKeyNumbers, left out: ' + missing.map(esc_).join(', ') + '</div>' : '');
    });
  });
}

// Tally journal export (2026-10-01). One self-contained ENVELOPE per company -- the only real,
// working example Uday sent (LMS1/Kullu, Aug 2026) was a single company per file, so that's the
// only structure actually verified; generating all companies into one file is unverified and not
// attempted. Backend already refuses (with specifics) if anything would leave the voucher
// unbalanced -- see payTallyVoucher_ in apps-script/payroll.gs.
function xmlEsc_(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function tallyVoucherXml_(month, narration, v) {
  const date = month.replace('-', '') + '01'; // the real voucher used the month's own 1st, not the lock date
  const num = 'Salary ' + narration.split(' ').pop(); // narration ends "... MON-YYYY"
  const line = function (l) { return '<ALLLEDGERENTRIES.LIST><LEDGERNAME>' + xmlEsc_(l.ledger) + '</LEDGERNAME><ISDEEMEDPOSITIVE>' + (l.dr ? 'Yes' : 'No') +
    '</ISDEEMEDPOSITIVE><AMOUNT>' + (l.dr ? '-' : '') + l.amount.toFixed(2) + '</AMOUNT></ALLLEDGERENTRIES.LIST>'; };
  const lines = v.dr.map(function (x) { return line({ ledger: x.ledger, amount: x.amount, dr: true }); }).join('') +
    v.cr.map(function (x) { return line({ ledger: x.ledger, amount: x.amount, dr: false }); }).join('');
  return '<ENVELOPE><HEADER><TALLYREQUEST>Import Data</TALLYREQUEST></HEADER><BODY><IMPORTDATA><REQUESTDESC><REPORTNAME>Vouchers</REPORTNAME>' +
    '<STATICVARIABLES><SVCURRENTCOMPANY>' + xmlEsc_(v.svCurrentCompany) + '</SVCURRENTCOMPANY></STATICVARIABLES></REQUESTDESC><REQUESTDATA>' +
    '<TALLYMESSAGE xmlns:UDF="TallyUDF"><VOUCHER VCHTYPE="Journal" ACTION="Create" OBJVIEW="Accounting Voucher View">' +
    '<DATE>' + date + '</DATE><NARRATION>' + xmlEsc_(narration) + '</NARRATION><VOUCHERTYPENAME>Journal</VOUCHERTYPENAME><VOUCHERNUMBER>' + xmlEsc_(num) + '</VOUCHERNUMBER>' +
    lines + '</VOUCHER></TALLYMESSAGE></REQUESTDATA></IMPORTDATA></BODY></ENVELOPE>';
}
function tally_() {
  const msg = document.getElementById('msgRoot');
  document.getElementById('loadingText').textContent = 'Building Tally export…'; document.getElementById('loadingPill').classList.add('on');
  payGet_('tallyexport', { month: M.month }).then(function (res) {
    document.getElementById('loadingPill').classList.remove('on');
    if (!res.success) { msg.innerHTML = '<div class="err">' + esc_(res.error) + '</div>'; return; }
    res.vouchers.forEach(function (v) {
      const xml = '<?xml version="1.0" encoding="UTF-8"?>\n' + tallyVoucherXml_(res.month, res.narration, v);
      download_('Tally ' + v.company.replace(/[^\w -]/g, '') + ' ' + M.month + '.xml', new Blob([xml], { type: 'application/xml' }));
    });
    msg.innerHTML = '<div class="ok">' + res.vouchers.length + ' Tally journal file(s) downloaded, one per company: ' +
      res.vouchers.map(function (v) { return esc_(v.company) + ' (₹' + inr_(v.total) + ')'; }).join(', ') +
      '. <b>Not yet verified against a real Tally import except LMS1/Kullu’s ledger map</b> -- check one import before relying on this for all 6.</div>';
  }).catch(function (err) { document.getElementById('loadingPill').classList.remove('on'); msg.innerHTML = '<div class="err">' + esc_(err.message) + '</div>'; });
}

function wireOutputs_() {
  const q = function (s) { return document.querySelector(s); };
  if (q('#ecrBtn')) q('#ecrBtn').onclick = ecr_;
  if (q('#esiBtn')) q('#esiBtn').onclick = esiFile_;
  if (q('#tallyBtn')) q('#tallyBtn').onclick = tally_;
  if (q('#ltPrint')) q('#ltPrint').onclick = letterPrint_;
  if (q('#shPrint')) q('#shPrint').onclick = sheetPrint_;
  if (q('#shXlsx')) q('#shXlsx').onclick = sheetXlsx_;
  if (q('#psPrint')) q('#psPrint').onclick = slipsPrint_;
  if (q('#ltRecord')) q('#ltRecord').onclick = function () {
    const L = readLetter_(), rs = outRows_(SCOPE).filter(function (r) { return r.bankPayable > 0 && key_(r).account; });
    if (!L.serial || !L.cheque) { alert('Enter the reference serial and cheque number first.'); return; }
    if (!confirm('Record ' + L.ref + ' for ' + ENTITY_LABEL[SCOPE] + ' — cheque ' + L.cheque + ', ₹' + inr_(sum_(rs, function (r) { return r.bankPayable; })) + '?')) return;
    const msg = document.getElementById('msgRoot');
    payPost_('issueletter', { month: M.month, entity: SCOPE, serial: L.serial, ref: L.ref, date: L.date, cheque: L.cheque, amount: sum_(rs, function (r) { return r.bankPayable; }), staff: rs.length,
      addressee: L.addressee, debitAccount: L.debitAccount }).then(function (res) {
      if (!res.success) { msg.innerHTML = '<div class="err">' + esc_(res.error) + '</div>'; return; }
      M = res; LETTER = null; msg.innerHTML = '<div class="ok">Recorded ' + esc_(L.ref) + '.</div>'; loadOutputs_();
    });
  };
}

function load_() {
  LEAVE_PREVIEW = null;
  call_(payGet_('month', { month: document.getElementById('fMonth').value }), 'Opening month…').then(function (ok) { if (ok && VIEW === 'outputs') loadOutputs_(); else if (ok && VIEW !== 'month') loadAccounts_(); });
}

function showApp(session) {
  SESSION = session;
  document.getElementById('authRoot').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  document.getElementById('welcomeStrip').innerHTML = '<span>Signed in as <b>' + esc_(session.name) + '</b></span><a href="#" class="signout" id="signoutLink">Sign out</a>';
  document.getElementById('signoutLink').onclick = function (e) { e.preventDefault(); LMCS.signOut(); };
  if (!LMCS.hasRole(session, 'Owner')) {
    document.getElementById('deniedRoot').innerHTML = '<div class="denied"><div class="icon">🔒</div><h3>Owner only</h3><p>Payroll is restricted to the Owner.</p></div>';
    return;
  }
  document.getElementById('mainRoot').style.display = '';
  const now = new Date();
  document.getElementById('fMonth').value = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
  document.getElementById('loadBtn').onclick = load_;
  document.getElementById('fMonth').onchange = load_;
  load_();
  loadAllEmployees_(); // for the "Reports to" picker on Joined/transfer
}

const cachedSession = LMCS.getSession();
if (cachedSession) showApp(cachedSession);
else LMCS.requireSession('#authRoot').then(showApp);
</script>
