<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LMCS — Plan an activity</title>
<meta name="theme-color" content="#CE0000">
<link rel="stylesheet" href="../assets/style.css?v=0049023a">
<style>
  body { background: var(--lgray); min-height: 100vh; }
  .bar { background: var(--red); color: var(--white); padding: 14px 16px; font-weight: 700; }
  main { max-width: 480px; margin: 0 auto; padding: 16px; }
  .plan { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 16px; }
  .plan .where { margin: 0 0 2px; font-size: 13px; color: var(--gray); }
  .plan h1 { margin: 0 0 8px; font-size: 20px; line-height: 1.3; overflow-wrap: anywhere; }
  .plan .lead { margin: 0 0 14px; font-size: 14px; color: var(--gray); }
  .plan label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 700; }
  .plan input[type=text] { width: 100%; font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--white); color: var(--dark); }
  .plan .count { margin: 4px 0 14px; font-size: 12px; color: var(--gray); text-align: right; }
  .plan button { font: inherit; font-weight: 700; padding: 11px 22px; border: 0; border-radius: var(--radius); background: var(--red); color: var(--white); cursor: pointer; min-height: 44px; }
  .plan button:hover { background: var(--red-dark); }
  .plan button[disabled] { opacity: .6; cursor: default; }
  .plan input:focus-visible, .plan button:focus-visible, .back:focus-visible { outline: 3px solid var(--dark); outline-offset: 2px; }
  .msg { margin: 14px 0 0; font-size: 14px; }
  .msg.err { background: var(--red-pale); border: 1px solid var(--red); color: var(--red-dark); border-radius: var(--radius); padding: 10px 12px; }
  .msg.ok { color: var(--color-live); font-weight: 700; }
  .back { display: inline-block; margin-top: 16px; padding: 8px 0; color: var(--red-dark); font-size: 14px; }
  #lmcs-gate { position: fixed; inset: 0; z-index: 99999; background: #fff; display: flex; align-items: center; justify-content: center; }
  #lmcs-gate .auth-gate { max-width: 380px; margin: 0 auto; padding: 32px 28px; border: 1px solid #ddd; border-top: 3px solid #CE0000; border-radius: 6px; text-align: center; }
  #lmcs-gate .auth-gate p { color: #555; font-size: 13px; line-height: 1.6; margin: 0 0 20px; }
  #lmcs-gate #lmcs-g-signin { display: flex; justify-content: center; }
  #lmcs-gate .auth-denied { margin-top: 16px; background: #fde8e8; border: 1px solid #CE0000; color: #a70000; border-radius: 8px; padding: 12px 14px; font-size: 12px; line-height: 1.6; text-align: left; }
</style>
</head>
<body>
<div id="lmcs-gate"><div id="lmcs-gate-slot"></div></div>
<script src="../assets/auth.js?v=76dc60a6"></script>

<div class="bar">Plan an activity</div>
<main>
  <form class="plan" id="planForm" novalidate>
    <p class="where" id="where"></p>
    <h1 id="chapter"></h1>
    <p class="lead" id="lead">One line is plenty: what will the children do? I'll look for it in your classwork once you've taught it.</p>
    <label for="activity">The activity, in a few words</label>
    <input type="text" id="activity" name="activity" maxlength="200" autocomplete="off" placeholder="For example: sort picture cards in groups" aria-describedby="count">
    <p class="count" id="count">0 of 200</p>
    <button type="submit" id="save">Save</button>
    <p class="msg" id="msg" role="status" aria-live="polite" hidden></p>
  </form>
  <a class="back" href="index.html">Back to my page</a>
</main>

<script>
const GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // set at deploy (same value as teacher/index.html); empty = saving is not open yet
(function () {
  var q = new URLSearchParams(location.search);
  var cls = (q.get('cls') || '').trim(), subj = (q.get('subj') || '').trim(), ch = (q.get('ch') || '').trim(), name = (q.get('name') || '').trim(); // ch is the key a save is filed under; name is what the heading shows and the sheet's Chapter column keeps
  var form = document.getElementById('planForm'), input = document.getElementById('activity'), save = document.getElementById('save'), msg = document.getElementById('msg'), count = document.getElementById('count');
  var session = null;

  function say(text, kind) { msg.textContent = text; msg.className = 'msg ' + kind; msg.hidden = !text; }

  document.getElementById('where').textContent = cls && subj ? cls + ' · ' + subj : '';
  document.getElementById('chapter').textContent = name || ch || 'Which chapter?';
  if (!cls || !subj || !ch) {
    document.getElementById('lead').textContent = 'Open this from a chapter on your page, and I will know which one to plan.';
    input.disabled = true; save.disabled = true;
  } else if (!GAME_BACKEND_URL) {
    say('Saving opens once the game is live.', '');
    input.disabled = true; save.disabled = true;
  }
  input.addEventListener('input', function () { count.textContent = input.value.length + ' of 200'; });

  // same rule as the server's chapter key (ownAcadNormChapter_), only to find this chapter's saved line
  function norm(s) { return String(s || '').normalize('NFC').toLowerCase().replace(/[^\p{L}\p{M}\p{N}]+/gu, ' ').trim(); }
  function prefill() {
    if (!GAME_BACKEND_URL || !session || !cls) return;
    fetch(GAME_BACKEND_URL + (GAME_BACKEND_URL.indexOf('?') === -1 ? '?' : '&') + 'action=teacherplans&idToken=' + encodeURIComponent(session.idToken || ''), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d || d.success !== true || input.value) return;
        var mine = (d.plans || []).filter(function (p) { return p.cls === cls && p.subj === subj && p.chapterNorm === norm(ch); })[0];
        if (mine) { input.value = mine.activity; count.textContent = input.value.length + ' of 200'; }
      })
      .catch(function () { /* a first plan starts empty */ });
  }

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (save.disabled) return;
    say('', '');
    save.disabled = true;
    fetch(GAME_BACKEND_URL, { method: 'POST', body: JSON.stringify({ action: 'teacherplanactivity', idToken: session && session.idToken, cls: cls, subj: subj, ch: ch, name: name, activity: input.value }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && d.success === true) say("Saved. Tonight I'll look for it in your classwork.", 'ok');
        else say(d && d.error ? d.error : 'That did not save. Please try again.', 'err');
      })
      .catch(function () { say("I couldn't reach the game just now. Your words are still here; try Save again in a moment.", 'err'); })
      .then(function () { save.disabled = false; });
  });

  (LMCS.getSession() ? Promise.resolve(LMCS.getSession()) : LMCS.requireSession('#lmcs-gate-slot')).then(function (s) {
    session = s || LMCS.getSession();
    document.getElementById('lmcs-gate').style.display = 'none';
    prefill();
    if (!input.disabled) input.focus();
  });
})();
</script>
</body>
</html>
