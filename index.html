<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMCS Portal — Home</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>

  <header class="site">
    <div class="wrap">
      <a class="brand" href="index.html">
        <span class="logo-badge"><img src="assets/img/lms-logo.png" alt="LMS logo" /></span>
        <span>
          LMCS Portal
          <span class="tagline">Grooming to Excellence</span>
        </span>
      </a>
      <nav class="roles" id="header-status"></nav>
    </div>
  </header>

  <main class="wrap">

    <!-- Gate renders inside #gate-slot; whole section hides once signed in -->
    <section class="hero" id="auth-root" style="padding-top:40px;">
      <span class="eyebrow">Internal · Staff use only</span>
      <h1>One home for La Montessori School management</h1>
      <div id="gate-slot"></div>
    </section>

    <div id="app-root" style="display:none">

      <div class="welcome" id="welcome-strip"></div>

      <section class="block" id="modules">
        <h2>Modules</h2>
        <div class="modules" id="modules-grid">
          <!-- filled in by JS once campus is known -->
        </div>
      </section>

    </div>

  </main>

  <footer class="site">
    <div class="wrap">
      LMCS Portal — internal management system for La Montessori Schools.
    </div>
  </footer>

  <script src="assets/auth.js"></script>
  <script>
    const MODULES = [
      { name: 'Curriculum & Progress', status: 'live', url: 'curriculum-progress/daily-progress.html', desc: 'Daily CW/HW tracking mapped against the Annual Curriculum Plan.' },
      { name: "Principal's Daily Reporting", status: 'live', url: 'principals-daily-reporting/index.html', desc: 'Teacher SS, Principal DR, and more — one hub for every Support Session/Daily Report role and their dashboards. Principal/Coordinator/Owner access.' },
      { name: 'Hiring Dashboard', status: 'live', url: 'hiring/index.html', desc: 'Applicant tracking from screening through offer, per campus. Principal/Coordinator/Owner access.' },
      { name: 'Salary Dashboard', status: 'live', url: 'salary/index.html', desc: 'Offer-letter salary calculator, from the Hiring Dashboard\'s Salary Offer stage. Principal/Coordinator/Owner access.' },
      // Re-activated 2026-09-23 per Uday.
      { name: 'Staff Portal', status: 'live', url: 'staff/add-employee.html', desc: 'Add, transfer, and mark departed employees in the Employee Master workbook. Coordinator/Owner access only.' },
      // Separate repo (kanwaruday/LMCSTeachers), not a separate login --
      // same auth.js/backend as everything else here, see that repo's
      // README for why it's split out. Only "My Requests" (leave & other
      // approvals) is built so far; Teacher access only.
      { name: 'Teacher Portal', status: 'live', url: 'https://kanwaruday.github.io/LMCSTeachers/', desc: 'Leave and other requests, self-service. Teacher access.' },
      { name: 'Bye Laws', status: 'live', url: 'https://kanwaruday.github.io/LMCSByeLaws/', desc: 'HR rulebook of record — conduct, leave rules, and job roles.' },
    ];

    // Only 'live' modules render as a clickable link -- 'planned' (never built)
    // and 'paused' (built, temporarily off) both show as plain text, same as
    // each other today; if that ever needs to look different, split this check.
    function renderModules() {
      const grid = document.getElementById('modules-grid');
      grid.innerHTML = MODULES.map((m) => (
        '<div class="card">' +
          '<div class="card-top">' +
            '<h3>' + (m.status === 'live' && m.url ? '<a href="' + m.url + '">' + m.name + '</a>' : m.name) + '</h3>' +
            '<span class="status ' + m.status + '">' + m.status + '</span>' +
          '</div>' +
          '<p>' + m.desc + '</p>' +
        '</div>'
      )).join('');
    }

    function showApp(session) {
      document.getElementById('auth-root').style.display = 'none';
      document.getElementById('app-root').style.display = '';

      document.getElementById('header-status').innerHTML =
        '<span>' + session.campusName + '</span>';

      document.getElementById('welcome-strip').innerHTML =
        '<div class="welcome-text">Signed in as <b>' + session.name + '</b>' +
        '<span class="welcome-campus">' + session.campusName + '</span></div>' +
        '<a href="#" class="signout" id="signout-link">Sign out</a>';

      document.getElementById('signout-link').addEventListener('click', function (e) {
        e.preventDefault();
        LMCS.signOut();
      });

      renderModules();
    }

    // Fast path: a cached, valid session shows the app immediately instead
    // of waiting on a live allowlist re-check (that fetch alone can take
    // 20s+ — see the perf audit) — same pattern every module page already
    // uses for its own gate. Falls back to requireSession() (which re-
    // validates the cached session against the allowlist) if there's no
    // cached session to show yet.
    const cachedSession = LMCS.getSession();
    if (cachedSession) {
      showApp(cachedSession);
    } else {
      LMCS.requireSession('#gate-slot').then(showApp);
    }
  </script>

</body>
</html>
