<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMCS Portal — People</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="../assets/style.css?v=0049023a" />
  <link rel="stylesheet" href="../assets/game/game.css?v=ee9ca522" />
  <link rel="stylesheet" href="../assets/game/base.css?v=4774c2bb" />
  <style>
    /* the People room only: the confirm sheet and the function checkboxes. Everything else is base.css (gb-). */
    .pp-dlg { border:0; border-radius:16px; padding:16px; width:min(520px, calc(100vw - 32px)); max-height:calc(100vh - 32px); background:var(--gb-paper); color:var(--gb-ink); }
    .pp-dlg::backdrop { background:rgba(14,20,30,.55); }
    .pp-dlg h2 { margin:0 0 8px; }
    .pp-fns { border:0; margin:0 0 14px; padding:0; }
    .pp-fns legend { font-weight:700; margin:0 0 4px; padding:0; }
    .pp-fns label { display:flex; align-items:center; gap:10px; min-height:44px; }
    .pp-fns input { width:22px; height:22px; }
    .pp-row small { display:block; }
    .pp-acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    @media (max-width:640px) { .pp-dlg { width:100vw; max-width:100vw; margin:auto 0 0; border-radius:16px 16px 0 0; } }
  </style>
</head>
<body class="gb gb-app">

  <!-- 👑 The People room (Owner only): assets/game/people-room.js, also opened in a window on the Owner's map (owner/index.html). -->
  <header class="gb-head"><div><div><h1>People</h1><p>Coordinators across LMCS HQ and LMS 1–6</p></div><nav class="gb-hsw" aria-label="Owner views"><a href="index.html" data-emoji="homeBase">Home</a><a href="kingdom.html" data-emoji="world">Kingdom</a></nav></div></header>
  <div class="gb-shell">
    <main class="gb-stage">
      <section class="hero" id="auth-root" style="padding-top:24px;"><div id="gate-slot"></div></section>
      <div id="app-root" style="display:none"></div><!-- the People room (assets/game/people-room.js) draws here -->
    </main>
  </div>

  <script src="../assets/auth.js?v=d8a26d6e"></script>
  <script src="../assets/game/game.js?v=e4fad387"></script>
  <script src="../assets/game/emoji.js?v=cfda9180"></script>
  <script src="../assets/game/people-room.js?v=d7775a66"></script>
  <script>
    const GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // same value as owner/index.html
    function show(session) {
      document.getElementById('auth-root').style.display = 'none';
      const root = document.getElementById('app-root'); root.style.display = '';
      LMCSPeople.mount(root, { session: session, backendUrl: GAME_BACKEND_URL });
    }
    function gate(session) {
      if (LMCS.canViewOwnerPortal(session)) return show(session);
      const p = LMCSGame.ui.h('p', {}, ['The People room is for the Owner. ', LMCSGame.ui.h('a', { href: '../index.html' }, ['Back to the portals'])]);
      const slot = document.getElementById('gate-slot'); slot.textContent = ''; slot.appendChild(p);
    }
    const cachedSession = LMCS.getSession();
    if (cachedSession) gate(cachedSession);
    else LMCS.requireSession('#gate-slot').then(gate);
  </script>

</body>
</html>
