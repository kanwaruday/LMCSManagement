<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMCS Portal — Owner</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="../assets/style.css?v=0049023a" />
  <link rel="stylesheet" href="../assets/game/game.css?v=ee9ca522" />
  <link rel="stylesheet" href="../assets/game/base.css?v=4774c2bb" />
  <link rel="stylesheet" href="../assets/game/kingdom.css?v=807b18f2" />
  <link rel="stylesheet" href="../assets/game/map-home.css?v=d7ef6895" />
  <style>
    /* the HQ window's tiles and lists (they live in the stash until a window opens them) */
    #hq-box .gb-grid, #modules .gb-list { margin:0; }
    #hq-box h3, #modules h3 { margin:14px 0 6px; }
    /* the People room inside its window (assets/game/people-room.js) */
    .pp-fns { border:0; margin:0 0 14px; padding:0; } .pp-fns legend { font-weight:700; margin:0 0 4px; padding:0; }
    .pp-fns label { display:flex; align-items:center; gap:10px; min-height:44px; } .pp-fns input { width:22px; height:22px; }
    .pp-row small { display:block; } .pp-acts { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; } .pp-inline h2 { margin:0 0 8px; }
    #people-box .gb-section { margin:0; }
    #gd-box ul { list-style:none; margin:8px 0; padding:0; display:flex; flex-direction:column; gap:6px; } #gd-box li { padding:8px 12px; border:1.5px solid var(--gb-line); border-radius:12px; }
  </style>
</head>
<body class="gb gb-app">

  <!-- The screen skeleton (assets/game/base.css). The Owner's home is the map (assets/game/map-home.js; Uday 29 Oct, "can we completely
       move to Map for the entire setup"): the Kingdom's real map with LMCS HQ and LMS 1-6, a bubble where a decision waits, every control on
       the edges and every list in a window. The Kingdom itself (assets/game/kingdom.js) is mounted off screen in #kg-root, so its own
       dialogs (buildings and setup steps, 📜 All quests with assign and bulk, the Requests tray, alliance heads) open from the map's windows.
       What used to be lists (the HQ tiles, Today, tools, appointments, sign out) waits in the stash and is moved into a window when opened. -->
  <header class="gb-head"><div><div id="welcome-strip"><h1>HQ Home</h1><p id="hub-hello">LMCS HQ and LMS 1–6</p></div></div></header>
  <div class="gb-shell">
    <nav class="gb-rail" id="game-rail" aria-label="Game" hidden></nav>
    <main class="gb-stage">
      <!-- Gate renders inside #gate-slot; whole section hides once signed in -->
      <section class="hero" id="auth-root" style="padding-top:24px;">
        <h2>Sign in to Owner home</h2>
        <div id="gate-slot"></div>
      </section>
      <div id="app-root" style="display:none">
        <div id="mh-stash" hidden>
          <section id="hq-box" aria-label="LMCS HQ">
            <ul class="gb-grid hq-tiles" id="hq-tiles" aria-label="HQ Home"></ul>
            <h3>Set up the game · सेटअप</h3>
            <ul class="gb-list" id="hq-more"></ul>
          </section>
          <section id="game-root" aria-label="Today with Buddy" hidden></section>
          <section id="modules" aria-label="Owner tools"><h3>Owner tools</h3><ul class="gb-list" id="modules-grid"></ul><h3>More pages</h3><ul class="gb-list" id="tools-more"></ul></section>
          <section id="gd-box" aria-label="Game Day"></section>
          <section id="people-box" aria-label="People"></section>
          <section id="routes-box" aria-label="Bus routes, every school"><div id="world-map"></div></section>
          <div class="kg" id="kg-root"></div><div id="kg-next"></div><div id="kg-panels"></div>
          <section id="appt-wrap"><h3>Appointments</h3><div id="appt-box"></div></section>
          <section id="acct-wrap"><h3>Account</h3><a href="#" class="gb-btn" id="signout-link">Sign out</a></section>
        </div>
        <!-- the one screen (Uday, 30 Oct): the map with ~20 entry points on its edges and a bottom bar under it; each opens its own window -->
        <div class="mh-scene" id="mh-scene"></div>
      </div>
    </main>
    <aside class="gb-panels" id="panels" aria-label="More" hidden></aside><!-- kept empty: everything opens in a window -->
  </div>

  <footer class="site">
    <div class="wrap">
      LMCS Portal — internal management system for La Montessori Schools.
    </div>
  </footer>

  <script src="../assets/auth.js?v=d8a26d6e"></script>
  <script src="../assets/game/game.js?v=e4fad387"></script>
  <script src="../assets/appointments.js?v=5dfa5b13"></script>
  <script src="../assets/game/emoji.js?v=cfda9180"></script>
  <script src="../assets/game/rail.js?v=e726bf9c"></script>
  <script src="../assets/game/kingdom.js?v=08da6a15"></script>
  <script src="../assets/game/places.js?v=e29efb40"></script>
  <script src="../assets/game/kingdom-map.js?v=897c8cef"></script>
  <script src="../assets/game/people-room.js?v=d7775a66"></script>
  <script src="../assets/game/map-home.js?v=16e8a253"></script>
  <script src="../coordinator/route-map.js?v=3f998a20"></script>
  <script>
    const GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // Task 11 sets this at deploy; empty = the game panel renders nothing
    const PDR_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzpkFLy4KvTdSJfioz6wlgRGLjvO_GvbffhOYBb-hHybFtjGTk0ps-GzXz0FrQ9GmYdfg/exec';
    const COORD_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwilcvrgZQga_qo1A-fBTUzKLifrBYIwlPHoWMITmchf5sZOYjKIJ7_4J0TeBF_-6B6/exec'; // transportworld (apps-script/coordinator-world.gs): the World's routes
    const MODULES = [
      { name: 'Kingdom', e: 'base', url: 'kingdom.html', desc: 'Your schools as a kingdom. Buddy shows your next step, and you hand out who sets up what.' },
      { name: 'People', e: 'heads', url: 'people.html', desc: 'Coordinators: add one, or change their school and functions.' },
      // Approvals points at the Coordinator systems page for now; Owner portal part A replaces it.
      { name: 'Approvals', e: 'requests', url: '../coordinator/systems/index.html#approvals', desc: 'Role requests and other items waiting for your decision.' },
      { name: 'Payroll', e: 'payroll', url: '../payroll/index.html', desc: 'Monthly payroll.' },
      { name: 'Salary Dashboard', e: 'salary', url: '../salary/index.html', desc: 'Offer-letter salary calculator and salary data.' },
      { name: 'Transport', e: 'bus', url: 'transport/index.html', desc: 'GPS leakage, trackers, who is late on follow-ups, and proposals for your decision.' },
    ];

    // every other page the Owner opens, so the map is the only way in that is needed (the Tools window lists them)
    const MORE = [
      { name: 'Hiring', e: 'hiring', url: '../hiring/index.html', desc: 'Applicants from screening to offer, every school.' },
      { name: 'Staff', e: 'documents', url: '../staff/add-employee.html', desc: 'Add staff, transfer them, and their documents.' },
      { name: 'Driver phones', e: 'phone', url: '../coordinator/transport/drivers.html', desc: "Link a driver's own phone to their bus, or unlink it." },
      { name: 'Roll call', e: 'rollCall', url: '../coordinator/transport/rollcall.html', desc: 'Who drove and attended each bus today.' },
      { name: 'Fleet setup', e: 'busCheck', url: '../coordinator/transport/setup.html', desc: 'Six small quests per bus: papers, kit and plan.' },
      { name: 'Driver fuel fills', e: 'fuel', url: '../office/driver-fills.html', desc: 'Fills the drivers sent, to confirm.' },
      { name: 'Day Book starting data', e: 'startingData', url: '../office/starting-data.html', desc: "Each school's starting figures for the Day Book." },
      { name: 'Curriculum progress', e: 'curriculum', url: '../curriculum-progress/daily-progress.html', desc: 'Chapters done against the plan.' },
      { name: 'Coordinator portal', e: 'heads', url: '../coordinator/index.html', desc: 'The Coordinators\' map, follow-ups and department rooms.' },
      { name: 'Setup quests', e: 'quests', url: '../setup/index.html', desc: 'Check and confirm what the game already knows.' },
    ];

    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
    function renderModules() {
      [['modules-grid', MODULES], ['tools-more', MORE]].forEach(function (pair) { const ul = document.getElementById(pair[0]); ul.textContent = ''; pair[1].forEach(function (m) {
        const a = el('a', 'gb-go'), span = el('span', '', m.name), li = el('li');
        if (window.LMCSEmoji && LMCSEmoji.get(m.e)) span.insertBefore(LMCSEmoji.tag(m.e), span.firstChild);
        a.href = m.url;
        span.appendChild(el('small', '', m.desc));
        a.appendChild(span); li.appendChild(a); ul.appendChild(li);
      }); });
    }

    // HQ Home's four tiles. Counts come only from what an existing read already returns: gamekingdom's `cards` (approved requests
    // waiting for a follow-up) and the HQ "Set up the game" steps (setupSteps_); Money today is a link only. k = null while loading.
    function hqTiles(k) {
      const hq = k && k.kingdom && (k.kingdom.campuses || []).filter(function (c) { return c.darbar; })[0];
      let steps = null;
      ((hq && hq.buildings) || []).forEach(function (b) { (b.tiers || []).forEach(function (t) { if (t.steps && t.steps.length) steps = t.steps; }); });
      const cards = k && Array.isArray(k.cards) ? k.cards.length : null, done = steps ? steps.filter(function (s) { return s.done; }).length : 0;
      return [
        { e: 'requests', name: 'Approvals', url: '../coordinator/systems/index.html#approvals', count: cards || null,
          small: cards ? cards + (cards === 1 ? ' approved request waits' : ' approved requests wait') + ' for a follow-up' : k ? 'Requests waiting for your decision. Nothing approved is waiting for a follow-up.' : 'Requests waiting for your decision' },
        { e: 'dayBook', name: 'Money today', url: '../office/daybook.html', small: "The Day Book: today's cash and entries" },
        { e: 'heads', name: 'People', url: 'people.html', small: 'Coordinators: their school and what they look after' },
        { e: 'settings', name: 'Game settings', url: 'kingdom.html#base-HES', count: steps && done < steps.length ? steps.length - done : null,
          small: steps ? 'Set up the game: ' + done + ' of ' + steps.length + ' done' : 'Set up the game' },
      ];
    }
    // a tile or a row that opens one of the map's windows instead of a page (the setup lives on the map; the page link stays as the fallback)
    const ON_MAP = { 'kingdom.html#base-HES': function (b) { setup('HES', b); }, 'people.html': function (b) { openPeople(b); }, 'kingdom.html#quests': function (b) { quests(b); } };
    function renderTiles(k) {
      const ul = document.getElementById('hq-tiles');
      ul.textContent = '';
      hqTiles(k).forEach(function (t) {
        const a = el('a', 'gb-go'), span = el('span'), li = el('li'), ic = window.LMCSEmoji && LMCSEmoji.tag(t.e);
        if (ic) span.appendChild(ic);
        span.appendChild(document.createTextNode(t.name));
        if (t.count) { const c = el('span', 'gb-count', String(t.count)); c.setAttribute('aria-hidden', 'true'); span.appendChild(document.createTextNode(' ')); span.appendChild(c); }
        span.appendChild(el('small', '', t.small));
        a.href = t.url; a.appendChild(span); li.appendChild(a); ul.appendChild(li);
        if (ON_MAP[t.url]) a.addEventListener('click', function (e) { e.preventDefault(); ON_MAP[t.url](a); });
      });
    }
    // the HQ window's setup rows: each opens the Kingdom's own dialog (or the People room) over the map
    function renderMore(k) {
      const ul = document.getElementById('hq-more'), cards = (k && k.cards) || [], heads = (k && k.heads) || [];
      ul.textContent = '';
      [{ e: 'quests', name: '📜 All quests', desc: 'Every setup quest, school by school: assign, reassign, nudge, or give them out in bulk (Game Day to everyone, every quest to its roles).', go: quests },
        { e: 'requests', name: 'Requests tray' + (k ? ' (' + cards.length + ')' : ''), desc: cards.length ? 'Approved requests waiting for someone to follow them up.' : 'Approved requests land here when nobody is following them up.', go: openTray },
        { e: 'heads', name: 'People', desc: 'Coordinators: add one, or change their school and what they look after.', go: openPeople },
        { e: 'heads', name: 'Alliance heads' + (k ? ' (' + heads.length + ')' : ''), desc: 'What each head is working on.', go: openHeads }].forEach(function (t) {
        const b = el('button', 'gb-go'), span = el('span', '', t.name), li = el('li');
        b.type = 'button';
        span.appendChild(el('small', '', t.desc)); b.appendChild(span); li.appendChild(b); ul.appendChild(li);
        b.addEventListener('click', function () { t.go(b); });
      });
    }

    // ── the Kingdom, off screen: its dialogs open over the map. Its one gamekingdom read feeds the tiles, the setup rows and the map ──
    const pinOf = function (id) { return document.querySelector('.mh-pin[data-id="' + id + '"]') || document.getElementById('mh-edge'); };
    // focus comes back to a control on the map: the opener if it is on screen, else the place's pin (a row inside a window is gone once it closes)
    const back = function (opener, id) { return opener && opener.isConnected && !opener.closest('#mh-stash, .mh-layer') ? opener : pinOf(id); };
    function setup(id, opener) { const to = back(opener, id); LMCSMapHome.close(); LMCSKingdom.openBase(id, to); }
    function quests(opener) { const to = back(opener, 'HES'); LMCSMapHome.close(); LMCSKingdom.openQuests(to); }
    // the Requests tray: one row per approved request; a row opens the Kingdom's follow-up sheet (pick a head, a due date, Assign)
    function openTray(opener) {
      const k = LMCSKingdom.last() || {}, cards = k.cards || [], ul = el('ul', 'gb-list');
      if (!cards.length) ul.appendChild(el('li', 'gb-empty', 'Nothing waiting. When a request is approved and nobody is following it up, it lands here for you to hand out.'));
      cards.forEach(function (c) {
        const b = el('button', 'gb-go'), span = el('span', '', c.title), li = el('li'); b.type = 'button';
        span.appendChild(el('small', '', 'Approved request' + (c.campus ? ' · ' + c.campus : ''))); b.appendChild(span); li.appendChild(b); ul.appendChild(li);
        b.addEventListener('click', function () { LMCSMapHome.close(); LMCSKingdom.openFollow(c, pinOf('HES')); });
      });
      LMCSMapHome.open({ title: 'Requests tray · अनुरोध', sub: 'Tap one, then pick who follows it up', nodes: [ul], opener: opener });
    }
    function openHeads(opener) {
      const heads = (LMCSKingdom.last() || {}).heads || [], ul = el('ul', 'gb-list');
      if (!heads.length) ul.appendChild(el('li', 'gb-empty', 'No alliance heads are set up yet. They come from the game config.'));
      heads.forEach(function (hd) {
        const n = (hd.missions || []).filter(function (m) { return !m.done; }).length, b = el('button', 'gb-go'), span = el('span', '', hd.name), li = el('li'); b.type = 'button';
        span.appendChild(el('small', '', LMCSKingdom.fnLabels(hd.functions) + ' · ' + LMCSKingdom.countText(n))); b.appendChild(span); li.appendChild(b); ul.appendChild(li);
        b.addEventListener('click', function () { LMCSMapHome.close(); LMCSKingdom.openHead(hd, pinOf('HES')); });
      });
      LMCSMapHome.open({ title: 'Alliance heads', nodes: [ul], opener: opener });
    }
    // 👑 People, in a window: the same room as owner/people.html (assets/game/people-room.js); its steps replace the list inside the window
    function openPeople(opener) {
      const box = document.getElementById('people-box');
      LMCSPeople.mount(box, { session: LMCS.getSession(), backendUrl: GAME_BACKEND_URL, inline: true });
      LMCSMapHome.open({ title: 'People · लोग', sub: 'Coordinators across LMCS HQ and LMS 1–6', nodes: [box], held: [box], opener: opener });
    }
    function mountKingdom(session) {
      renderTiles(null); renderMore(null);
      if (!GAME_BACKEND_URL) { LMCSMapHome.setKingdom(null); return; }
      const tray = LMCSKingdom.hooks.after; // the Kingdom's own Requests tray (drawn off screen): kept, then the map follows
      LMCSKingdom.hooks.after = function (d) {
        if (tray) tray(d); renderTiles(d); renderMore(d); LMCSMapHome.setKingdom(d);
        LMCSMapHome.setIcon(topEntries(d)[2]);
        approvals().then(function (list) { LMCSMapHome.setIcon({ key: 'requests', e: 'requests', label: ['अनुरोध', 'Requests'], n: (list || []).length + (d.cards || []).length, open: openRequests }); });
      };
      LMCSKingdom.mount(document.getElementById('kg-root'), { session: session, backendUrl: GAME_BACKEND_URL, root: '../', next: document.getElementById('kg-next'), panels: document.getElementById('kg-panels'),
        quiet: true, onWrite: function () { const p = document.getElementById('mh-edge'); if (p) p.focus(); } })
        .then(function () { if (!LMCSKingdom.last()) LMCSMapHome.setKingdom(null); }); // a failed read: the map keeps its places, the rows say so
    }

    // the Kingdom's own writes (kingdomassign, kingdomallocate), sent from a decision window after the Owner picks and taps Assign
    function post(body) {
      return fetch(GAME_BACKEND_URL, { method: 'POST', body: JSON.stringify(Object.assign({ idToken: (LMCS.getSession() || {}).idToken }, body)) }).then(function (r) { return r.json(); });
    }
    // 🎉 Game Day (gameeventboard, Owner only): an icon on the right while an event is on or coming, its lines in a window, the full board on the Kingdom
    function loadGameDay(session) {
      if (!GAME_BACKEND_URL || !window.LMCSMapHome || !window.LMCSKingdom) return;
      fetch(GAME_BACKEND_URL + '?action=gameeventboard&idToken=' + encodeURIComponent(session.idToken || ''), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!(d && d.success && d.event && Array.isArray(d.schools))) return; // no event: the icon stays and says so
          const box = document.getElementById('gd-box'), n = d.network;
          box.textContent = '';
          box.appendChild(el('p', '', d.event.upcoming ? d.event.name + ' starts ' + LMCSGame.dateLabel(d.event.date) + '.' : d.event.name + ' · live'));
          if (n) box.appendChild(el('p', 'gb-muted', 'All schools: ' + LMCSKingdom.gdNetworkText(n)));
          const ul = el('ul'); d.schools.forEach(function (x) { ul.appendChild(el('li', '', LMCSKingdom.gdSchoolLine(x))); }); box.appendChild(ul);
          const a = el('a', 'gb-btn', 'Open the full board'); a.href = 'kingdom.html'; box.appendChild(a);
          LMCSMapHome.setIcon({ key: 'gameday', e: 'events', label: ['खेल दिवस', 'Game Day'], n: d.event.upcoming ? 0 : 1, open: function (b) { LMCSMapHome.open({ title: d.event.name, nodes: [box], held: [box], opener: b }); } });
        }, function () { /* no board: no icon */ });
    }

    function hello(name) {
      const h = new Date().getHours(), first = String(name || '').trim().split(/\s+/)[0];
      return (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + (first ? ', ' + first + ' ji' : '');
    }

    const byId = function (id) { return document.getElementById(id); };
    const win = function (title, nodes, opener, sub, held) { LMCSMapHome.open({ title: title, sub: sub, nodes: nodes, held: held, opener: opener }); };
    const row = function (t, small, href, onclick) { // one gb-go row: a link, or a button when it opens a window
      const r = el(href ? 'a' : 'button', 'gb-go'), span = el('span', '', t); if (href) r.href = href; else r.type = 'button';
      if (small) span.appendChild(el('small', '', small)); r.appendChild(span); if (onclick) r.addEventListener('click', onclick);
      const li = el('li'); li.appendChild(r); return li;
    };
    // 🚌 Wilderness · the buses: Fleet Command's route map of every school, read only, in a window (loaded the first time)
    let worldMap = null;
    function openRoutes(opener) {
      const box = byId('routes-box');
      win('Buses · बसें', [box], opener, 'Routes and stops, every school', [box]);
      if (!worldMap && window.LMCSRouteMap) { try { worldMap = LMCSRouteMap.mount(byId('world-map'), { session: LMCS.getSession(), backendUrl: COORD_BACKEND_URL, mode: 'metro' }); } catch (e) { console.warn('route map', e); } }
    }
    // approvals waiting for the Owner's decision (PDR approvalslist, the Approvals page's own read): read once, for the badge, the window and the school chips
    let APPROVALS = null;
    function approvals() {
      if (!APPROVALS) APPROVALS = fetch(PDR_BACKEND_URL + '?action=approvalslist&idToken=' + encodeURIComponent((LMCS.getSession() || {}).idToken || ''), { cache: 'no-store' })
        .then(function (r) { return r.json(); }).then(function (d) { return d && d.success && Array.isArray(d.requests) ? d.requests.filter(function (a) { return /^(Pending|Info Requested)$/.test(a.status) && !a.archived; }) : null; }, function () { return null; });
      return APPROVALS;
    }
    // Requests: approvals waiting for a decision, then the Requests tray (approved, nobody following up)
    function openRequests(opener) {
      approvals().then(function (list) {
        const cards = (LMCSKingdom.last() || {}).cards || [], a = el('ul', 'gb-list'), t = el('ul', 'gb-list');
        if (list === null) a.appendChild(el('li', 'gb-muted', "The approvals list didn't load. The Approvals page still opens."));
        else if (!list.length) a.appendChild(el('li', 'gb-empty', 'Nothing waits for your decision.'));
        (list || []).slice(0, 12).forEach(function (x) { a.appendChild(row(x.title, (x.campusId || '') + ' · ' + x.status, '../coordinator/systems/index.html#approvals')); });
        a.appendChild(row('Open Approvals', 'Decide, ask for information, or reject', '../coordinator/systems/index.html#approvals'));
        if (!cards.length) t.appendChild(el('li', 'gb-empty', 'Nothing waiting. When a request is approved and nobody is following it up, it lands here.'));
        cards.forEach(function (c) { t.appendChild(row(c.title, 'Approved request' + (c.campus ? ' · ' + c.campus : ''), null, function () { LMCSMapHome.close(); LMCSKingdom.openFollow(c, pinOf('HES')); })); });
        win('Requests · अनुरोध', [el('h3', '', 'Waiting for your decision'), a, el('h3', '', 'Requests tray: pick who follows up'), t], opener);
      });
    }
    // 🏫 Schools: every school with its level; a row opens that school's window on the map
    function openSchools(opener) {
      const bases = ((LMCSKingdom.last() || {}).kingdom || {}).campuses || [], ul = el('ul', 'gb-list');
      if (!bases.length) ul.appendChild(el('li', 'gb-empty', 'The schools load with the Kingdom. Try again in a moment.'));
      bases.forEach(function (b) { ul.appendChild(row(b.full || b.name, 'Level ' + (Number(b.level) || 0) + ' · ' + LMCSKingdom.progressText(LMCSKingdom.progressOf([b])), null, function () { LMCSMapHome.openPin(b.id); })); });
      win('Schools · स्कूल', [ul], opener);
    }
    // 🏫 Map ⇄ School: pick a school and see it as its Principal does (read only; Leave comes back to this map)
    function openSchoolView(opener) {
      const bases = (((LMCSKingdom.last() || {}).kingdom || {}).campuses || []).filter(function (b) { return /^LMS[1-6]$/.test(b.id); }), ul = el('ul', 'gb-list');
      (bases.length ? bases : LMCSMapHome.PINS.filter(function (p) { return !p.darbar; })).forEach(function (b) {
        ul.appendChild(row(b.full || b.name, 'स्कूल में जाएँ · Enter School (read only)', null, function () {
          try { sessionStorage.setItem('lmcs-map-return', JSON.stringify({ page: 'owner/index.html', pin: b.id })); } catch (e) { /* Leave lands on the map's start */ }
          LMCSGame.setViewAs({ campus: b.id, name: b.name }); location.assign('../principal/index.html');
        }));
      });
      win('Map ⇄ School · स्कूल', [el('p', 'gb-muted', 'See a school as its Principal does. Nothing can be changed while you look; Leave in the top bar brings you back to the map.'), ul], opener);
    }
    function openPayroll(opener) {
      const ul = el('ul', 'gb-list');
      ul.appendChild(row('Payroll', 'Monthly payroll for every school', '../payroll/index.html'));
      ul.appendChild(row('Salary Dashboard', 'Offer-letter salary calculator and salary data', '../salary/index.html'));
      win('Payroll · वेतन', [ul], opener);
    }
    function openDay(opener) {
      const ul = el('ul', 'gb-list');
      ul.appendChild(row('Money today', "The Day Book: today's cash and entries", '../office/daybook.html'));
      win('The day · आज', [el('p', 'mh-detail', LMCSMapHome.dayText(new Date()) + '. The school day closes at 15:30 IST.'), ul], opener);
    }
    function openPoints(opener) {
      const bases = ((LMCSKingdom.last() || {}).kingdom || {}).campuses || [], ol = el('ul', 'gb-list');
      bases.slice().sort(function (a, b) { return (Number(b.points) || 0) - (Number(a.points) || 0); }).forEach(function (b) { ol.appendChild(row(b.full || b.name, (Number(b.points) || 0) + ' points · Level ' + (Number(b.level) || 0), null, function () { LMCSMapHome.openPin(b.id); })); });
      if (!bases.length) ol.appendChild(el('li', 'gb-empty', 'Points load with the Kingdom.'));
      win('Points · अंक', [el('p', 'gb-muted', 'A school earns points as its buildings level up.'), ol], opener);
    }
    // a school window's numbers (assets/game/map-home.js campusStats): existing reads only, loaded once, the first time a school is opened.
    // Issues, today's reports and the buses from the Coordinator backend; approvals waiting from the approvals read above.
    function analytics() {
      const s = LMCS.getSession() || {}, tok = encodeURIComponent(s.idToken || ''), today = new Date(Date.now() + 330 * 60000).toISOString().slice(0, 10); // IST
      const get = function (q) { return fetch(COORD_BACKEND_URL + '?' + q + '&idToken=' + tok, { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { return j && j.success ? j : null; }, function () { return null; }); };
      return Promise.all([get('action=principalissues'), get('action=coordinatorpdrday&date=' + today), get('action=coordinatortransport'), approvals()]).then(function (r) {
        return { today: today, issues: r[0] && r[0].issues, pdrDay: r[1], transport: r[2],
          approvals: r[3] ? r[3].map(function (a) { return { campus: a.campusId, title: a.title, waiting: true }; }) : null };
      });
    }
    const SOON = {
      staff: 'Staff present today needs an attendance source: nothing in the portal records who is in yet.',
      campaigns: 'Campaigns (the "Open the School" chapters after Game Day) open here.', admissions: 'Admissions, school by school, open here.',
      events: 'The events calendar opens here.', notices: 'Notices and messages for you land here.', chat: 'A short line of news from the schools runs here.',
      requisitions: 'Requisitions (purchase requests before approval) open here.' };
    const total = function (k) { return (((k || {}).kingdom || {}).campuses || []).reduce(function (n, b) { return n + (Number(b.points) || 0); }, 0); };
    function topEntries(k) {
      return [{ key: 'day', e: 'day', label: ['दिन', 'Day'], value: LMCSMapHome.dayText(new Date()).replace('Day open · ', '').replace('Day closed', 'Closed'), open: openDay },
        { key: 'staff', e: 'account', label: ['स्टाफ़', 'Staff present'], value: '—', soon: true, soonText: SOON.staff },
        { key: 'points', e: 'points', label: ['अंक', 'Points'], value: k ? String(total(k)) : '…', open: openPoints }];
    }
    function mountHud(session) {
      if (!window.LMCSMapHome) return;
      const icon = function (key, e, hi, en, open, soon) { return { key: key, e: e, label: [hi, en], open: open, soon: !open, soonText: SOON[key] }; };
      LMCSMapHome.mount({ role: 'Owner', session: session, root: '../', scene: byId('mh-scene'), stash: byId('mh-stash'),
        gameRoot: byId('game-root'), world: function () { openRoutes(byId('mh-edge')); }, post: post, refresh: function () { LMCSKingdom.refresh(); }, realMap: true, setup: setup,
        analytics: analytics, enterSchool: true, deadline: true,
        top: topEntries(null),
        icons: [{ key: 'gameday', e: 'events', label: ['खेल दिवस', 'Game Day'], value: '', open: function (b) { win('Game Day · खेल दिवस', [el('p', 'mh-empty', 'No Game Day is running or coming up.')], b); } },
          icon('campaigns', 'rallies', 'अभियान', 'Campaigns'), icon('admissions', 'applicants', 'दाख़िले', 'Admissions'), icon('events', 'appointments', 'कार्यक्रम', 'Events')],
        lower: [{ key: 'requests', e: 'requests', label: ['अनुरोध', 'Requests'], open: openRequests }, icon('notices', 'bill', 'सूचना', 'Notices')],
        ticker: { key: 'chat', e: 'call', label: ['चैट', 'Chat · coming soon'], soon: true, soonText: SOON.chat },
        bar: [{ key: 'quests', e: 'quests', label: ['खोज', 'All quests'], open: function (b) { quests(b); } }, { key: 'people', e: 'heads', label: ['लोग', 'People'], open: openPeople },
          { key: 'payroll', e: 'payroll', label: ['वेतन', 'Payroll'], open: openPayroll }, icon('requisitions', 'documents', 'माँग', 'Requisitions'),
          { key: 'schools', e: 'school', label: ['स्कूल', 'Schools'], open: openSchools }, { key: 'mapschool', e: 'world', label: ['⇄ स्कूल', 'Map ⇄ School'], open: openSchoolView }],
        hq: function () { return { nodes: [byId('hq-box')], held: [byId('hq-box')] }; },
        profile: function () { const n = [byId('modules'), byId('appt-wrap'), byId('acct-wrap')]; return { nodes: n, held: n }; } });
      setInterval(function () { LMCSMapHome.setIcon(topEntries(LMCSKingdom.last())[0]); }, 60000); // the day clock
      if (window.LMCSDock) LMCSDock.avoid = '.mh-bar'; // the floating Buddy lifts above the bottom bar
    }

    function showApp(session) {
      document.getElementById('auth-root').style.display = 'none';
      document.getElementById('app-root').style.display = '';

      document.getElementById('hub-hello').textContent = hello(session.name) + ' · LMCS HQ and LMS 1–6';

      document.getElementById('signout-link').addEventListener('click', function (e) {
        e.preventDefault();
        LMCS.signOut();
      });

      renderModules();
      mountHud(session);
      mountKingdom(session); loadGameDay(session);
      approvals().then(function (list) { if (list) LMCSMapHome.setIcon({ key: 'requests', e: 'requests', label: ['अनुरोध', 'Requests'], n: list.length + (((LMCSKingdom.last() || {}).cards) || []).length, open: openRequests }); });
      // no game rail here: the bottom bar is this page's dock, and Missions and Quests live in the drawer and the strip
      LMCSAppts.mount(document.getElementById('appt-box'), { backendUrl: PDR_BACKEND_URL, session: session });
      if (typeof LMCSGame !== 'undefined') { try { LMCSGame.mount(document.getElementById('game-root'), { session: session, backendUrl: GAME_BACKEND_URL, root: '../' }); } catch (e) { console.warn('game layer', e); } }
    }

    // Fast path: a cached, valid session shows the app immediately instead
    // of waiting on a live allowlist re-check (that fetch alone can take
    // 20s+ — see the perf audit) — same pattern every module page already
    // uses for its own gate. Falls back to requireSession() (which re-
    // validates the cached session against the allowlist) if there's no
    // cached session to show yet.
    const cachedSession = LMCS.getSession();
    function gate(session) {
      if (LMCS.canViewOwnerPortal(session)) return showApp(session);
      document.getElementById('gate-slot').innerHTML = '<p>The Owner portal is for the Owner only. <a href="../index.html">Back to the portals</a></p>';
    }
    if (cachedSession) {
      gate(cachedSession);
    } else {
      LMCS.requireSession('#gate-slot').then(gate);
    }
  </script>

</body>
