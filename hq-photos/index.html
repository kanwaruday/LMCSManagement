<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LMCS — Photograph LMCS HQ</title>
<meta name="theme-color" content="#CE0000">
<link rel="preconnect" href="https://script.google.com">
<link rel="stylesheet" href="../assets/style.css?v=0049023a">
<link rel="stylesheet" href="../assets/game/game.css?v=37f754ac">
<link rel="stylesheet" href="../assets/game/base.css?v=4774c2bb">
<style>
  body { min-height: 100vh; }
  #lmcs-gate { position: fixed; inset: 0; z-index: 99999; background: #fff; display: flex; align-items: center; justify-content: center; }
  #lmcs-gate .auth-gate { max-width: 380px; margin: 0 auto; padding: 32px 28px; border: 1px solid #ddd; border-top: 3px solid #CE0000; border-radius: 6px; text-align: center; }
  #lmcs-gate #lmcs-g-signin { display: flex; justify-content: center; }
  .hq-rule { font-weight: 700; margin: 0 0 10px; }
  .hq-done { border-color: var(--gb-ok); font-weight: 700; }
  .hq-shots { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
  .hq-shot { border: 1.5px solid var(--gb-line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; }
  .hq-shot.is-done { border-color: var(--gb-ok); }
  .hq-shot-h { display: flex; align-items: center; gap: 8px; }
  .hq-n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--gb-line); }
  .hq-shot.is-done .hq-n { background: var(--gb-ok); color: #fff; }
  .hq-img { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; background: var(--gb-line); }
  .hq-take { position: relative; min-height: 48px; justify-content: center; cursor: pointer; }
  .hq-file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .hq-take:focus-within { outline: 3px solid var(--gb-focus); outline-offset: 2px; }
  .hq-pinbox { margin: 16px 0; padding: 12px; border: 1.5px solid var(--gb-line); border-radius: 12px; }
  .hq-pinbox h2 { margin: 0 0 8px; }
  .hq-pinbox .gb-btn, .hq-pinbox .gb-input { min-height: 48px; width: 100%; box-sizing: border-box; margin-top: 8px; }
  .hq-tick { display: flex; align-items: center; gap: 10px; min-height: 48px; font-weight: 700; }
  .hq-tick input { width: 24px; height: 24px; }
  .hq-send { width: 100%; min-height: 52px; }
  .hq-msg { margin: 8px 0 0; font-weight: 700; } .hq-msg:empty { display: none; }
</style>
</head>
<body class="gb">
<div id="lmcs-gate"><div id="lmcs-gate-slot"></div></div>
<script src="../assets/auth.js?v=161b1bac"></script>
<script src="../assets/game/emoji.js?v=9abef414"></script>
<script src="../assets/game/hq-photos.js?v=00000000"></script>

<header class="gb-head"><div><div><h1 data-emoji="hq">Photograph LMCS HQ</h1><p>Three photos of the building outside, and where it is on the map</p></div><a id="hq-back" href="../"><span aria-hidden="true">&lsaquo;</span> Back</a></div></header>
<main class="gb-page" id="hq-root"></main>

<script>
(function () {
  var GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // same value as workplace/index.html
  // back to where the quest was opened from (same site only), else the portal chooser
  try { var r = new URL(document.referrer); if (r.origin === location.origin && r.pathname !== location.pathname) document.getElementById('hq-back').href = r.pathname + r.search; } catch (e) { /* no referrer */ }
  function start(session) {
    document.getElementById('lmcs-gate').style.display = 'none';
    LMCSHqPhotos.mount(document.getElementById('hq-root'), { session: session, backendUrl: GAME_BACKEND_URL });
  }
  (LMCS.getSession() ? Promise.resolve(LMCS.getSession()) : LMCS.requireSession('#lmcs-gate-slot')).then(function (s) { start(s || LMCS.getSession()); });
})();
</script>
</body>
</html>
