<body>
<header class="hdr"><div><h1>LMCS — Coordinator Portal</h1><p>Transport</p></div><span><a href="live.html">Checks and live buses &rarr;</a> &nbsp; <a href="../index.html">&larr; Coordinator home</a></span></header>
<details id="buddy" class="fs-buddy" hidden><summary>Fleet missions with Buddy</summary><section id="game-root" aria-label="Fleet setup with Buddy" hidden></section></details>
<div id="authRoot"></div>
<main id="appBody" style="display:none"></main>
<script src="../../assets/auth.js?v=baccef42"></script>
<script src="../transport-rank.js?v=b7edf91e"></script>
<script src="../shared.js?v=1e6a11b7"></script>
<script src="../../assets/game/game.js?v=5b23f514"></script>
<script>
const GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // the game backend (same as the four homes); empty = no panel
const FLEET_TOUR = { id: 'fleet-transport', beats: [
  { target: '#buddy', text: 'Our fleet setup missions are here, with the next step for our buses.' },
] };
Coord.boot(function (body) {
  Coord.transportView(body);
  const session = LMCS.getSession(), root = document.getElementById('game-root');
  new MutationObserver(function () { document.getElementById('buddy').hidden = root.hidden; }).observe(root, { attributes: true, attributeFilter: ['hidden'] }); // the panel shows once the game has something to say
  if (typeof LMCSGame !== 'undefined') { try { LMCSGame.mount(document.getElementById('game-root'), { session: session, backendUrl: GAME_BACKEND_URL, root: '../../', only: 'fleet', title: 'Fleet setup', tour: FLEET_TOUR }); } catch (e) { console.warn('game layer', e); } }
});
</script>
</body>
</html>
