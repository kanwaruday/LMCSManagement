<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#CE0000">
<title>LMCS — Fleet setup</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://accounts.google.com">
<link rel="stylesheet" href="../shared.css?v=14149e6e">
<link rel="stylesheet" href="../../assets/campus-picker.css?v=153d68d7">
<link rel="stylesheet" href="../capture/capture.css?v=829c42df">
<link rel="stylesheet" href="../../assets/game/game.css?v=ee9ca522">
</head>
<body>
<header class="hdr"><div><h1>Fleet setup</h1><p>LMCS Transport</p></div><a id="back" href="live.html">&larr; Checks</a></header>
<details id="buddy" class="fs-buddy" hidden><summary>Fleet missions with Buddy</summary><section id="game-root" aria-label="Fleet setup with Buddy" hidden></section></details>
<div id="authRoot"></div>
<main id="appBody" class="cap fs" hidden>
  <div id="pending" class="cap-offline" hidden><span id="pendingText"></span> <button type="button" id="sendNow" class="cap-btn">Send now</button></div>
  <ul id="refused" class="fs-refused"></ul>
  <p id="others" class="cap-note"></p>
  <p id="loadMsg" class="cap-note"><span>Loading the buses…</span> <button type="button" id="retry" class="cap-btn" hidden>Try again</button></p>

  <p class="cap-note"><a href="rollcall.html">Today's roll call: who drives and attends each bus</a></p>
  <section id="board" aria-label="Buses">
    <div id="scope" class="fs-scope"></div>
    <section id="gaps" class="fs-gaps" hidden>
      <h2 class="cap-h">What is still missing</h2>
      <ul id="gapList"></ul>
    </section>
    <ul id="teams" class="fs-teams"></ul>
    <p id="filterNote" class="fs-filter"></p>
    <ul id="buses" class="fs-buses"></ul>
  </section>
  <section id="bus" hidden></section>
  <section id="quest" hidden></section>

  <input type="file" id="photo" accept="image/*" capture="environment" hidden>
  <p id="toast" class="cap-toast" role="status" aria-live="polite"></p>
</main>
<script src="../../assets/auth.js?v=19734029"></script>
<script src="../../assets/campus-picker.js?v=cd35c768"></script>
<script src="../capture/fleet-quests.js?v=5b7607c0"></script>
<script src="../../assets/game/game.js?v=b8de04a1"></script>
<script>
  const GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // the game backend (same as the four homes); empty = no panel
  // Buddy's first-visit tour of this page (once per person). A beat whose target is not on screen sits centred.
  // Buddy's first-visit tour of this page (once per person; wording checked by the game director). A beat whose target is not
  // on screen sits centred. The next-step beat is only for people with fleet missions (Fee Clerks, Coordinators; not the Owner).
  function fleetTour(session) {
    const beats = [
      { target: '.hdr', text: 'This is Fleet setup: six short quests for each of our buses, so we know every bus, its driver and its papers. A bus with all six done is ready.' },
      { target: '#board:not([hidden]) #buses', text: 'Each card is one bus. Its ring fills a little with each quest done, and the line under it says what comes next.' },
      { target: '#board:not([hidden]) #buses', text: 'Open a bus to see its six quests: Vehicle papers, Safety kit, Parts history, Driver card, Fuel pump and Capture plan. Each is a short form or a run on the bus.' },
      { target: '#board:not([hidden]) #buses', text: "Amber means we've already found a value, mostly from the scans of the bus papers. Check it against the paper with View scan, then save it." },
    ];
    const missions = !LMCS.hasRole(session, 'Owner') && (LMCS.hasRole(session, 'Coordinator') || LMCS.hasRole(session, 'FeeClerk'));
    if (missions) beats.push({ target: '.lg-nextbar', text: "Your next step sits in the bar at the bottom. Go opens it. Your other fleet missions are in Buddy's panel at the top." });
    return { id: 'fleet-setup', beats: beats };
  }
  // setup.js calls this once the buses are on screen, so the tour has them to point at. The panel shows only once the game has
  // something to say (#game-root unhidden by the mount).
  window.mountFleetBuddy = function (session) {
    const root = document.getElementById('game-root'), tour = fleetTour(session);
    new MutationObserver(function () { document.getElementById('buddy').hidden = root.hidden; }).observe(root, { attributes: true, attributeFilter: ['hidden'] });
    if (typeof LMCSGame !== 'undefined') { try { LMCSGame.mount(document.getElementById('game-root'), { session: session, backendUrl: GAME_BACKEND_URL, root: '../../', only: 'fleet', title: 'Fleet setup', tour: tour }); } catch (e) { console.warn('game layer', e); } }
  };
</script>
<script type="module" src="../capture/setup.js?v=e3dd5bef"></script>
</body>
</html>
