<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#CE0000">
<title>LMCS — Fleet setup</title>
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://accounts.google.com">
<link rel="stylesheet" href="../shared.css?v=d988605c">
<link rel="stylesheet" href="../capture/capture.css?v=48e23cf9">
<link rel="stylesheet" href="../../assets/game/game.css?v=ee9ca522">
</head>
<body>
<header class="hdr"><div><h1>Fleet setup</h1><p>LMCS Transport</p></div><a id="back" href="live.html">&larr; Checks</a></header>
<details id="buddy" class="fs-buddy"><summary>Fleet missions with Buddy</summary><section id="game-root" aria-label="Fleet setup with Buddy" hidden></section></details>
<div id="authRoot"></div>
<main id="appBody" class="cap fs" hidden>
  <div id="pending" class="cap-offline" hidden><span id="pendingText"></span> <button type="button" id="sendNow" class="cap-btn">Send now</button></div>
  <ul id="refused" class="fs-refused"></ul>
  <p id="others" class="cap-note"></p>
  <p id="loadMsg" class="cap-note"><span>Loading the buses…</span> <button type="button" id="retry" class="cap-btn" hidden>Try again</button></p>

  <section id="board" aria-label="Buses">
    <div id="scope" class="cap-modes" role="group" aria-label="Campuses" hidden></div>
    <section id="gaps" class="fs-gaps" hidden>
      <h2 class="cap-h">What is still missing</h2>
      <ul id="gapList"></ul>
    </section>
    <ul id="teams" class="fs-teams"></ul>
    <p id="filterNote" class="fs-filter"></p>
    <ul id="buses" class="fs-buses"></ul>
  </section>
  <section id="bus" hidden></section>
  <section id="quest" hidden></section>

  <input type="file" id="photo" accept="image/*" capture="environment" hidden>
  <p id="toast" class="cap-toast" role="status" aria-live="polite"></p>
</main>
<script src="../../assets/auth.js?v=afd06314"></script>
<script src="../capture/fleet-quests.js?v=5b7607c0"></script>
<script src="../../assets/game/game.js?v=a1875e5e"></script>
<script>
  const GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // the game backend (same as the four homes); empty = no panel
  // Buddy's first-visit tour of this page (once per person). A beat whose target is not on screen sits centred.
  const FLEET_TOUR = { id: 'fleet-setup', beats: [
    { target: '.hdr', text: 'This is Fleet setup: six short quests for each of our buses, so we know every bus, its driver and its papers. A bus with all six done is ready.' },
    { target: '#board:not([hidden]) #buses', text: 'Each card is one bus. Its ring fills a part for every quest done, and the line under it says what comes next.' },
    { target: '#board:not([hidden]) #buses', text: 'Open a bus to see its six quests: Vehicle papers, Safety kit, Parts history, Driver card, Fuel pump and Capture plan. Each is a short form or a run on the bus.' },
    { target: '#board:not([hidden]) #teams', text: 'Amber means a value is already found, mostly read from the scans of the bus papers. Check it against the paper with View scan, then save it.' },
    { target: '.lg-nextbar', text: 'Your next step sits in the bar at the bottom, and Go opens it. The rest of your fleet missions are in the Buddy panel at the top.' },
  ] };
  // setup.js calls this once the buses are on screen, so the tour has them to point at
  window.mountFleetBuddy = function (session) {
    if (typeof LMCSGame !== 'undefined') { try { LMCSGame.mount(document.getElementById('game-root'), { session: session, backendUrl: GAME_BACKEND_URL, root: '../../', only: 'fleet', title: 'Fleet setup', tour: FLEET_TOUR }); } catch (e) { console.warn('game layer', e); } }
  };
</script>
<script type="module" src="../capture/setup.js?v=f82d087d"></script>
</body>
</html>
