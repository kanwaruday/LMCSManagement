<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMCS Portal — Coordinator</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="../assets/style.css" />
</head>
<body>

  <header class="site">
    <div class="wrap">
      <a class="brand" href="../index.html">
        <span class="logo-badge"><img src="../assets/img/lms-logo.png" alt="LMS logo" /></span>
        <span>
          LMCS Portal
          <span class="tagline">Grooming to Excellence</span>
        </span>
      </a>
      <nav class="roles" id="header-status"></nav>
    </div>
  </header>

  <main class="wrap">

    <!-- Gate renders inside #gate-slot; whole section hides once signed in -->
    <section class="hero" id="auth-root" style="padding-top:40px;">
      <span class="eyebrow">Coordinator · Staff use only</span>
      <h1>Coordinator Portal</h1>
      <div id="gate-slot"></div>
    </section>

    <div id="app-root" style="display:none">

      <div class="welcome" id="welcome-strip"></div>

      <section class="block" id="modules">
        <h2>Follow-ups and analysis</h2>
        <div class="modules" id="modules-grid"></div>
      </section>

    </div>

  </main>

  <footer class="site">
    <div class="wrap">
      LMCS Portal — internal management system for La Montessori Schools.
    </div>
  </footer>

  <script src="../assets/auth.js"></script>
  <script src="shared.js"></script>
  <script>
    // key = Coord.SECTIONS key (follow-up count shown on the card) or null (no count)
    const CARDS = [
      { key: 'followups', name: 'All follow-ups', url: 'followups/index.html', desc: 'Everything that needs a Coordinator, most urgent first.' },
      { key: 'compliance', name: 'Compliance', url: 'compliance/index.html', desc: 'Campuses and roles behind their Support Session quota this month.' },
      { key: 'approvals', name: 'Approvals', url: 'approvals/index.html', desc: 'Requests waiting too long for a decision, or for the requester to reply.' },
      { key: 'hiring', name: 'Hiring', url: 'hiring/index.html', desc: 'Approved candidates not yet marked Hired, and hires still to be added in the Staff Portal.' },
      { key: 'documents', name: 'Documents', url: 'documents/index.html', desc: 'Staff missing required documents, and certificate files waiting to be verified.' },
      { key: null, name: 'Academics', url: 'academics/index.html', desc: 'CW/HW tag analysis: how each teacher uses the classwork and homework tags.' },
    ];

    function renderCards(counts) {
      document.getElementById('modules-grid').innerHTML = CARDS.map(function (c) {
        let pill = '<span class="status live">Live</span>';
        if (c.key) {
          if (!counts) pill = '<span class="status planned">&hellip;</span>';
          else if (counts === 'error') pill = '<span class="status planned">n/a</span>';
          else pill = counts.n[c.key] ? '<span class="status building">' + counts.n[c.key] + ' open</span>' : '<span class="status live">All clear</span>';
        }
        return '<div class="card"><div class="card-top"><h3><a href="' + c.url + '">' + c.name + '</a></h3>' + pill + '</div><p>' + c.desc + '</p></div>';
      }).join('');
    }

    function showApp(session) {
      document.getElementById('auth-root').style.display = 'none';
      document.getElementById('app-root').style.display = '';
      document.getElementById('header-status').innerHTML = '<span>' + Coord.esc(session.campusName) + '</span>';
      document.getElementById('welcome-strip').innerHTML =
        '<div class="welcome-text">Signed in as <b>' + Coord.esc(session.name) + '</b>' +
        '<span class="welcome-campus">' + Coord.esc(session.campusName) + '</span></div>' +
        '<a href="#" class="signout" id="signout-link">Sign out</a>';
      document.getElementById('signout-link').addEventListener('click', function (e) { e.preventDefault(); LMCS.signOut(); });

      if (!Coord.canUse(session)) {
        document.getElementById('modules').innerHTML = '<p>The Coordinator Portal is only available to Coordinators and the Owner.</p>';
        return;
      }
      Coord.setSession(session);
      renderCards(null);
      Coord.counts().then(renderCards, function () { renderCards('error'); });
    }

    const cachedSession = LMCS.getSession();
    if (cachedSession) showApp(cachedSession);
    else LMCS.requireSession('#gate-slot').then(showApp);
  </script>

</body>
</html>
