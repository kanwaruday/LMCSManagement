<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<meta name="lmcs-moved-to" content="home" />
<title>This page moved to the game</title>
<script>window.LMCS_NO_DOCK = true;</script>
<script src="../assets/auth.js?v=7bb0f6cc"></script>
</head>
<body>
<main style="font:16px/1.5 system-ui,sans-serif;max-width:32rem;margin:15vh auto;padding:0 1rem">
<p>This page moved to the game.</p>
<p><a id="lmcs-moved" href="../index.html">Open it in the game</a></p>
</main>
<script>
// A retired old-portal page (batch (a), 25 Nov): a bookmark or an old link goes on to its screen in the game. A tab a game door
// opened (?from=game, ?only=, or the tab's flag from LMCSGameDoor) stays here with the link, so nobody bounces between the two.
(function () {
  var D = window.LMCSGameDoor, to = document.querySelector('meta[name="lmcs-moved-to"]').getAttribute('content');
  if (!D) return;
  var url = D.GAME + (to === 'home' ? '' : to), stay = true;
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('from') === 'game' || q.has('only')) sessionStorage.setItem(D.FLAG, '1');
    stay = sessionStorage.getItem(D.FLAG) === '1';
  } catch (e) { stay = true; }
  document.getElementById('lmcs-moved').href = url;
  if (!stay) location.replace(url);
})();
</script>
</body>
</html>
