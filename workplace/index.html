<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>LMCS — Your workplace</title>
<meta name="theme-color" content="#CE0000">
<link rel="preconnect" href="https://script.google.com">
<link rel="stylesheet" href="../assets/style.css?v=0049023a">
<link rel="stylesheet" href="../assets/game/game.css?v=37f754ac">
<link rel="stylesheet" href="../assets/game/base.css?v=4774c2bb">
<style>
  body { min-height: 100vh; }
  #lmcs-gate { position: fixed; inset: 0; z-index: 99999; background: #fff; display: flex; align-items: center; justify-content: center; }
  #lmcs-gate .auth-gate { max-width: 380px; margin: 0 auto; padding: 32px 28px; border: 1px solid #ddd; border-top: 3px solid #CE0000; border-radius: 6px; text-align: center; }
  #lmcs-gate #lmcs-g-signin { display: flex; justify-content: center; }
  .wp-room { margin: 0 0 16px; }
  .wp-room h2 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .wp-st { font-size: 14px; font-weight: 700; color: var(--gb-muted); }
  .wp-st.wp-approved { color: var(--gb-ok); } .wp-st.wp-redo { color: var(--gb-low); } .wp-st.wp-pending { color: var(--gb-gold-ink); }
  .wp-line { font-weight: 700; margin: 4px 0; }
  .wp-shots { list-style: none; margin: 10px 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); }
  .wp-grid { grid-template-columns: repeat(3, 1fr); gap: 6px; } .wp-grid .wp-shot { padding: 6px; font-size: 13px; } .wp-grid .wp-img { height: 110px; object-fit: cover; }
  .wp-shot.is-big { grid-column: 1 / -1; } .wp-shot.is-big .wp-img { height: auto; max-height: 75vh; object-fit: contain; }
  .wp-img { cursor: zoom-in; } .wp-shot.is-big .wp-img { cursor: zoom-out; }
  .wp-shot { border: 1.5px solid var(--gb-line); border-radius: 12px; padding: 10px; display: grid; gap: 8px; align-content: start; }
  .wp-shot.is-done { border-color: var(--gb-ok); }
  .wp-shot-h { display: flex; align-items: center; gap: 8px; }
  .wp-n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; background: var(--gb-line); }
  .wp-shot.is-done .wp-n { background: var(--gb-ok); color: #fff; }
  .wp-img { display: block; width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; background: var(--gb-line); }
  .wp-take { position: relative; min-height: 48px; justify-content: center; cursor: pointer; }
  .wp-file { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .wp-take:focus-within { outline: 3px solid var(--gb-focus); outline-offset: 2px; }
  .wp-tick { display: flex; align-items: center; gap: 10px; min-height: 48px; font-weight: 700; }
  .wp-tick input { width: 24px; height: 24px; }
  .wp-send { width: 100%; min-height: 52px; }
  .wp-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; } .wp-row .gb-btn { flex: 1; min-height: 48px; }
  .wp-msg { margin: 8px 0 0; font-weight: 700; } .wp-msg:empty { display: none; }
  textarea.gb-input { width: 100%; box-sizing: border-box; }
</style>
</head>
<body class="gb">
<div id="lmcs-gate"><div id="lmcs-gate-slot"></div></div>
<script src="../assets/auth.js?v=da662521"></script>
<script src="../assets/game/emoji.js?v=9abef414"></script>
<script src="../assets/game/workplace-chain.js?v=89cbdc9e"></script>

<header class="gb-head"><div><div><h1 id="wp-title" data-emoji="photo">Your workplace</h1><p id="wp-sub">Photograph your room: the whole room, your desk, the cupboard</p></div><a id="wp-back" href="../"><span aria-hidden="true">&lsaquo;</span> Back</a></div></header>
<main class="gb-page" id="wp-root"></main>

<script>
(function () {
  var GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // same value as office/js/config.js
  var q = new URLSearchParams(location.search), review = q.get('review') === '1';
  var campus = (q.get('campus') || '').toUpperCase(); if (!/^LMS[1-6]$/.test(campus)) campus = '';
  // back to where the quest was opened from (same site only), else the portal chooser
  try { var r = new URL(document.referrer); if (r.origin === location.origin && r.pathname !== location.pathname) document.getElementById('wp-back').href = r.pathname + r.search; } catch (e) { /* no referrer */ }
  if (review) { document.getElementById('wp-title').textContent = 'Check workplace photos'; LMCSEmoji.decorate(document.querySelector('.gb-head')); document.getElementById('wp-sub').textContent = 'Approve each room, or ask for a redo with a reason'; }
  function start(session) {
    document.getElementById('lmcs-gate').style.display = 'none';
    LMCSWorkplace.mount(document.getElementById('wp-root'), { session: session, backendUrl: GAME_BACKEND_URL, review: review, campus: campus, room: q.get('room') || '' });
  }
  (LMCS.getSession() ? Promise.resolve(LMCS.getSession()) : LMCS.requireSession('#lmcs-gate-slot')).then(function (s) { start(s || LMCS.getSession()); });
})();
</script>
</body>
</html>
