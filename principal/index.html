<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMCS Portal — Principal</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="../assets/style.css?v=0049023a" />
  <link rel="stylesheet" href="../assets/game/game.css?v=ee9ca522" />
  <link rel="stylesheet" href="../assets/game/base.css?v=4774c2bb" />
  <style>
    /* hub only: the paths. Everything else comes from base.css (gb-) and style.css (the sign-in gate, appointments). */
    #base-name .gb-emoji { margin-right:.3em; }
    /* the Owner viewing this school (owner/kingdom.html's hidden switcher): one thin bar, read only */
    .gb-viewbar { display:flex; flex-wrap:wrap; align-items:center; gap:4px 12px; margin:0 0 10px; padding:6px 12px; border-radius:10px; background:var(--gb-ink); color:#fff; font-size:14px; }
    .gb-viewbar button { min-height:44px; min-width:44px; padding:0 14px; border:1.5px solid #fff; border-radius:10px; background:transparent; color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    .gb-viewbar button:focus-visible { outline:3px solid #fff; outline-offset:2px; }
  </style>
</head>
<body class="gb gb-app">

  <!-- The screen skeleton (assets/game/base.css): header, then the game bar, the stage (Today, which carries the next step,
       then the school's three paths) and the panels. The way back is the portal home (the role chooser). -->
  <header class="gb-head"><div><div id="welcome-strip"><h1>Principal portal</h1><p id="hub-hello">La Montessori Schools</p></div><a href="../index.html"><span aria-hidden="true">&lsaquo;</span> Portal home</a></div></header>
  <div class="gb-shell">
    <nav class="gb-rail" id="game-rail" aria-label="Game" hidden></nav>
    <main class="gb-stage">
      <!-- Gate renders inside #gate-slot; whole section hides once signed in -->
      <section class="hero" id="auth-root" style="padding-top:24px;">
        <h2>Sign in to the Principal portal</h2>
        <div id="gate-slot"></div>
      </section>
      <div id="app-root" style="display:none">
        <p class="gb-viewbar" id="view-bar" role="status" hidden><span id="view-bar-t"></span><button type="button" id="view-leave">Leave</button></p>
        <div class="gb-next-slot"></div>
        <section id="game-root" aria-label="Today with Buddy" hidden></section>
        <!-- 🏠 Home Base (the school building and its rooms) or 🗺️ World (the school's routes): Uday, 28 Oct -->
        <div class="gb-switch" role="group" aria-label="View">
          <button type="button" id="view-home" aria-pressed="true" aria-controls="modules"><span data-emoji="school"></span>School</button>
          <button type="button" id="view-world" aria-pressed="false" aria-controls="world"><span data-emoji="bus"></span>Routes</button>
        </div>
        <section class="gb-base" id="modules" aria-labelledby="base-h"><div class="gb-base-in">
          <p class="gb-base-h" id="base-h"><span id="base-name">Your school</span><span class="gb-base-lv" id="base-lv"></span></p>
          <!-- the building in 3D (Uday, 28 Oct). Drawn from a building model; a sample shape until the campus's own plan is set -->
          <div class="sb-box" id="school-3d"></div>
          <p class="sb-said" id="school-said" role="status">Tap a room. The gold ones open your work today.</p>
          <div class="gb-rooms" id="rooms"><!-- filled in by JS: one room per path, then the setup room --></div>
        </div></section>
        <section id="world" aria-label="Your school's routes" hidden>
          <div id="world-map"></div>
        </section>
      </div>
    </main>
    <aside class="gb-panels" id="panels" aria-label="More" hidden>
      <details class="gb-panel"><summary data-emoji="appointments">Appointments</summary><div class="gb-panel-b" id="appt-box"></div></details>
      <details class="gb-panel"><summary data-emoji="account">Account</summary><div class="gb-panel-b"><a href="#" class="gb-btn" id="signout-link">Sign out</a></div></details>
    </aside>
  </div>

  <footer class="site">
    <div class="wrap">
      LMCS Portal — internal management system for La Montessori Schools.
    </div>
  </footer>

  <script src="../assets/auth.js?v=f290ea90"></script>
  <script src="../assets/game/event.js?v=14110333" data-roles="Principal"></script>
  <script src="../assets/game/game.js?v=7edab4a3"></script>
  <script src="../assets/game/emoji.js?v=73c82a00"></script>
  <script src="../assets/game/school-building.js?v=9412edb2"></script>
  <script src="../assets/game/school-models.js?v=4c8049df"></script>
  <script src="../assets/game/rail.js?v=e726bf9c"></script>
  <script src="../coordinator/route-map.js?v=f5e47aee"></script>
  <script src="../assets/appointments.js?v=5dfa5b13"></script>
  <script>
    const GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // Task 11 sets this at deploy; empty = the game panel renders nothing
    const COORD_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbwilcvrgZQga_qo1A-fBTUzKLifrBYIwlPHoWMITmchf5sZOYjKIJ7_4J0TeBF_-6B6/exec'; // transportworld (apps-script/coordinator-world.gs)
    const PDR_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzpkFLy4KvTdSJfioz6wlgRGLjvO_GvbffhOYBb-hHybFtjGTk0ps-GzXz0FrQ9GmYdfg/exec';
    // The school building's rooms, in the order a Principal works: the day, then people, then the rules; each room holds its pages.
    // HR & Hiring is its own path (Uday, 28 Oct 2026: "as a principal, they are also responsible for Hiring & HR"); its pages
    // are the same ones as before, for the Principal's own school. Counts would need the hiring and staff data, which this hub
    // doesn't load, so the rows say what each page holds instead.
    const PATHS = [
      { title: 'Daily work', e: 'day', host: 'daily', lead: 'Your reports and what came out of them.', pages: [
        { name: "Principal's Daily Reporting", e: 'dailyReport', url: '../principals-daily-reporting/index.html', desc: 'Your daily report and its dashboard.' },
        { name: 'Daily-report issues', e: 'issues', url: 'issues.html', desc: 'Close each issue with a line on what was done. A Coordinator can reopen it.' },
        { name: 'Curriculum & Progress', e: 'curriculum', url: '../curriculum-progress/daily-progress.html', desc: 'Daily CW/HW against the Annual Curriculum Plan.' },
      ] },
      // Its own room (not nested under Daily work) per the game director,
      // 2026-10-28: host:'ss' is read by the Home Base 3D building to mark
      // this room gold once 'ss' joins its HOSTS list below. One row per
      // form, all pointing at the SAME page/role picker
      // (support-sessions.html?role=), not 6 separate pages -- the rubric
      // shape still comes from exactly one place (ssformmeta) either way.
      { title: 'Support Sessions', e: 'supportSession', host: 'ss', lead: 'Evaluate a staff member against their rubric.', pages: [
        { name: 'Teacher SS', e: 'supportSession', url: 'support-sessions.html?role=teacher', desc: 'Evaluate a Teacher.' },
        { name: 'IT Teacher SS', e: 'supportSession', url: 'support-sessions.html?role=itComputer', desc: 'Evaluate an IT Teacher.' },
        { name: 'PTI SS', e: 'supportSession', url: 'support-sessions.html?role=pti', desc: 'Evaluate a PTI.' },
        { name: 'Fee Clerk SS', e: 'supportSession', url: 'support-sessions.html?role=feeClerkPRO', desc: 'Evaluate a Fee Clerk.' },
        { name: 'Non-Teaching SS', e: 'supportSession', url: 'support-sessions.html?role=nonTeaching', desc: 'Evaluate a Non-Teaching staff member.' },
        { name: 'Driver Cum Peon SS', e: 'supportSession', url: 'support-sessions.html?role=driverCumPeon', desc: 'Evaluate a Driver cum Peon.' },
      ] },
      { title: 'HR & Hiring', e: 'hiring', host: 'hr', lead: 'Your school\'s applicants and staff.', pages: [
        { name: 'Hiring Dashboard', e: 'applicants', url: '../hiring/index.html', desc: 'Applicants from screening to offer: see who needs your next step.' },
        { name: 'Staff documents and directory', e: 'documents', url: '../staff/add-employee.html', desc: 'Your staff list. Upload any missing documents.' },
        { name: 'Salary Dashboard', e: 'salary', url: '../salary/index.html', desc: 'The offer-letter salary for an applicant at the Salary Offer stage.' },
      ] },
      { title: 'Rules', e: 'rules', host: 'rules', lead: 'Conduct, leave and job roles, as the school has set them.', pages: [
        { name: 'Bye Laws', e: 'byeLaws', url: 'https://kanwaruday.github.io/LMCSByeLaws/', desc: 'The rulebook of record.' },
      ] },
    ];

    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
    // a room: a tile that opens across the row to show what's inside (base.css .gb-room)
    function room(e, title, small, body, next, host) {
      const d = el('details', 'gb-room' + (next ? ' is-next' : '')), sum = el('summary');
      d.dataset.room = title; if (host) d.dataset.host = host;
      const ic = el('span', 'gb-room-e', window.LMCSEmoji ? LMCSEmoji.get(e) : ''); ic.setAttribute('aria-hidden', 'true');
      sum.appendChild(ic); sum.appendChild(el('span', 'gb-room-t', title)); sum.appendChild(el('span', 'gb-room-s', small));
      const b = el('div', 'gb-room-b'); b.appendChild(body);
      d.appendChild(sum); d.appendChild(b);
      return d;
    }
    function pageList(pages) {
      const ul = el('ul', 'gb-list');
      pages.forEach(function (m) {
        const a = el('a', 'gb-go'), span = el('span', '', m.name);
        if (window.LMCSEmoji && LMCSEmoji.get(m.e)) span.insertBefore(LMCSEmoji.tag(m.e), span.firstChild);
        a.href = m.url;
        span.appendChild(el('small', '', m.desc));
        a.appendChild(span);
        const li = el('li'); li.appendChild(a); ul.appendChild(li);
      });
      return ul;
    }
    // the school's buildings from the Kingdom (gamekingdom: a Principal gets their own base only). Read-only here.
    // Each building: its level of maxLevel and the next step that isn't "soon"; a step the game can link to gets its link.
    function setupBody(base) {
      if (!base) return el('p', 'gb-muted', GAME_BACKEND_URL ? 'Loading your buildings… If this stays, the setup progress couldn\'t be loaded; nothing is lost.' : 'The game isn\'t switched on yet, so building levels don\'t show.');
      const ul = el('ul', 'gb-list');
      (base.buildings || []).forEach(function (b) {
        const next = (b.tiers || []).filter(function (t) { return t.state === 'open'; })[0];
        const href = next && next.go && window.LMCSGame ? LMCSGame.safeHref(next.go, '../') : null;
        const row = el(href ? 'a' : 'div', href ? 'gb-go' : 'gb-go is-static'), span = el('span', '', b.name);
        if (href) row.href = href;
        span.appendChild(el('small', '', 'Level ' + (Number(b.level) || 0) + ' of ' + (Number(b.maxLevel) || 0) + (next ? ' · next: ' + next.label : ' · nothing open')));
        row.appendChild(span);
        const li = el('li'); li.appendChild(row); ul.appendChild(li);
      });
      return ul;
    }
    function steps(base) {
      let done = 0, total = 0;
      (base && base.buildings || []).forEach(function (b) { (b.tiers || []).forEach(function (t) { if (t.state === 'done' || t.state === 'open') { total++; if (t.state === 'done') done++; } }); });
      return { done: done, total: total };
    }
    function renderHome(base) {
      const rooms = document.getElementById('rooms');
      const open = [].map.call(rooms.querySelectorAll('.gb-room[open]'), function (d) { return d.dataset.room; }); // a re-render keeps what was open
      rooms.textContent = '';
      PATHS.forEach(function (p) { rooms.appendChild(room(p.e, p.title, p.lead, pageList(p.pages), false, p.host)); });
      const st = steps(base);
      rooms.appendChild(room('quests', 'Setup quests', base && st.total ? st.done + ' of ' + st.total + ' steps built' : 'Your school\'s buildings', setupBody(base), !!base && st.done < st.total, 'setup'));
      [].forEach.call(rooms.children, function (d) { if (open.indexOf(d.dataset.room) !== -1) d.open = true; });
      document.getElementById('base-lv').textContent = base ? (window.LMCSEmoji ? LMCSEmoji.get('level') + ' ' : '') + 'Level ' + (Number(base.level) || 0) : '';
    }
    function loadBase(session) {
      renderHome(null);
      if (!GAME_BACKEND_URL) return; // the game is off: the rooms show, the setup room says so plainly
      fetch(GAME_BACKEND_URL + '?action=gamekingdom&idToken=' + encodeURIComponent(session.idToken || '') + LMCSGame.viewParam(), { cache: 'no-store' })
        .then(function (r) { return r.json(); })
        .then(function (d) { renderHome(d && d.success && d.kingdom && (d.kingdom.campuses || [])[0] || null); if (d && d.building) drawSchool(session, d.building); })
        .catch(function (e) { console.warn('home base', e); }); // the rooms already show; setup says it couldn't load
    }
    // the 3D school: the campus's own building model (assets/game/school-models.js; later Game Config, via d.building) when
    // there is one, else the sample shape with this school's name, marked sample. A tap on a gold room opens its Home Base
    // room below; other rooms say what will live there later.
    let BUILDING = null, CENTRED = false;
    const HOSTS = ['daily', 'hr', 'rules', 'setup'];
    const LATER = { classroom: 'class teacher, CW/HW done today and attendance will show here', store: 'its inventory will show here',
      busbay: 'it will open your school\'s routes', lab: 'its equipment will show here', computer: 'its equipment will show here', library: 'its books will show here' };
    function drawSchool(session, model) {
      if (typeof LMCSBuilding === 'undefined') return;
      const own = model || (typeof LMCSBuildingModels !== 'undefined' && LMCSBuildingModels[session.campus]) || null;
      BUILDING = LMCSBuilding.clean(own) || LMCSBuilding.clean(Object.assign({}, LMCSBuilding.SAMPLE, { name: session.campusName, campus: session.campus, sample: true }));
      const box = document.getElementById('school-3d');
      const keep = box.scrollLeft;
      box.innerHTML = LMCSBuilding.svg(BUILDING, { hosts: HOSTS }); // every label is escaped inside svg()
      if (CENTRED) box.scrollLeft = keep; else centre();
    }
    // phones: start with the middle of the school in view, once, and only when the box can be measured (not while hidden)
    function centre() {
      const box = document.getElementById('school-3d');
      if (CENTRED || !box.clientWidth || !box.firstElementChild) return; // nothing drawn yet, or hidden: try again later
      box.scrollLeft = Math.max(0, (box.scrollWidth - box.clientWidth) / 2); CENTRED = true;
    }
    function pickRoom(id) {
      const r = BUILDING && LMCSBuilding.rooms(BUILDING).filter(function (x) { return x.id === id; })[0];
      if (!r) return;
      [].forEach.call(document.querySelectorAll('#school-3d .sb-room'), function (g) { g.classList.toggle('is-picked', g.getAttribute('data-room') === id); });
      const said = document.getElementById('school-said');
      const tile = r.host ? [].filter.call(document.querySelectorAll('#rooms .gb-room'), function (d) { return d.dataset.host === r.host; })[0] : null;
      if (tile) { tile.open = true; tile.scrollIntoView({ block: 'nearest' }); said.textContent = r.name + ': opened below.'; tile.querySelector('summary').focus(); return; }
      said.textContent = r.name + (r.holds && r.name.indexOf(r.holds) === -1 ? ' (' + r.holds + ')' : '') + (LATER[r.type] ? ': ' + LATER[r.type] + ' later.' : '.');
    }
    function wireSchool() {
      const box = document.getElementById('school-3d');
      box.addEventListener('click', function (e) { const g = e.target.closest('.sb-room'); if (g) pickRoom(g.getAttribute('data-room')); });
      box.addEventListener('keydown', function (e) { const g = e.target.closest('.sb-room'); if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pickRoom(g.getAttribute('data-room')); } });
    }
    function showView(world) {
      document.getElementById('modules').hidden = world;
      document.getElementById('world').hidden = !world;
      document.getElementById('view-home').setAttribute('aria-pressed', String(!world));
      document.getElementById('view-world').setAttribute('aria-pressed', String(world));
      if (!world) centre();
      // the World: the school's bus routes and stops (Fleet Command's route map, read only, this campus only, no money), loaded once
      else if (!worldMap) worldMap = LMCSRouteMap.mount(document.getElementById('world-map'), { session: LMCS.getSession(), backendUrl: COORD_BACKEND_URL, mode: 'metro', campus: VIEW ? VIEW.campus : undefined });
    }
    let worldMap = null;

    function hello(name) {
      const h = new Date().getHours(), first = String(name || '').trim().split(/\s+/)[0];
      return (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + (first ? ', ' + first + ' ji' : '');
    }

    // The Owner viewing this school as its Principal sees (set by owner/kingdom.html; LMCSGame.viewAs, sessionStorage). Only a session
    // that can open the Owner portal keeps it; the game backend checks the Owner again and answers read only. Other backends (PDR,
    // Coordinator) don't know about it, so the bar says "Game view only".
    let VIEW = null;
    function viewSession(session) {
      VIEW = LMCSGame.viewAs();
      if (VIEW && !LMCS.canViewOwnerPortal(session)) { LMCSGame.setViewAs(null); VIEW = null; }
      if (!VIEW) return session;
      document.getElementById('view-bar-t').textContent = 'Viewing ' + VIEW.name + ' as the Owner · Game view only';
      document.getElementById('view-bar').hidden = false;
      document.getElementById('view-leave').addEventListener('click', function () { LMCSGame.setViewAs(null); location.href = '../owner/kingdom.html'; });
      return Object.assign({}, session, { campus: VIEW.campus, campusName: VIEW.name });
    }

    function showApp(session) {
      session = viewSession(session);
      document.getElementById('auth-root').style.display = 'none';
      document.getElementById('app-root').style.display = '';

      document.getElementById('hub-hello').textContent = VIEW ? 'Principal · ' + session.campusName : hello(session.name) + ' · Principal · ' + session.campusName;
      document.getElementById('panels').hidden = false;
      LMCSRail.mount(document.getElementById('game-rail'), { hub: 'index.html', root: '../' });

      document.getElementById('signout-link').addEventListener('click', function (e) {
        e.preventDefault();
        LMCS.signOut();
      });

      document.getElementById('base-name').textContent = session.campusName;
      if (window.LMCSEmoji) document.getElementById('base-name').insertBefore(LMCSEmoji.tag('base'), document.getElementById('base-name').firstChild);
      document.getElementById('view-home').addEventListener('click', function () { showView(false); });
      document.getElementById('view-world').addEventListener('click', function () { showView(true); });
      wireSchool(); drawSchool(session, null);
      loadBase(session);
      if (!VIEW) LMCSAppts.mount(document.getElementById('appt-box'), { backendUrl: PDR_BACKEND_URL, session: session }); // the Owner's own appointments: not this school's
      if (typeof LMCSGame !== 'undefined') { try { LMCSGame.mount(document.getElementById('game-root'), { session: session, backendUrl: GAME_BACKEND_URL, root: '../' }); } catch (e) { console.warn('game layer', e); } }
    }

    // Fast path: a cached, valid session shows the app immediately instead
    // of waiting on a live allowlist re-check (that fetch alone can take
    // 20s+ — see the perf audit) — same pattern every module page already
    // uses for its own gate. Falls back to requireSession() (which re-
    // validates the cached session against the allowlist) if there's no
    // cached session to show yet.
    const cachedSession = LMCS.getSession();
    if (cachedSession) {
      showApp(cachedSession);
    } else {
      LMCS.requireSession('#gate-slot').then(showApp);
    }
  </script>

</body>
</html>
