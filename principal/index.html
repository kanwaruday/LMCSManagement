<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LMCS Portal — Principal</title>
  <link rel="preconnect" href="https://script.google.com">
  <link rel="preconnect" href="https://accounts.google.com">
  <link rel="stylesheet" href="../assets/style.css?v=0049023a" />
  <link rel="stylesheet" href="../assets/game/game.css?v=ee9ca522" />
  <link rel="stylesheet" href="../assets/game/base.css?v=128c71f9" />
  <style>
    /* hub only: the paths. Everything else comes from base.css (gb-) and style.css (the sign-in gate, appointments). */
    .pp-paths h2 { margin:22px 0 2px; }
    .pp-paths .gb-muted { margin:0 0 6px; }
  </style>
</head>
<body class="gb gb-app">

  <!-- The screen skeleton (assets/game/base.css): header, then the game bar, the stage (Today, which carries the next step,
       then the school's three paths) and the panels. The way back is the portal home (the role chooser). -->
  <header class="gb-head"><div><div id="welcome-strip"><h1>Principal portal</h1><p id="hub-hello">La Montessori Schools</p></div><a href="../index.html"><span aria-hidden="true">&lsaquo;</span> Portal home</a></div></header>
  <div class="gb-shell">
    <nav class="gb-rail" id="game-rail" aria-label="Game" hidden></nav>
    <main class="gb-stage">
      <!-- Gate renders inside #gate-slot; whole section hides once signed in -->
      <section class="hero" id="auth-root" style="padding-top:24px;">
        <h2>Sign in to the Principal portal</h2>
        <div id="gate-slot"></div>
      </section>
      <div id="app-root" style="display:none">
        <section id="game-root" aria-label="Today with Buddy" hidden></section>
        <nav class="pp-paths" id="modules" aria-label="Your school's work">
          <!-- filled in by JS: one heading per path, its pages as gb-go rows -->
        </nav>
      </div>
    </main>
    <aside class="gb-panels" id="panels" aria-label="More" hidden>
      <details class="gb-panel"><summary>Appointments</summary><div class="gb-panel-b" id="appt-box"></div></details>
      <details class="gb-panel"><summary>Account</summary><div class="gb-panel-b"><a href="#" class="gb-btn" id="signout-link">Sign out</a></div></details>
    </aside>
  </div>

  <footer class="site">
    <div class="wrap">
      LMCS Portal — internal management system for La Montessori Schools.
    </div>
  </footer>

  <script src="../assets/auth.js?v=df0cbfd3"></script>
  <script src="../assets/game/game.js?v=3790d90c"></script>
  <script src="../assets/game/rail.js?v=4b2c2dd5"></script>
  <script src="../assets/appointments.js?v=5dfa5b13"></script>
  <script>
    const GAME_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbyyk7XpT86JqZRQ3ldFxesPw4ICK6WVAdsgsecEzWPViKasRs4agbYJ3Re_y_lY7mxyCA/exec'; // Task 11 sets this at deploy; empty = the game panel renders nothing
    const PDR_BACKEND_URL = 'https://script.google.com/macros/s/AKfycbzpkFLy4KvTdSJfioz6wlgRGLjvO_GvbffhOYBb-hHybFtjGTk0ps-GzXz0FrQ9GmYdfg/exec';
    // The hub's paths, in the order a Principal works: the day, then people, then the rules. Each page is a gb-go row.
    // HR & Hiring is its own path (Uday, 28 Oct 2026: "as a principal, they are also responsible for Hiring & HR"); its pages
    // are the same ones as before, for the Principal's own school. Counts would need the hiring and staff data, which this hub
    // doesn't load, so the rows say what each page holds instead.
    const PATHS = [
      { title: 'Daily work', lead: 'Your reports and what came out of them.', pages: [
        { name: "Principal's Daily Reporting", url: '../principals-daily-reporting/index.html', desc: 'Your daily report, teachers\' SS and their dashboards.' },
        { name: 'Daily-report issues', url: 'issues.html', desc: 'Close each issue with a line on what was done. A Coordinator can reopen it.' },
        { name: 'Curriculum & Progress', url: '../curriculum-progress/daily-progress.html', desc: 'Daily CW/HW against the Annual Curriculum Plan.' },
      ] },
      { title: 'HR & Hiring', lead: 'Your school\'s applicants and staff.', pages: [
        { name: 'Hiring Dashboard', url: '../hiring/index.html', desc: 'Applicants from screening to offer: see who needs your next step.' },
        { name: 'Staff documents and directory', url: '../staff/add-employee.html', desc: 'Your staff list. Upload any missing documents.' },
        { name: 'Salary Dashboard', url: '../salary/index.html', desc: 'The offer-letter salary for an applicant at the Salary Offer stage.' },
      ] },
      { title: 'Rules', lead: 'Conduct, leave and job roles, as the school has set them.', pages: [
        { name: 'Bye Laws', url: 'https://kanwaruday.github.io/LMCSByeLaws/', desc: 'The rulebook of record.' },
      ] },
    ];

    function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text) e.textContent = text; return e; }
    function renderPaths() {
      const nav = document.getElementById('modules');
      nav.textContent = '';
      PATHS.forEach(function (p) {
        nav.appendChild(el('h2', '', p.title));
        if (p.lead) nav.appendChild(el('p', 'gb-muted', p.lead));
        const ul = el('ul', 'gb-list');
        p.pages.forEach(function (m) {
          const a = el('a', 'gb-go'), span = el('span', '', m.name);
          a.href = m.url;
          span.appendChild(el('small', '', m.desc));
          a.appendChild(span);
          const li = el('li'); li.appendChild(a); ul.appendChild(li);
        });
        nav.appendChild(ul);
      });
    }

    function hello(name) {
      const h = new Date().getHours(), first = String(name || '').trim().split(/\s+/)[0];
      return (h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening') + (first ? ', ' + first + ' ji' : '');
    }

    function showApp(session) {
      document.getElementById('auth-root').style.display = 'none';
      document.getElementById('app-root').style.display = '';

      document.getElementById('hub-hello').textContent = hello(session.name) + ' · Principal · ' + session.campusName;
      document.getElementById('panels').hidden = false;
      LMCSRail.mount(document.getElementById('game-rail'), { hub: 'index.html', root: '../' });

      document.getElementById('signout-link').addEventListener('click', function (e) {
        e.preventDefault();
        LMCS.signOut();
      });

      renderPaths();
      LMCSAppts.mount(document.getElementById('appt-box'), { backendUrl: PDR_BACKEND_URL, session: session });
      if (typeof LMCSGame !== 'undefined') { try { LMCSGame.mount(document.getElementById('game-root'), { session: session, backendUrl: GAME_BACKEND_URL, root: '../' }); } catch (e) { console.warn('game layer', e); } }
    }

    // Fast path: a cached, valid session shows the app immediately instead
    // of waiting on a live allowlist re-check (that fetch alone can take
    // 20s+ — see the perf audit) — same pattern every module page already
    // uses for its own gate. Falls back to requireSession() (which re-
    // validates the cached session against the allowlist) if there's no
    // cached session to show yet.
    const cachedSession = LMCS.getSession();
    if (cachedSession) {
      showApp(cachedSession);
    } else {
      LMCS.requireSession('#gate-slot').then(showApp);
    }
  </script>

</body>
</html>
